{% extends "base.html" %}
{% import "_piezas.html" as p with context %}
{% set seccion_activa = 'newsletter' %}
{% block contenido %}
<section class="banda banda--pagina">
  <div class="envoltura banda__solo">
    <p class="antetitulo">{{ t.newsletter }}</p>
    <h1 class="banda__titulo banda__titulo--xl">{{ t.nl_titulo }}</h1>
    <p class="banda__texto">{{ textos_sitio.newsletter }}</p>
    {{ p.form_newsletter('pagina') }}
    <p class="nota">{{ t.nl_baja }}</p>
  </div>
</section>
{% endblock %}
