# Banner de publicidad encima de la noticia principal de la portada.
# Para cambiar de anunciante: nueva imagen en estaticos/img/publicidad/ (1200x300 y, si hay, versión móvil)
# y cambiar marca/enlace/alt. Para quitarlo: activo: false.
publicidad:
  portada:
    activo: true
    marca: PadelPROShop
    enlace: "https://padelproshop.com"
    imagen: img/publicidad/padelproshop.jpg            # 1200x300
    imagen_movil: img/publicidad/padelproshop-movil.jpg  # 770x300 (logo + código, se lee en el móvil)
    alt: "PadelPROShop: código BOLAPADEL, 10 % de descuento"

# Códigos de descuento de los patrocinadores (salen en el podcast).
# Para cambiar un código o añadir una marca, edita esta lista.
codigos_descuento:
  - {marca: PadelPROShop, url: "https://padelproshop.com", codigo: BOLAPADEL, descuento: "10%"}
  - {marca: Acepad, url: "https://acepadshop.com", codigo: BOLAPADEL, descuento: "10%"}
  - {marca: Samogrip, url: "https://samogrip.com", codigo: Bolapadel10, descuento: "10%"}

textos:
  es:
    lema: "Pádel profesional. Sin ruido."
    descripcion: "Bola Pádel: actualidad del circuito profesional de pádel, opinión, podcast y newsletter semanal."
    newsletter: "Cada semana, en tu correo: lo que ha pasado en el pádel y lo que pienso de ello."
    podcast: "Tertulia de pádel sin guion, con colaboradores en España y Argentina. Entre 40 y 45 minutos."
    podcast_datos: ["Tertulia sin guion", "40-45 min", "España · Argentina"]
  en:
    lema: "Pro padel. No noise."
    descripcion: "Bola Pádel: pro padel tour news, opinion, podcast and a weekly newsletter."
    newsletter: "Every week, in your inbox: what happened in padel and what I think about it. Written in Spanish."
    podcast: "An unscripted padel roundtable with contributors in Spain and Argentina. Forty to forty-five minutes, in Spanish."
    podcast_datos: ["Unscripted roundtable", "40-45 min", "Spain · Argentina"]
