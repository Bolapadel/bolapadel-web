# ==========================================================================
# PLANTILLA DE NOTICIA — BOLA PÁDEL
# Cada noticia es un archivo en contenido/noticias/ con este formato.
# Nombre del archivo: AAAA-MM-DD-palabras-clave.yml
# Este archivo de ejemplo NO se publica (está fuera de la carpeta noticias).
# ==========================================================================

fecha: 2026-10-18            # día de publicación (AAAA-MM-DD)
seccion: actualidad          # actualidad | opinion | podcast
autor: Luis González         # si se deja vacío, se usa el autor por defecto
destacada: false             # true = va arriba del todo en la portada
etiquetas: [Torneo, Jugador 1, Jugador 2]   # la primera aparece junto a la sección

portada:
  imagen: ""                 # foto propia o con derechos (p. ej. img/noticias/milano.jpg). Vacío = portada gráfica
  credito: ""                # autor de la foto, si la hay
  rotulo: "Milano P1"        # texto grande de la portada gráfica (corto: 1-3 palabras o un marcador)
  dato: "Final · 18 oct"     # etiqueta pequeña de la portada gráfica

es:
  slug: palabras-clave-de-la-url        # minúsculas, sin tildes, separadas por guiones
  titulo: "Titular claro, sin trampa"
  entradilla: "Una o dos frases que cuentan lo esencial."
  seo_titulo: "Titular para Google (máx. 60 caracteres)"
  seo_descripcion: "Resumen para Google y redes sociales, entre 120 y 160 caracteres. Debe incluir la palabra clave de forma natural."
  palabra_clave: "palabra clave principal"
  cuerpo: |
    Texto en Markdown. Frases cortas. Párrafos cortos.

    ## Un subtítulo

    - Listas con guiones
    - **Negrita** con dos asteriscos

    | Tabla | De | Resultados |
    |---|---|---|
    | Pareja A | Pareja B | 6-4 · 6-3 |

en:
  slug: english-url-keywords
  titulo: "English headline"
  entradilla: "One or two sentences with the essentials."
  seo_titulo: "Headline for Google (max 60 characters)"
  seo_descripcion: "Summary for Google and social media, 120 to 160 characters, including the keyword naturally."
  palabra_clave: "main keyword"
  cuerpo: |
    Same text, in English.
