es:
  slug: roglan-aragon-remontan-navarro-di-nenno-dubai-p1
  titulo: "Roglan y Aragón remontan a Paquito y Di Nenno y ya están en octavos del Dubái P1"
  entradilla: "Venían de la previa y empezaron perdiendo 6-0 contra los cuartos cabezas de serie. Acabaron ganando 0-6, 6-4 y 6-2. Juntos, son sus primeros octavos en un Premier."
  seo_titulo: "Roglan y Aragón remontan a Paquito y Di Nenno en Dubái"
  seo_descripcion: "Albert Roglan y Manu Aragón, desde la previa, ganan 0-6, 6-4 y 6-2 a Paquito Navarro y Di Nenno y juegan sus primeros octavos juntos en el Dubái P1."
  palabra_clave: "Roglan y Aragón Dubái P1"
  cuerpo: |
    Roglan y Aragón empezaron perdiendo 6-0.

    Enfrente, Paquito Navarro y Martín Di Nenno, cuartos cabezas de serie del Dubái P1. En la pista central.

    Hora y media después, el marcador decía otra cosa: 0-6, 6-4 y 6-2. Para ellos.

    «Sin palabras equipo, ¡qué partidazo!», dijo Aragón al acabar.

    ## Cuatro partidos en cuatro días

    Su Dubái empezó el domingo, en la previa.

    - **Domingo:** 6-2 y 6-1 a Moragues y Fonteny.
    - **Lunes:** 6-4, 3-6 y 6-4 a Nunes y Sans. Ya estaban en el cuadro.
    - **Martes:** 6-7, 6-4 y 7-6 a Valdés y Núñez, otra pareja de la previa. Dos horas y 43 minutos.
    - **Miércoles:** Paquito y Di Nenno.

    Más de siete horas de pista en cuatro días. Cuatro victorias.

    ## Quiénes son

    Manu Aragón tiene 20 años. Es de Campillos (Málaga) y juega de revés.

    Albert Roglan tiene 27. Es de Tortosa y juega de drive.

    Juegan juntos desde mayo. Casi todo su año ha sido circuito FIP y previas de Premier. En septiembre jugaron la final del FIP Gold de Bucarest. Hace diez días, las semifinales del de Turín.

    En Premier, su techo eran los dieciseisavos. En junio, en el Italy Major, cayeron en esa ronda con Lebrón y Augsburger. Nunca habían ganado juntos a una pareja cabeza de serie en un cuadro de Premier.

    Hoy, en la misma ronda, han ganado a los cuartos.

    ## Lo que vale

    Paquito y Di Nenno volvieron a jugar juntos en junio, en ese mismo Italy Major.

    Desde entonces, trece torneos. En todos ganaron al menos un partido. En cuatro llegaron a semifinales.

    Dubái era el decimocuarto. Y hoy se han quedado en el primero.

    No es un dato contra ellos. Es la medida de lo que han hecho Roglan y Aragón.

    El jueves, octavos contra Abbate y Dal Bianco, que también han dejado fuera a unos cabezas de serie: 4-6, 6-1 y 6-4 a Álex Ruiz y Javi García (13). Una de las dos parejas estará en cuartos.

    ## La pareja lucky loser ya tiene nombre

    [Ayer contamos](/actualidad/coello-tapia-baja-dubai-p1-lesion-tapia/) que el sitio de Coello y Tapia lo ocuparía una pareja lucky loser. Son Marcos González y Diego García.

    <figure><img src="/img/noticias/dubai-p1-2026-gonzalez-garcia-lucky-loser.jpg" alt="Marcos González y Diego García hablan entre puntos en el Dubái P1" width="1280" height="1600" loading="lazy"><figcaption>Marcos González y Diego García, la pareja lucky loser. Imagen: Premier Padel</figcaption></figure>

    Perdieron en la previa. Entraron por la baja de los número uno. Y hoy han ganado a Chozas y Rubini: 6-4, 3-6 y 7-6, con el tie-break del tercero 9-7. Dos horas y media, el partido más largo del día.

    Marcos tiene 21 años y es de Málaga. Diego, 20, de La Línea.

    Diego ya sabe lo que es ganar un Premier. En 2025, con 18 años, ganó el P2 de Gijón con Francisco Cabeza. La final fue contra Tolito Aguirre y Gonzalo Alfonso.

    El jueves se vuelve a encontrar a Alfonso. Esta vez, con Tino Libaak (10). Los dos jugaron el sábado [la final del Mundial](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/) con Argentina.

    ## El resto del día

    Lebrón y Augsburger (2) perdieron el primer set con Castaño y Pol Hernández y remontaron: 4-6, 6-3 y 6-3. Yanguas y Nieto (5) también, contra Sintes y Zamora: 6-7, 6-3 y 6-4. Stupaczuk y Sanz (3) pasaron por la retirada de sus rivales.

    <figure><img src="/img/noticias/dubai-p1-2026-lebron-celebra.jpg" alt="Juan Lebrón celebra un punto en el Dubái P1" width="1280" height="1600" loading="lazy"><figcaption>Juan Lebrón, en Dubái. Imagen: Premier Padel</figcaption></figure>

    En dos sets: Guerrero y Leal (6), Momo y Campagnolo (7), Arce y Tello (8), Goñi y Alonso (9) y Libaak y Alfonso (10).

    Ellas: las cuatro primeras parejas debutan el jueves. Triay y Brea, campeonas en Kuwait, contra Talaván y Saiz.

    ## Así quedan los octavos

    - Marcos González / Diego García – Libaak / Alfonso (10)
    - Bautista / Bergamini (11) – Guerrero / Leal (6)
    - Yanguas / Nieto (5) – De Pascual / Garrido (14)
    - Sanyo / Maxi Sánchez (15) – Stupaczuk / Sanz (3)
    - Aragón / Roglan – Abbate / Dal Bianco
    - Jofre / Esbrí (12) – Momo / Campagnolo (7)
    - Arce / Tello (8) – Goñi / Alonso (9)
    - Víctor Ruiz / Rodrigo – Lebrón / Augsburger (2)

    Roglan y Aragón llegaron a Dubái para jugar la previa.

    El jueves juegan octavos.

en:
  slug: roglan-aragon-comeback-navarro-di-nenno-dubai-p1
  titulo: "Roglan and Aragón come back against Paquito and Di Nenno and reach the last 16 in Dubai"
  entradilla: "They came through qualifying and lost the first set 6-0 to the fourth seeds. They won 0-6, 6-4, 6-2. It's their first Premier last 16 together."
  seo_titulo: "Roglan and Aragón beat Paquito and Di Nenno in Dubai"
  seo_descripcion: "Qualifiers Albert Roglan and Manu Aragón beat Paquito Navarro and Di Nenno 0-6, 6-4, 6-2 to reach their first last 16 together at the Dubai P1."
  palabra_clave: "Roglan Aragón Dubai P1"
  cuerpo: |
    Roglan and Aragón lost the first set 6-0.

    Across the net: Paquito Navarro and Martín Di Nenno, fourth seeds at the Dubai P1. On centre court.

    An hour and a half later, the scoreboard said something else: 0-6, 6-4, 6-2. To them.

    "No words, team, what a match!", Aragón said afterwards.

    ## Four matches in four days

    Their Dubai started on Sunday, in qualifying.

    - **Sunday:** 6-2, 6-1 against Moragues and Fonteny.
    - **Monday:** 6-4, 3-6, 6-4 against Nunes and Sans. They were in the main draw.
    - **Tuesday:** 6-7, 6-4, 7-6 against Valdés and Núñez, another qualifying pair. Two hours and 43 minutes.
    - **Wednesday:** Paquito and Di Nenno.

    More than seven hours on court in four days. Four wins.

    ## Who they are

    Manu Aragón is 20. He's from Campillos (Málaga) and plays on the backhand side.

    Albert Roglan is 27. He's from Tortosa and plays on the drive side.

    They've been playing together since May. Most of their year has been the FIP tour and Premier qualifying. In September they played the final of the FIP Gold in Bucharest. Ten days ago, the semi-finals in Turin.

    In Premier, their ceiling was the round of 32. In June, at the Italy Major, they lost in that round to Lebrón and Augsburger. They had never beaten a seeded pair together in a Premier main draw.

    Today, in the same round, they beat the fourth seeds.

    ## What it's worth

    Paquito and Di Nenno got back together in June, at that same Italy Major.

    Since then, thirteen tournaments. They won at least one match in every one of them. They reached the semi-finals in four.

    Dubai was the fourteenth. And today they went out in their first match.

    That's not a stat against them. It's the measure of what Roglan and Aragón have done.

    On Thursday, a last-16 match against Abbate and Dal Bianco, who also knocked out a seeded pair: 4-6, 6-1, 6-4 against Álex Ruiz and Javi García (13). One of the two pairs will be in the quarter-finals.

    ## The lucky loser pair has a name

    [Yesterday we reported](/en/news/coello-tapia-out-dubai-p1-tapia-injury/) that a lucky loser pair would take Coello and Tapia's place. They are Marcos González and Diego García.

    <figure><img src="/img/noticias/dubai-p1-2026-gonzalez-garcia-lucky-loser.jpg" alt="Marcos González and Diego García talk between points at the Dubai P1" width="1280" height="1600" loading="lazy"><figcaption>Marcos González and Diego García, the lucky loser pair. Photo: Premier Padel</figcaption></figure>

    They lost in qualifying. They got in because the world number ones pulled out. And today they beat Chozas and Rubini: 6-4, 3-6, 7-6, with the third-set tie-break 9-7. Two and a half hours, the longest match of the day.

    Marcos is 21 and from Málaga. Diego, 20, from La Línea.

    Diego already knows what it's like to win a Premier event. In 2025, aged 18, he won the Gijón P2 with Francisco Cabeza. The final was against Tolito Aguirre and Gonzalo Alfonso.

    On Thursday he meets Alfonso again. This time Alfonso plays with Tino Libaak (10). Both played [the World Cup final](/en/news/padel-world-cup-2026-final-spain-champions-argentina/) with Argentina on Saturday.

    ## The rest of the day

    Lebrón and Augsburger (2) lost the first set to Castaño and Pol Hernández and came back: 4-6, 6-3, 6-3. So did Yanguas and Nieto (5), against Sintes and Zamora: 6-7, 6-3, 6-4. Stupaczuk and Sanz (3) went through when their opponents retired.

    <figure><img src="/img/noticias/dubai-p1-2026-lebron-celebra.jpg" alt="Juan Lebrón celebrates a point at the Dubai P1" width="1280" height="1600" loading="lazy"><figcaption>Juan Lebrón, in Dubai. Photo: Premier Padel</figcaption></figure>

    In straight sets: Guerrero and Leal (6), Momo and Campagnolo (7), Arce and Tello (8), Goñi and Alonso (9) and Libaak and Alfonso (10).

    Women: the top four pairs start on Thursday. Triay and Brea, champions in Kuwait, face Talaván and Saiz.

    ## The last 16

    - Marcos González / Diego García – Libaak / Alfonso (10)
    - Bautista / Bergamini (11) – Guerrero / Leal (6)
    - Yanguas / Nieto (5) – De Pascual / Garrido (14)
    - Sanyo / Maxi Sánchez (15) – Stupaczuk / Sanz (3)
    - Aragón / Roglan – Abbate / Dal Bianco
    - Jofre / Esbrí (12) – Momo / Campagnolo (7)
    - Arce / Tello (8) – Goñi / Alonso (9)
    - Víctor Ruiz / Rodrigo – Lebrón / Augsburger (2)

    Roglan and Aragón came to Dubai to play qualifying.

    On Thursday they play in the last 16.

