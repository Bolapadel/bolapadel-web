es:
  slug: miguel-lamperti-acapulco-previa-ultimo-premier
  titulo: "Lamperti gana dos partidos en Acapulco y está a uno del cuadro final de su último Premier"
  entradilla: "Con 48 años y junto a Octavio Álvarez, lleva dos victorias de dos en la previa del Major de México. Esta noche, sobre la 1:00 en España, se juega la entrada al cuadro final."
  seo_titulo: "Lamperti, a un partido del cuadro final en Acapulco"
  seo_descripcion: "Miguel Lamperti, 48 años, gana dos partidos en la previa de Acapulco, su último torneo de Premier Padel, y esta noche se juega el pase al cuadro final."
  palabra_clave: "Lamperti Acapulco"
  cuerpo: |
    Miguel Lamperti tiene 48 años. Los cumplió el 11 de noviembre.

    Y sigue ganando.

    En Acapulco, con Octavio Álvarez, lleva dos de dos en la previa del Major de México. Le queda un partido para entrar en el cuadro final.

    Es esta noche. Sobre la 1:00 de la madrugada en España, las seis de la tarde en Acapulco.

    Enfrente, Aris Patiniotis y Thijs Roper.

    ## El último Premier

    No es un torneo más.

    Lo anunció en enero, en un vídeo con NOX, su marca de siempre: «Dicen que todo tiene un final». 2026 iba a ser su última temporada.

    En octubre puso fecha. Lo contó en el stream Saque y Volea, de El Ciudadano: «Me retiro de Premier, del máximo nivel, en diciembre».

    En mayo, en el P1 de Buenos Aires, ya se despidió de su gente.

    <figure><img src="/img/noticias/lamperti-despedida-buenos-aires-2026.jpg" alt="Miguel Lamperti, con chaqueta verde y micrófono, en su despedida en el Buenos Aires P1" width="415" height="739" loading="lazy" style="width:auto;max-width:100%;margin:0 auto;display:block"><figcaption>Miguel Lamperti, en su despedida en Buenos Aires, en mayo. Imagen: Premier Padel</figcaption></figure>

    Después de Acapulco solo quedan las Finals de Barcelona, reservadas a las mejores parejas del año.

    Así que este es su último torneo de Premier Padel.

    ## Dos de dos

    El sábado, 6-4 y 6-4 a Gayone y Guevara.

    El domingo, 6-3 y 6-4 a Thomas Leygue y Jesús Moya, cabezas de serie n.º 4 de la previa. En una hora y 25 minutos.

    Moya le había ganado las tres veces que se habían cruzado. La última, en septiembre, en el FIP Platinum de Lyon: Leygue y Moya ganaron a Lamperti y Álvarez en tres sets, después de dos tie-breaks.

    A la cuarta, ganó Lamperti.

    ## 48 y 22

    Octavio Álvarez tiene 22 años. Es de Pergamino y juega en el drive.

    Cuando nació, en 2004, Lamperti ya llevaba una década compitiendo.

    No es casualidad. Lamperti siempre ha tenido ojo para los jóvenes.

    Hace un año, en este mismo torneo, salió de la previa con otro chico de Pergamino: Juani de Pascual. En primera ronda remontaron a Perino y Piotto (1-6, 6-3 y 6-2). Después cayeron con Ruiz y Esbrí, cabezas de serie n.º 12.

    Este mes, De Pascual ha jugado con Javi Garrido [sus primeras semifinales de Premier, en Dubái](/actualidad/garrido-de-pascual-semifinales-dubai-p1/).

    ## Lo que viene

    Lamperti no se va del todo.

    Contó que seguirá jugando los torneos que le gusten, sin mirar el ranking. Que abrirá una academia en Madrid. Que dará exhibiciones y clínics por el mundo. Y que hasta 2028 no se plantea sentarse en un banquillo.

    Pero eso es después.

    Esta noche queda un partido. Hace un año, Acapulco le abrió la puerta del cuadro final.

    Ojalá vuelva a hacerlo.

en:
  slug: miguel-lamperti-acapulco-qualifying-last-premier
  titulo: "Lamperti wins twice in Acapulco and is one match away from the main draw of his last Premier event"
  entradilla: "At 48, and alongside Octavio Álvarez, he is two from two in qualifying at the Mexico Major. Tonight, around 1am Spanish time, he plays for a place in the main draw."
  seo_titulo: "Lamperti one match away from the Acapulco main draw"
  seo_descripcion: "Miguel Lamperti, 48, wins two qualifying matches in Acapulco, his last Premier Padel event, and tonight plays for a place in the main draw."
  palabra_clave: "Lamperti Acapulco"
  cuerpo: |
    Miguel Lamperti is 48. He turned 48 on 11 November.

    And he's still winning.

    In Acapulco, with Octavio Álvarez, he's two from two in qualifying at the Mexico Major. One more match and he's in the main draw.

    It's tonight. Around 1am in Spain, 6pm in Acapulco.

    On the other side of the net, Aris Patiniotis and Thijs Roper.

    ## The last Premier

    This isn't just another tournament.

    He announced it in January, in a video with NOX, his brand of a lifetime: "They say everything has an end." 2026 would be his last season.

    In October he set the date. He said it on the Saque y Volea stream, from El Ciudadano: "I'm retiring from Premier, from the top level, in December."

    In May, at the Buenos Aires P1, he had already said goodbye to his home crowd.

    <figure><img src="/img/noticias/lamperti-despedida-buenos-aires-2026.jpg" alt="Miguel Lamperti, in a green jacket and holding a microphone, at his farewell at the Buenos Aires P1" width="415" height="739" loading="lazy" style="width:auto;max-width:100%;margin:0 auto;display:block"><figcaption>Miguel Lamperti at his farewell in Buenos Aires, in May. Photo: Premier Padel</figcaption></figure>

    After Acapulco, only the Finals in Barcelona remain, and they're reserved for the best pairs of the year.

    So this is his last Premier Padel tournament.

    ## Two from two

    On Saturday, 6-4, 6-4 against Gayone and Guevara.

    On Sunday, 6-3, 6-4 against Thomas Leygue and Jesús Moya, the No. 4 seeds in qualifying. In an hour and 25 minutes.

    Moya had beaten him all three times they had met. The last one was in September, at the FIP Platinum in Lyon: Leygue and Moya beat Lamperti and Álvarez in three sets, after two tie-breaks.

    At the fourth attempt, Lamperti won.

    ## 48 and 22

    Octavio Álvarez is 22. He's from Pergamino and plays on the right.

    When he was born, in 2004, Lamperti had already been competing for a decade.

    It's no coincidence. Lamperti has always had an eye for young players.

    A year ago, at this very tournament, he came through qualifying with another kid from Pergamino: Juani de Pascual. In the first round they came back to beat Perino and Piotto (1-6, 6-3, 6-2). Then they lost to Ruiz and Esbrí, the No. 12 seeds.

    This month, De Pascual reached [his first Premier semi-final, in Dubai](/en/news/garrido-de-pascual-semi-finals-dubai-p1/), with Javi Garrido.

    ## What comes next

    Lamperti isn't leaving completely.

    He said he'll keep playing the tournaments he enjoys, without looking at the ranking. That he'll open an academy in Madrid. That he'll do exhibitions and clinics around the world. And that he won't think about sitting on a bench as a coach until 2028.

    But that's for later.

    Tonight there's one match left. A year ago, Acapulco opened the door to the main draw for him.

    Here's hoping it does again.

