es:
  slug: garrido-de-pascual-semifinales-dubai-p1
  titulo: "Garrido y De Pascual ganan a Stupaczuk y Sanz y jugarán las semifinales del Dubái P1"
  entradilla: "Un año después de su última semifinal, también en Dubái, Javi Garrido vuelve a jugar una. Con Juani De Pascual, que con 21 años juega la primera en Premier."
  seo_titulo: "Garrido y De Pascual, a semifinales del Dubái P1"
  seo_descripcion: "Javi Garrido y Juani De Pascual ganan 6-1 y 7-5 a Stupaczuk y Sanz y jugarán las semifinales del Dubái P1. Garrido vuelve a unas semis un año después."
  palabra_clave: "Javi Garrido Dubái P1"
  cuerpo: |
    Javi Garrido vuelve a unas semifinales.

    Hoy, con Juani De Pascual, ha ganado 6-1 y 7-5 a Stupaczuk y Sanz (3). En una hora y 16 minutos.

    Hay semifinales que se celebran un poco más. Esta es una.

    ## Un año después

    Su última semifinal en Premier fue aquí, en Dubái. El 15 de noviembre de 2025, con Lucas Campagnolo. Perdieron con Coello y Tapia: 6-4 y 7-6.

    Desde entonces, un año entero rozándolo.

    En 2026 se había quedado cinco veces en cuartos. Riad, Gijón, Newgiza y Roma, con Lucas Bergamini. Milán, ya con De Pascual.

    A la sexta, ha pasado.

    ## Una pareja de seis semanas

    Garrido y De Pascual empezaron a jugar juntos a principios de octubre. Dubái es su cuarto torneo de Premier.

    Juani De Pascual tiene 21 años. Es de Pergamino (Argentina), zurdo, y juega de drive. Es su primera semifinal en Premier Padel.

    Garrido, 26 años, cordobés, de revés. Él ya sabe lo que es esto: con Mike Yanguas jugó la final del Major de Qatar en 2024.

    En Milán, en octubre, se quedaron a un paso. Perdieron los cuartos con Lebrón y Augsburger: 7-6 y 6-3.

    ## El camino

    - **Dieciseisavos:** 6-3 y 7-6 a Gil y Valenzuela.
    - **Octavos:** 7-6, 3-6 y 7-6 a Yanguas y Nieto (5). Dos tie-breaks y dos horas y 34 minutos. Al otro lado, Yanguas, su compañero en aquella final de Qatar.
    - **Cuartos:** 6-1 y 7-5 a Stupaczuk y Sanz (3). Jon Sanz fue campeón del mundo con España el sábado.

    ## El sábado, Libaak y Alfonso

    En semifinales, Tino Libaak y Gonzalo Alfonso (10). Hoy han remontado a Bautista y Bergamini (11): 4-6, 6-3 y 7-6.

    Bergamini fue el compañero de Garrido hasta septiembre.

    Y con Bergamini, Garrido ya se cruzó con Libaak y Alfonso este año. Fue en dieciseisavos del Madrid P1, en septiembre. Ganaron ellos: 6-3 y 7-6.

    Ahora, con otra pareja, otra ronda y otra oportunidad.

    ## El resto del día

    Lebrón y Augsburger (2) ganaron a Arce y Tello (8): 6-3, 3-6 y 6-2, en una hora y 46 minutos. Es la cuarta vez que les ganan este año. [Ayer ya contábamos las otras tres](/actualidad/lebron-augsburger-cuartos-dubai-p1-arce-tello/).

    <figure><img src="/img/noticias/dubai-p1-2026-lebron-augsburger-cuartos.jpg" alt="Juan Lebrón y Leo Augsburger chocan la mano en el Dubái P1" width="1400" height="1750" loading="lazy"><figcaption>Juan Lebrón y Leo Augsburger, en Dubái. Imagen: Premier Padel</figcaption></figure>

    En semifinales tendrán a Flavio Abbate y Franco Dal Bianco, que ganaron a Momo y Campagnolo (7): 7-6, 3-6 y 6-2, en dos horas y 12 minutos. Es su primera semifinal juntos.

    Sin [Coello y Tapia](/actualidad/coello-tapia-baja-dubai-p1-lesion-tapia/) ni Galán y Chingotto, el domingo habrá campeones nuevos en Dubái.

    ## Ellas

    La sorpresa del día la dieron Tamara Icardo y Claudia Jensen (6). Ganaron a Triay y Brea, cabezas de serie número 1: 6-3, 3-6 y 6-1, en dos horas y tres minutos.

    - **Josemaría y Bea González (2):** 6-3 y 6-1 a Guinart y Alonso (7).
    - **Ari y Andrea (3):** 6-2 y 6-3 a Velasco y Eugenio.
    - **Calvo y Claudia Fernández (4):** 7-6 y 6-4 a Rufo e Iglesias.

    ## Semifinales del sábado

    Hora española, aproximada.

    Ellas:

    - **13:00** · Jensen / Icardo (6) – Calvo / Fernández (4)
    - **15:00** · Ari / Andrea (3) – Josemaría / Bea González (2)

    Ellos:

    - **17:00** · Abbate / Dal Bianco – Lebrón / Augsburger (2)
    - **18:30** · Libaak / Alfonso (10) – De Pascual / Garrido (14)

    Hace un año, Garrido se despidió de Dubái en semifinales.

    Este sábado vuelve a estar ahí. Y esta vez, con la puerta un poco más abierta.

en:
  slug: garrido-de-pascual-semi-finals-dubai-p1
  titulo: "Garrido and De Pascual beat Stupaczuk and Sanz to reach the Dubai P1 semi-finals"
  entradilla: "A year after his last semi-final, also in Dubai, Javi Garrido is back in one. With Juani De Pascual, who at 21 plays his first in Premier."
  seo_titulo: "Garrido and De Pascual into the Dubai P1 semi-finals"
  seo_descripcion: "Javi Garrido and Juani De Pascual beat Stupaczuk and Sanz 6-1, 7-5 to reach the Dubai P1 semi-finals. Garrido's first semi-final in a year."
  palabra_clave: "Javi Garrido Dubai P1"
  cuerpo: |
    Javi Garrido is back in a semi-final.

    Today, with Juani De Pascual, he beat Stupaczuk and Sanz (3) 6-1, 7-5. In an hour and 16 minutes.

    Some semi-finals are worth celebrating a little more. This is one of them.

    ## A year later

    His last Premier semi-final was right here, in Dubai. On 15 November 2025, with Lucas Campagnolo. They lost to Coello and Tapia: 6-4, 7-6.

    Since then, a whole year of coming close.

    In 2026 he had stopped five times in the quarter-finals. Riyadh, Gijón, Newgiza and Rome, with Lucas Bergamini. Milan, already with De Pascual.

    At the sixth attempt, he's through.

    ## A six-week partnership

    Garrido and De Pascual started playing together in early October. Dubai is their fourth Premier tournament.

    Juani De Pascual is 21. He's from Pergamino (Argentina), left-handed, and plays on the right. It's his first Premier Padel semi-final.

    Garrido, 26, from Córdoba, plays on the left. He knows what this feels like: with Mike Yanguas he reached the final of the 2024 Qatar Major.

    In Milan, in October, they were one step away. They lost the quarter-final to Lebrón and Augsburger: 7-6, 6-3.

    ## The road

    - **Round of 32:** 6-3, 7-6 against Gil and Valenzuela.
    - **Round of 16:** 7-6, 3-6, 7-6 against Yanguas and Nieto (5). Two tie-breaks and two hours and 34 minutes. On the other side, Yanguas, his partner in that Qatar final.
    - **Quarter-finals:** 6-1, 7-5 against Stupaczuk and Sanz (3). Jon Sanz became world champion with Spain on Saturday.

    ## On Saturday, Libaak and Alfonso

    In the semi-finals, Tino Libaak and Gonzalo Alfonso (10). Today they came back against Bautista and Bergamini (11): 4-6, 6-3, 7-6.

    Bergamini was Garrido's partner until September.

    And with Bergamini, Garrido already faced Libaak and Alfonso this year. It was in the Madrid P1 round of 32, in September. They won: 6-3, 7-6.

    Now, with a new partner, a later round and another chance.

    ## The rest of the day

    Lebrón and Augsburger (2) beat Arce and Tello (8): 6-3, 3-6, 6-2, in an hour and 46 minutes. It's the fourth time they've beaten them this year. [We told you about the other three yesterday](/en/news/lebron-augsburger-quarter-finals-dubai-p1-arce-tello/).

    <figure><img src="/img/noticias/dubai-p1-2026-lebron-augsburger-cuartos.jpg" alt="Juan Lebrón and Leo Augsburger high-five at the Dubai P1" width="1400" height="1750" loading="lazy"><figcaption>Juan Lebrón and Leo Augsburger, in Dubai. Photo: Premier Padel</figcaption></figure>

    In the semi-finals they'll face Flavio Abbate and Franco Dal Bianco, who beat Momo and Campagnolo (7): 7-6, 3-6, 6-2, in two hours and 12 minutes. It's their first semi-final together.

    With [Coello and Tapia](/en/news/coello-tapia-out-dubai-p1-tapia-injury/) and Galán and Chingotto missing, Dubai will have new champions on Sunday.

    ## Women

    The surprise of the day came from Tamara Icardo and Claudia Jensen (6). They beat Triay and Brea, the top seeds: 6-3, 3-6, 6-1, in two hours and three minutes.

    - **Josemaría and Bea González (2):** 6-3, 6-1 against Guinart and Alonso (7).
    - **Ari and Andrea (3):** 6-2, 6-3 against Velasco and Eugenio.
    - **Calvo and Claudia Fernández (4):** 7-6, 6-4 against Rufo and Iglesias.

    ## Saturday's semi-finals

    Spanish time (CET), approximate.

    Women:

    - **13:00** · Jensen / Icardo (6) – Calvo / Fernández (4)
    - **15:00** · Ari / Andrea (3) – Josemaría / Bea González (2)

    Men:

    - **17:00** · Abbate / Dal Bianco – Lebrón / Augsburger (2)
    - **18:30** · Libaak / Alfonso (10) – De Pascual / Garrido (14)

    A year ago, Garrido left Dubai in the semi-finals.

    This Saturday he's there again. And this time, the door is a little more open.

