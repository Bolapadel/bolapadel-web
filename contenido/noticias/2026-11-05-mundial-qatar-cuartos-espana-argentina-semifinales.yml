es:
  slug: mundial-padel-2026-cuartos-espana-argentina-semifinales
  titulo: "España y Argentina meten a sus dos equipos en semifinales del Mundial de Qatar"
  entradilla: "España ganó 2-0 a Brasil, con Coello y Javi Leal en la misma pista, y Argentina 3-0 a Alemania. Ellas, otros dos 3-0. Solo pueden cruzarse en las finales del sábado."
  seo_titulo: "Mundial de pádel 2026: España y Argentina, a semifinales"
  seo_descripcion: "Cuartos del Mundial de pádel 2026: España gana 2-0 a Brasil con Coello y Javi Leal, Argentina 3-0 a Alemania y ellas, otros dos 3-0. Ya hay semifinales."
  palabra_clave: "Mundial de pádel 2026"
  cuerpo: |
    Arturo Coello lleva seis días y cuatro compañeros.

    El sábado ganó Kuwait con Tapia. En el Mundial, con Paquito Navarro el lunes y con Aimar Goñi el martes. El miércoles no jugó.

    Y hoy, Javi Leal.

    El mismo Javi Leal que este verano, en Pretoria, le ganó una semifinal a Coello y Tapia.

    Hoy jugaron en el mismo lado de la red. Y España ya está en semifinales.

    ## España: con dos puntos bastó

    España ganó 2-0 a Brasil. Los dos primeros partidos decidieron la eliminatoria y el tercero no se jugó.

    - **Coki Nieto y Jon Sanz:** 6-2, 6-2 a Fernandes y De Avila Simonato.
    - **Javi Leal y Coello:** 6-2, 6-1 a Freitas y Correa.

    Lebrón y Goñi, que tenían el tercero, se quedaron sin jugar.

    <figure><img src="/img/noticias/mundial-2026-espana-brasil-pareja.jpg" alt="Dos jugadores de España caminan por la pista en el partido contra Brasil del Mundial de Qatar" width="1066" height="1600" loading="lazy"><figcaption>España, ante Brasil. Imagen: Federación Española de Pádel</figcaption></figure>

    Nieto y Sanz, que no habían jugado juntos en este Mundial, abrieron la eliminatoria.

    Javi Leal entró en la lista el viernes, por la [baja de Ale Galán](/actualidad/ale-galan-baja-mundial-qatar-lesion/). Lleva tres partidos, cada uno con un compañero distinto: Yanguas el martes, Lebrón el miércoles y Coello hoy.

    Tres partidos. Tres victorias.

    Lo del miércoles tiene su historia. Lebrón era el compañero con el que Galán iba a volver a jugar en Doha.

    España lleva once partidos en el Mundial. Los ha ganado todos.

    Mañana, semifinal contra Portugal o Países Bajos, que se jugaban el pase a esta hora.

    ## Argentina: hoy descansó Tapia

    Argentina ganó 3-0 a Alemania. Cedió nueve juegos.

    - **Chingotto y Alfonso:** 6-1, 6-1 a Reca y Wunner.
    - **Augsburger y Di Nenno:** 6-0, 6-4 a Lindmeyer y Fitzon.
    - **Stupaczuk y Arce:** 6-3, 6-0 a Boehnke y Merten.

    Tapia y Libaak no jugaron. El miércoles sí, contra Francia, y les costó: perdieron el primer set y acabaron ganando 5-7, 6-3 y 6-4.

    Argentina, campeona de los dos últimos Mundiales, lleva doce partidos y doce victorias.

    Mañana, contra Italia o Suecia.

    ## Solo pueden cruzarse en la final

    España y Argentina van por lados distintos del cuadro. Si las dos ganan mañana, el sábado se juegan el Mundial.

    Como en 2024. Aquella final la ganó Argentina, 2-1.

    ## Ellas: ni un set perdido

    España ganó 3-0 a Suecia.

    - **Paula Josemaría y Bea González:** 6-0, 6-1 a Behram y Sjöland.
    - **Marta Ortega y Martina Calvo:** 6-0, 6-2 a Andersson y Girdo.
    - **Ari Sánchez y Andrea Ustero:** 6-1, 6-2 a Kjaergaard y Björk.

    Doce partidos en el Mundial. Doce victorias. Ni un set perdido. Quince juegos cedidos en total.

    Van a por el séptimo Mundial seguido. Mañana, Francia.

    Argentina ganó 3-0 a Portugal. Delfi Brea y Claudia Jensen, 6-0, 6-0. Mañana, Italia.

    También ellas solo pueden encontrarse en la final.

    ## Mañana, semifinales

    - **12:00:** ellas. España contra Francia y Argentina contra Italia.
    - **Por la tarde:** ellos. España contra Portugal o Países Bajos y Argentina contra Italia o Suecia.

    Horas de España; en Argentina, cuatro menos. [Dónde verlo](/actualidad/donde-ver-mundial-padel-2026-tv-streaming/), aquí.

    El sábado pasado, Coello y Tapia levantaban juntos el trofeo de Kuwait.

    Este sábado pueden estar en la misma final.

    Cada uno en su banquillo.

en:
  slug: padel-world-cup-2026-quarter-finals-spain-argentina-semi-finals
  titulo: "Spain and Argentina put both their teams into the World Cup semi-finals in Qatar"
  entradilla: "Spain beat Brazil 2-0, with Coello and Javi Leal on the same side, and Argentina beat Germany 3-0. The women, two more 3-0s. They can only meet in Saturday's finals."
  seo_titulo: "2026 Padel World Cup: Spain and Argentina into the semis"
  seo_descripcion: "2026 Padel World Cup quarter-finals: Spain beat Brazil 2-0 with Coello and Javi Leal, Argentina beat Germany 3-0 and the women win 3-0. The semi-finals are set."
  palabra_clave: "2026 Padel World Cup"
  cuerpo: |
    Arturo Coello: six days, four partners.

    On Saturday he won Kuwait with Tapia. At the World Cup, with Paquito Navarro on Monday and with Aimar Goñi on Tuesday. On Wednesday he didn't play.

    And today, Javi Leal.

    The same Javi Leal who, this summer in Pretoria, beat Coello and Tapia in a semi-final.

    Today they were on the same side of the net. And Spain are into the semi-finals.

    ## Spain: two points were enough

    Spain beat Brazil 2-0. The first two matches decided the tie and the third wasn't played.

    - **Coki Nieto and Jon Sanz:** 6-2, 6-2 over Fernandes and De Avila Simonato.
    - **Javi Leal and Coello:** 6-2, 6-1 over Freitas and Correa.

    Lebrón and Goñi, down for the third match, didn't get on court.

    <figure><img src="/img/noticias/mundial-2026-espana-brasil-pareja.jpg" alt="Two Spain players walk across the court during the match against Brazil at the World Cup in Qatar" width="1066" height="1600" loading="lazy"><figcaption>Spain, against Brazil. Image: Spanish Padel Federation</figcaption></figure>

    Nieto and Sanz, who hadn't played together at this World Cup, opened the tie.

    Javi Leal joined the squad on Friday, after [Ale Galán's injury](/en/news/ale-galan-out-padel-world-cup-qatar-injury/). He has played three matches, each with a different partner: Yanguas on Tuesday, Lebrón on Wednesday and Coello today.

    Three matches. Three wins.

    Wednesday has a story to it. Lebrón was the partner Galán was going to play with again in Doha.

    Spain have played eleven matches at the World Cup. They have won them all.

    Tomorrow, a semi-final against Portugal or the Netherlands, who were playing for their place as this was written.

    ## Argentina: a day off for Tapia

    Argentina beat Germany 3-0. They dropped nine games.

    - **Chingotto and Alfonso:** 6-1, 6-1 over Reca and Wunner.
    - **Augsburger and Di Nenno:** 6-0, 6-4 over Lindmeyer and Fitzon.
    - **Stupaczuk and Arce:** 6-3, 6-0 over Boehnke and Merten.

    Tapia and Libaak didn't play. They did on Wednesday, against France, and it was hard work: they lost the first set and came back to win 5-7, 6-3, 6-4.

    Argentina, champions at the last two World Cups, have played twelve matches and won twelve.

    Tomorrow, Italy or Sweden.

    ## They can only meet in the final

    Spain and Argentina are in opposite halves of the draw. If both win tomorrow, they play for the World Cup on Saturday.

    Just like 2024. Argentina won that final, 2-1.

    ## The women: not a set dropped

    Spain beat Sweden 3-0.

    - **Paula Josemaría and Bea González:** 6-0, 6-1 over Behram and Sjöland.
    - **Marta Ortega and Martina Calvo:** 6-0, 6-2 over Andersson and Girdo.
    - **Ari Sánchez and Andrea Ustero:** 6-1, 6-2 over Kjaergaard and Björk.

    Twelve matches at the World Cup. Twelve wins. Not a single set dropped. Fifteen games conceded in total.

    They are going for a seventh World Cup in a row. Tomorrow, France.

    Argentina beat Portugal 3-0. Delfi Brea and Claudia Jensen, 6-0, 6-0. Tomorrow, Italy.

    The women's teams, too, can only meet in the final.

    ## Tomorrow, the semi-finals

    - **12:00:** the women. Spain v France and Argentina v Italy.
    - **In the afternoon:** the men. Spain v Portugal or the Netherlands and Argentina v Italy or Sweden.

    Times are CET; in Argentina, four hours earlier. [Where to watch](/en/news/where-to-watch-padel-world-cup-2026-tv-streaming/), here.

    Last Saturday, Coello and Tapia lifted the Kuwait trophy together.

    This Saturday they could be in the same final.

    Each on his own bench.

