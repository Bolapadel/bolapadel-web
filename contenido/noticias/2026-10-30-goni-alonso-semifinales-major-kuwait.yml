es:
  slug: aimar-goni-edu-alonso-semifinales-major-kuwait-mundial
  titulo: "Aimar Goñi jugará su primera semifinal en un Major antes de irse al Mundial con España"
  entradilla: "Con Edu Alonso, 6-1 y 6-2 a Stupaczuk y Sanz, cuartos cabezas de serie. Hoy, en Kuwait, contra Tello y Arce. La semana que viene, Goñi juega el Mundial."
  seo_titulo: "Aimar Goñi, a semifinales del Major de Kuwait"
  seo_descripcion: "Aimar Goñi y Edu Alonso ganan 6-1, 6-2 a Stupaczuk y Sanz y jugarán su primera semifinal en un Major. Después, Goñi se va al Mundial con España."
  palabra_clave: "Aimar Goñi"
  cuerpo: |
    Hace nueve días te contaba que Aimar Goñi era [la novedad de España para el Mundial](/actualidad/convocatoria-espana-mundial-padel-2026/).

    21 años. De Pamplona. 1,90. El 32 del ranking.

    Hoy juega su primera semifinal en un Major.

    Con Edu Alonso. En Kuwait. A tres días de que empiece el Mundial de Doha.

    ## 6-1 y 6-2

    Enfrente estaban Franco Stupaczuk y Jon Sanz, cuartos cabezas de serie.

    No llegó a durar una hora.

    Goñi y Alonso ganaron el 71 % de los puntos. Solo perdieron un saque. Y en el segundo set hicieron 16 puntos seguidos.

    Dieciséis.

    ## Sanz, el de casa

    Jon Sanz también es de Pamplona.

    En noviembre del año pasado jugó con Goñi un torneo FIP en México.

    Ayer estaba al otro lado de la red. La semana que viene estarán en el mismo equipo: los dos van con España al Mundial.

    Stupaczuk, también. Con Argentina.

    ## La primera

    Goñi y Alonso juegan juntos desde abril.

    Ya sabían lo que es una semifinal: en mayo llegaron a la del Asunción P2. Les ganaron Galán y Chingotto.

    En un Major, nunca. Su techo eran los cuartos. En París, en septiembre, también les pararon Galán y Chingotto.

    Alonso, 25 años, tampoco había pasado nunca de cuartos en un Major.

    En Kuwait, Goñi y Alonso, undécimos cabezas de serie, han ganado a Mariano González y Francisco Cabeza (7-5, 6-1), a Javi Leal y Fran Guerrero, séptimos cabezas de serie (6-4, 6-4), y ayer a Stupaczuk y Sanz.

    ## Enfrente, Tello y Arce

    Juan Tello y Maxi Arce, novenos cabezas de serie, ganaron 6-4 y 6-2 a Marc Sintes y Juan Zamora. Se acabó el torneo de [la pareja más joven de los cuartos](/actualidad/libaak-alfonso-lebron-augsburger-cuartos-major-kuwait/).

    A Tello, Alonso lo conoce bien: fueron pareja hasta abril. Juntos llegaron a las semifinales de Newgiza.

    Y Arce también va al Mundial. Con Argentina.

    Hoy, Goñi y Arce son rivales. La semana que viene, cada uno con su selección.

    Juegan no antes de las 14:00, hora española.

    ## La otra semifinal

    Arturo Coello y Agustín Tapia contra Tino Libaak y Gonzalo Alfonso. No antes de las 18:00.

    Libaak y Alfonso ganaron 7-6 y 6-1 a Martín Di Nenno y Paquito Navarro. También es su primera semifinal en un Major.

    Coello y Tapia ganaron 6-1 y 6-4 a Jairo Bautista y Lucas Bergamini. En una hora.

    ## Ellas

    Las cuatro primeras cabezas de serie, en semifinales.

    Ari Sánchez y Andrea Ustero necesitaron casi tres horas para remontar a Tamara Icardo y Claudia Jensen: 3-6, 6-4 y 7-5. Hoy, a mediodía, contra Bea González y Paula Josemaría, que ganaron 6-2 y 6-4 a Lorena Rufo y Victoria Iglesias. Es la final de Rotterdam y de Milán.

    Gemma Triay y Delfi Brea (6-1, 6-0 a Giulia Dal Pozzo y Nuria Rodríguez) jugarán contra Claudia Fernández y Martina Calvo (6-1, 6-0 a Marta Ortega y Sofía Araújo).

    ## Antes de Doha

    Goñi lleva una semana en Kuwait. La que viene, en Doha. Con la selección.

    Antes, una semifinal.

    La primera.

en:
  slug: aimar-goni-edu-alonso-semifinal-kuwait-major-world-cup
  titulo: "Aimar Goñi will play his first Major semifinal before heading to the World Cup with Spain"
  entradilla: "With Edu Alonso, 6-1, 6-2 against Stupaczuk and Sanz, the fourth seeds. Today, in Kuwait, against Tello and Arce. Next week, Goñi plays the World Cup."
  seo_titulo: "Aimar Goñi reaches the Kuwait Major semifinals"
  seo_descripcion: "Aimar Goñi and Edu Alonso beat Stupaczuk and Sanz 6-1, 6-2 to reach their first Major semifinal. Then Goñi heads to the World Cup with Spain."
  palabra_clave: "Aimar Goñi"
  cuerpo: |
    Nine days ago I told you that Aimar Goñi was [Spain's new face for the World Cup](/en/news/spain-squad-padel-world-cup-2026/).

    21 years old. From Pamplona. 1.90 m. World number 32.

    Today he plays his first semifinal at a Major.

    With Edu Alonso. In Kuwait. Three days before the World Cup in Doha begins.

    ## 6-1, 6-2

    Across the net were Franco Stupaczuk and Jon Sanz, the fourth seeds.

    It didn't even last an hour.

    Goñi and Alonso won 71% of the points. They dropped serve only once. And in the second set they won 16 points in a row.

    Sixteen.

    ## Sanz, the hometown rival

    Jon Sanz is also from Pamplona.

    In November last year he played a FIP tournament in Mexico with Goñi.

    Yesterday he was on the other side of the net. Next week they'll be on the same team: both are going to the World Cup with Spain.

    So is Stupaczuk. With Argentina.

    ## The first one

    Goñi and Alonso have played together since April.

    They already knew what a semifinal feels like: in May they reached one at the Asunción P2. Galán and Chingotto beat them.

    At a Major, never. The quarterfinals were their ceiling. In Paris, in September, Galán and Chingotto stopped them there too.

    Alonso, 25, had never gone past the quarterfinals at a Major either.

    In Kuwait, Goñi and Alonso, the 11th seeds, have beaten Mariano González and Francisco Cabeza (7-5, 6-1), Javi Leal and Fran Guerrero, the seventh seeds (6-4, 6-4), and yesterday Stupaczuk and Sanz.

    ## Next up, Tello and Arce

    Juan Tello and Maxi Arce, the ninth seeds, beat Marc Sintes and Juan Zamora 6-4, 6-2. That ends the tournament for [the youngest pair in the quarterfinals](/en/news/libaak-alfonso-beat-lebron-augsburger-kuwait-major-quarterfinals/).

    Alonso knows Tello well: they were partners until April. Together they reached the semifinals in Newgiza.

    And Arce is also going to the World Cup. With Argentina.

    Today, Goñi and Arce are rivals. Next week, each with his national team.

    They play not before 14:00 Spanish time.

    ## The other semifinal

    Arturo Coello and Agustín Tapia against Tino Libaak and Gonzalo Alfonso. Not before 18:00.

    Libaak and Alfonso beat Martín Di Nenno and Paquito Navarro 7-6, 6-1. It's their first Major semifinal too.

    Coello and Tapia beat Jairo Bautista and Lucas Bergamini 6-1, 6-4. In one hour.

    ## The women

    The top four seeds, all in the semifinals.

    Ari Sánchez and Andrea Ustero needed almost three hours to come back against Tamara Icardo and Claudia Jensen: 3-6, 6-4, 7-5. Today, at midday, they face Bea González and Paula Josemaría, who beat Lorena Rufo and Victoria Iglesias 6-2, 6-4. It's the Rotterdam and Milan final again.

    Gemma Triay and Delfi Brea (6-1, 6-0 against Giulia Dal Pozzo and Nuria Rodríguez) will play Claudia Fernández and Martina Calvo (6-1, 6-0 against Marta Ortega and Sofía Araújo).

    ## Before Doha

    Goñi has spent a week in Kuwait. Next week, Doha. With the national team.

    First, a semifinal.

    The first one.

