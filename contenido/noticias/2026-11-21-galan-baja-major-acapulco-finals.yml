es:
  slug: ale-galan-baja-major-acapulco-finals-barcelona
  titulo: "Ale Galán no jugará el Major de Acapulco y apunta a las Finals de Barcelona"
  entradilla: "Lo ha contado él mismo en Instagram este sábado. Con las gracias por delante y un objetivo claro: volver en las Finals de Barcelona, del 10 al 13 de diciembre."
  seo_titulo: "Ale Galán, baja en Acapulco: su objetivo son las Finals"
  seo_descripcion: "Ale Galán no jugará el Major de Acapulco, el cuarto torneo seguido que se pierde por lesión. Su objetivo es volver en las Finals de Barcelona."
  palabra_clave: "Galán Acapulco"
  cuerpo: |
    Lo ha contado él. Una historia en Instagram, este sábado.

    Ale Galán no jugará el Major de Acapulco.

    Pero el mensaje no acaba ahí. Acaba con un objetivo: «Sigo esforzándome para la vuelta y con el objetivo de jugar el Finals».

    Ya tiene fecha en la cabeza. Del 10 al 13 de diciembre, en [el Palau Sant Jordi de Barcelona](/actualidad/premier-padel-finals-2026-barcelona-presentacion-record-publico/).

    ## Primero, las gracias

    Galán empieza dando las gracias. A la gente que sigue de cerca su recuperación. A los mensajes de ánimo que está recibiendo. Y a México.

    La lesión la explicó él mismo a MARCA el día de la final del Mundial: se rompió un dedo de la mano derecha en los octavos de Milán.

    ## Cuatro torneos fuera

    Acapulco será el cuarto torneo seguido sin él.

    Primero, [el Major de Kuwait](/actualidad/chingotto-galan-baja-major-kuwait-lesion/). Luego, [el Mundial de Qatar](/actualidad/ale-galan-baja-mundial-qatar-lesion/) con España. Después, [el Dubái P1](/actualidad/lebron-augsburger-campeones-dubai-p1-libaak-alfonso/). Y ahora, México.

    Su último partido fue el 17 de octubre, en las semifinales de Milán.

    Si llega a Barcelona, habrán pasado casi ocho semanas.

    Chingotto, su compañero, no ha vuelto a jugar en el circuito desde entonces. Solo el Mundial, con Argentina.

    ## La plaza, guardada

    En la Race, Galán y Chingotto son terceros, con 11.980 puntos. Por delante, solo Coello y Tapia.

    Los siguientes son Lebrón y Augsburger, con 7.705. Aunque ganaran Acapulco, que da 2.000, no les alcanzarían.

    Por puntos, su sitio en Barcelona no corre peligro.

    Falta que llegue él.

    ## Acapulco, donde empezó todo

    Acapulco no es un torneo cualquiera para Galán.

    En marzo de 2024 jugó allí su último torneo con Juan Lebrón. Perdieron la final con Coello y Tapia.

    Tres días después, en Puerto Cabello, ya jugaba con Chingotto.

    Y el año pasado, en el Major, Galán y Chingotto llegaron a la final. La perdieron con Coello y Tapia: 6-4 y 7-6.

    En las Finals de Barcelona, otra final contra ellos. Otra vez por poco: 6-7, 6-3 y 7-6.

    ## Su cita es Barcelona

    El cuadro final de Acapulco arranca el lunes.

    Esta vez, sin él.

    Su cita es Barcelona. Allí lo esperamos.

en:
  slug: ale-galan-out-acapulco-major-finals-barcelona
  titulo: "Ale Galán will miss the Acapulco Major and sets his sights on the Finals in Barcelona"
  entradilla: "He shared the news himself on Instagram on Saturday. Thanking everyone first, and with one clear goal: to be back for the Finals in Barcelona, 10-13 December."
  seo_titulo: "Ale Galán out of Acapulco, eyes the Finals in Barcelona"
  seo_descripcion: "Ale Galán will miss the Acapulco Major, the fourth tournament in a row he sits out through injury. His goal is to return for the Finals in Barcelona."
  palabra_clave: "Galán Acapulco"
  cuerpo: |
    He said it himself. An Instagram story, this Saturday.

    Ale Galán won't play the Acapulco Major.

    But the message doesn't end there. It ends with a goal: "I keep working hard to come back, with the aim of playing the Finals."

    He already has a date in mind. 10 to 13 December, at [the Palau Sant Jordi in Barcelona](/en/news/premier-padel-finals-2026-barcelona-presentation-attendance-record/).

    ## Thanks first

    Galán starts by saying thank you. To the people following his recovery closely. To the messages of support he's receiving. And to Mexico.

    He explained the injury himself to MARCA on the day of the World Cup final: he broke a finger on his right hand in the round of 16 in Milan.

    ## Four tournaments out

    Acapulco will be the fourth tournament in a row without him.

    First, [the Kuwait Major](/en/news/chingotto-galan-out-kuwait-major-injury/). Then [the World Cup in Qatar](/en/news/ale-galan-out-padel-world-cup-qatar-injury/) with Spain. After that, [the Dubai P1](/en/news/lebron-augsburger-win-dubai-p1-libaak-alfonso/). And now, Mexico.

    His last match was on 17 October, in the Milan semi-finals.

    If he makes it to Barcelona, almost eight weeks will have gone by.

    Chingotto, his partner, hasn't played on tour since then. Only the World Cup, with Argentina.

    ## The spot is safe

    In the Race, Galán and Chingotto are third, with 11,980 points. Only Coello and Tapia are ahead.

    Next come Lebrón and Augsburger, with 7,705. Even if they won Acapulco, worth 2,000, they wouldn't catch them.

    On points, their place in Barcelona isn't in danger.

    He just needs to get there.

    ## Acapulco, where it all began

    Acapulco isn't just any tournament for Galán.

    In March 2024 he played his last tournament there with Juan Lebrón. They lost the final to Coello and Tapia.

    Three days later, in Puerto Cabello, he was already playing with Chingotto.

    And last year, at the Major, Galán and Chingotto reached the final. They lost it to Coello and Tapia: 6-4, 7-6.

    At the Finals in Barcelona, another final against them. Close again: 6-7, 6-3, 7-6.

    ## Next stop, Barcelona

    The Acapulco main draw starts on Monday.

    This time, without him.

    His date is Barcelona. We'll be waiting for him there.

