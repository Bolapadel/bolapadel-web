es:
  slug: miguel-lamperti-despedida-premier-padel-acapulco
  titulo: "Lamperti se despide de Premier Padel en Acapulco y seguirá jugando torneos FIP"
  entradilla: "Con Octavio Álvarez, cayó 7-6 y 6-4 en treintaidosavos del Major de México, con homenaje incluido. No es una retirada: deja Premier, no la pala."
  seo_titulo: "Lamperti se despide de Premier Padel en Acapulco"
  seo_descripcion: "Miguel Lamperti, 48 años, jugó en Acapulco su último partido de Premier Padel, con homenaje. No se retira: seguirá jugando algún torneo FIP."
  palabra_clave: "Lamperti despedida"
  cuerpo: |
    Miguel Lamperti ya ha jugado su último partido en Premier Padel.

    Fue anoche, en Acapulco. En España, ya de madrugada.

    Con Octavio Álvarez, en treintaidosavos del Major de México. Enfrente, Enrique Goenaga y Guillermo Collado.

    7-6 y 6-4. El primer set se fue en el tie-break. El segundo, por un break. Hora y media.

    <figure><img src="/img/noticias/lamperti-acapulco-ultimo-partido-alvarez.jpg" alt="Miguel Lamperti y Octavio Álvarez se pasan la bola en la pista de Acapulco" width="819" height="1024" loading="lazy"><figcaption>Miguel Lamperti y Octavio Álvarez, en Acapulco. Imagen: Premier Padel</figcaption></figure>

    ## Dos homenajes en dos días

    El lunes perdió en la previa, en dos tie-breaks. Y ya hubo un primer reconocimiento.

    Parecía el adiós. Pero entró en el cuadro [como lucky loser](/actualidad/lamperti-lucky-loser-acapulco-cuadro-final/) y Acapulco le dio un día más.

    Anoche llegó el segundo homenaje. La grada le cantó que es mexicano. Sus compañeros lo rodearon en la pista.

    Pasó en Acapulco, la ciudad donde nació el pádel.

    ## Que nadie lo jubile

    No es una retirada.

    Lamperti deja Premier Padel. La pala, no.

    «Si por mí fuera, nunca me retiraría porque me encanta jugar», ha dicho.

    Seguirá jugando algún torneo del FIP Tour. Hará exhibiciones y clínics. Y quiere dedicar un año a formarse como entrenador.

    <figure><img src="/img/noticias/lamperti-acapulco-ultimo-partido-remate.jpg" alt="Miguel Lamperti levanta el puño en la pista de Acapulco" width="819" height="1024" loading="lazy"><figcaption>Miguel Lamperti, en Acapulco. Imagen: Premier Padel</figcaption></figure>

    ## Los chicos que eligió

    A Lamperti le gusta jugar con chavales. Y elige bien.

    En 2021 empezó la temporada con Arturo Coello. Después vino Mike Yanguas. En 2022, Jon Sanz.

    El 7 de noviembre, los tres fueron [campeones del mundo con España](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/).

    En 2025 jugó con Dani Santigosa. Hace un año, aquí mismo, salió de la previa con Juani de Pascual. Y su último compañero en Premier ha sido Octavio Álvarez. Tiene 22 años. Él, 48.

    Esta noche, ya de madrugada en España, Coello, Yanguas, Sanz, Santigosa y De Pascual juegan los dieciseisavos de Acapulco.

    Lamperti ya no está en el cuadro.

    Ellos, sí.

    ## Gracias, Miguel

    48 años. Más de 25 de carrera.

    Ayer contábamos que el último baile tenía cuadro final.

    Lo tuvo. Y tuvo homenaje.

    Gracias, Miguel. Y que siga jugando.

en:
  slug: miguel-lamperti-farewell-premier-padel-acapulco
  titulo: "Lamperti says goodbye to Premier Padel in Acapulco and will keep playing FIP events"
  entradilla: "With Octavio Álvarez, he lost 7-6, 6-4 in the round of 64 at the Mexico Major, with a tribute included. It isn't a retirement: he's leaving Premier, not his racket."
  seo_titulo: "Lamperti says goodbye to Premier Padel in Acapulco"
  seo_descripcion: "Miguel Lamperti, 48, played his last Premier Padel match in Acapulco, with a tribute. He isn't retiring: he will keep playing some FIP events."
  palabra_clave: "Lamperti farewell"
  cuerpo: |
    Miguel Lamperti has played his last match in Premier Padel.

    It was last night, in Acapulco. In Spain, it was already the early hours.

    With Octavio Álvarez, in the round of 64 at the Mexico Major. On the other side of the net, Enrique Goenaga and Guillermo Collado.

    7-6, 6-4. The first set went to a tie-break. The second, to a single break. An hour and a half.

    <figure><img src="/img/noticias/lamperti-acapulco-ultimo-partido-alvarez.jpg" alt="Miguel Lamperti y Octavio Álvarez pass the ball on court in Acapulco" width="819" height="1024" loading="lazy"><figcaption>Miguel Lamperti y Octavio Álvarez, in Acapulco. Photo: Premier Padel</figcaption></figure>

    ## Two tributes in two days

    On Monday he lost in qualifying, in two tie-breaks. And there was already a first tribute.

    It looked like goodbye. But he got into the draw [as a lucky loser](/en/news/lamperti-lucky-loser-acapulco-main-draw/) and Acapulco gave him one more day.

    Last night came the second tribute. The crowd sang that he's Mexican. His fellow players gathered around him on court.

    It happened in Acapulco, the city where padel was born.

    ## Don't call it a retirement

    He isn't retiring.

    Lamperti is leaving Premier Padel. Not his racket.

    "If it were up to me, I would never retire, because I love playing," he said.

    He'll keep playing some FIP Tour events. He'll do exhibitions and clinics. And he wants to spend a year training to become a coach.

    <figure><img src="/img/noticias/lamperti-acapulco-ultimo-partido-remate.jpg" alt="Miguel Lamperti raises his fist on court in Acapulco" width="819" height="1024" loading="lazy"><figcaption>Miguel Lamperti, in Acapulco. Photo: Premier Padel</figcaption></figure>

    ## The kids he chose

    Lamperti likes playing with youngsters. And he chooses well.

    In 2021 he started the season with Arturo Coello. Then came Mike Yanguas. In 2022, Jon Sanz.

    On 7 November, all three became [world champions with Spain](/en/news/padel-world-cup-2026-final-spain-champions-argentina/).

    In 2025 he played with Dani Santigosa. A year ago, at this very tournament, he came through qualifying with Juani de Pascual. And his last partner in Premier has been Octavio Álvarez. He's 22. Lamperti, 48.

    Tonight, in the early hours in Spain, Coello, Yanguas, Sanz, Santigosa and De Pascual play their round of 32 matches in Acapulco.

    Lamperti is no longer in the draw.

    They are.

    ## Thank you, Miguel

    48 years old. More than 25 years of career.

    Yesterday we wrote that the last dance had a main draw.

    It did. And it had a tribute.

    Thank you, Miguel. And keep playing.

