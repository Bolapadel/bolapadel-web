  slug: finales-major-kuwait-arce-tello-sanchez-ustero
  titulo: "Arce y Tello jugarán la final de Kuwait contra Coello y Tapia; Ari y Andrea, contra Triay y Brea"
  entradilla: "Hace una semana, Arce y Tello perdían una final en Melilla. Hoy juegan la de un Major. Ari Sánchez y Andrea Ustero llegan tras más de tres horas y media de semifinal. Contra Triay y Brea van seis a seis este año."
  seo_titulo: "Finales del Major de Kuwait: Arce y Tello, Ari y Andrea"
  seo_descripcion: "Finales del Major de Kuwait: Arce y Tello contra Coello y Tapia, su primera final juntos en Premier. Ari Sánchez y Andrea Ustero, contra Triay y Brea."
  palabra_clave: "Major de Kuwait"
  cuerpo: |
    Hace una semana, Maxi Arce y Juan Tello perdían una final en Melilla.

    Un FIP Gold. 6-1 y 6-4 contra Lucas Bergamini y Jairo Bautista.

    Hoy juegan otra. La del Major de Kuwait.

    Enfrente, Arturo Coello y Agustín Tapia.

    ## 6-4 y 6-3 a Goñi y Alonso

    Arce y Tello, novenos cabezas de serie, ganaron 6-4 y 6-3 a Aimar Goñi y Edu Alonso. Una hora y 19 minutos.

    Se acabó la [primera semifinal de Goñi en un Major](/actualidad/aimar-goni-edu-alonso-semifinales-major-kuwait-mundial/). Ahora, a Doha: el lunes empieza el Mundial y él va con España.

    ## La primera

    Arce y Tello nunca habían pasado de cuartos juntos en Premier Padel. Ahora, final.

    Para Arce, salteño, zurdo y con 28 años, es la primera en un Major. Tello, cordobés, 31, no jugaba una final de un Major desde París 2022, según Premier Padel.

    Y Tello ya sabe lo que es jugar una final contra Coello y Tapia. Málaga, julio de 2023. Con Álex Ruiz. Perdieron 7-5 y 7-6.

    ## Coello y Tapia, en menos de una hora

    Coello y Tapia ganaron 6-2 y 6-2 a Tino Libaak y Gonzalo Alfonso.

    Libaak y Alfonso venían de [volver a ganar a Lebrón y Augsburger](/actualidad/libaak-alfonso-lebron-augsburger-cuartos-major-kuwait/). Contra los números uno, cuatro juegos.

    Coello y Tapia llevan 12 títulos este año. Han ganado sus diez últimas finales.

    Contra Arce y Tello solo han jugado una vez. En octavos de Madrid, en septiembre: 7-6 y 6-3.

    Si ganan, se aseguran el número uno de la Race, según Premier Padel.

    ## Ari y Andrea, otra vez al límite

    Ari Sánchez y Andrea Ustero ganaron 4-6, 7-6 y 7-6 a Paula Josemaría y Bea González, segundas cabezas de serie.

    Dos tie-breaks. Más de tres horas y media. Al final, cada pareja ganó la mitad de los puntos.

    No es la primera vez. En junio, en la semifinal del Major de Italia, se fueron a más de cuatro horas. También ganaron Ari y Andrea.

    Al día siguiente, en la final, les esperaban Triay y Brea. Perdieron 6-1 y 7-5.

    Hoy, lo mismo. Triay y Brea.

    Andrea tiene 19 años. Ari, 29. Es su quinta final seguida: París, Rotterdam, Düsseldorf, Milán y Kuwait. Han ganado tres.

    ## Triay y Brea, también en tres sets

    Gemma Triay y Delfi Brea, números uno, ganaron 6-4, 2-6 y 7-6 a Claudia Fernández y Martina Calvo. Más de tres horas.

    ## Seis a seis

    Será la decimotercera vez que se cruzan este año. Van seis a seis.

    Las tres últimas, para Ari y Andrea: Rotterdam, Düsseldorf y Milán.

    Si ganan Ari y Andrea, se quedarán a 1.180 puntos de Triay y Brea en la Race. Si ganan Triay y Brea, la distancia sube a 2.780. Son las cuentas de Premier Padel. Quedan Dubái, México y las Finals.

    ## Y el lunes, el Mundial

    Coello y Tapia, compañeros hoy. Desde el lunes, en Doha, cada uno con su selección. Lo mismo Triay y Brea.

    Arce también va al Mundial con Argentina. Ari y Andrea, con España.

    ## Horarios (hora española)

    - **14:00** · Ari Sánchez y Andrea Ustero contra Gemma Triay y Delfi Brea.
    - **No antes de las 17:00** · Maxi Arce y Juan Tello contra Arturo Coello y Agustín Tapia.

