es:
  slug: mundial-padel-2026-italia-bronce-femenino-francia
  titulo: "Italia gana a Francia y suma su cuarto bronce seguido en el Mundial femenino"
  entradilla: "Las italianas ganaron 2-0 a Francia en el partido por el tercer puesto. Bronce en 2021, en 2022, en 2024 y ahora otra vez en Doha."
  seo_titulo: "Mundial de pádel 2026: Italia, cuarto bronce seguido"
  seo_descripcion: "Mundial de pádel 2026: Italia gana 2-0 a Francia y suma su cuarto bronce femenino seguido. Baldi y Sussarello remontan; Dal Pozzo y Stellato cierran."
  palabra_clave: "Mundial de pádel 2026"
  cuerpo: |
    Cuarto Mundial seguido. Cuarto bronce seguido.

    Italia ganó 2-0 a Francia en el partido por el tercer puesto. Otra vez justo detrás de España y Argentina.

    En las tres ediciones anteriores, el bronce italiano se decidió en el tercer partido. Esta vez no hizo falta.

    ## Baldi y Sussarello: de perder a remontar

    Ayer, en la semifinal contra Argentina, Caterina Baldi y Giulia Sussarello perdieron 6-2, 6-2 con Osoro y Fassio.

    Hoy también empezaron perdiendo. 4-6 contra Pothier y Touly.

    Y le dieron la vuelta: 6-1, 6-3. Dos horas y cinco minutos de partido.

    «Por primera vez sentí de verdad el peso de la responsabilidad», contó Baldi.

    ## Dal Pozzo y Stellato: 21 años y 44

    Ayer, Giulia Dal Pozzo jugó con Giorgia Marchetti. Hoy, Marcela Ferrari, la capitana, la puso con Emily Stellato.

    Una tiene 21 años. La otra, 44.

    Ganaron 7-6 y 6-3 a Collombon y Bahurel, en una hora y 36 minutos.

    «Cada pelota pesa», dijo Stellato. Hoy pesaban un bronce.

    Orsi y Marchetti, que tenían el tercer partido, no tuvieron que jugarlo.

    ## Cuatro bronces, tres en Doha

    - **2021, Doha:** contra Francia.
    - **2022, Dubái:** 2-1 a Bélgica.
    - **2024, Doha:** contra Portugal.
    - **2026, Doha:** 2-0 a Francia.

    Francia, que ayer perdió 2-0 con España, se queda cuarta. Como hace cinco años, también en Doha.

    Ferrari lo resume en una frase: «El trabajo da sus frutos».

    Por delante, España y Argentina. Las de siempre.

    Detrás, Italia. También la de siempre.

en:
  slug: padel-world-cup-2026-italy-women-bronze-france
  titulo: "Italy beat France for a fourth straight bronze at the women's World Cup"
  entradilla: "Italy's women beat France 2-0 in the third-place match. Bronze in 2021, in 2022, in 2024 and now again in Doha."
  seo_titulo: "2026 Padel World Cup: Italy win a fourth straight bronze"
  seo_descripcion: "2026 Padel World Cup: Italy beat France 2-0 to take women's bronze for a fourth straight time. Baldi and Sussarello come back; Dal Pozzo and Stellato seal it."
  palabra_clave: "2026 Padel World Cup"
  cuerpo: |
    Fourth World Cup in a row. Fourth bronze in a row.

    Italy beat France 2-0 in the third-place match. Once again, right behind Spain and Argentina.

    In the three previous editions, Italy's bronze was decided in the third match. This time it wasn't needed.

    ## Baldi and Sussarello: from defeat to comeback

    Yesterday, in the semi-final against Argentina, Caterina Baldi and Giulia Sussarello lost 6-2, 6-2 to Osoro and Fassio.

    Today they started by losing again. 4-6 against Pothier and Touly.

    And they turned it around: 6-1, 6-3. Two hours and five minutes on court.

    "For the first time I really felt the weight of responsibility," said Baldi.

    ## Dal Pozzo and Stellato: aged 21 and 44

    Yesterday, Giulia Dal Pozzo played with Giorgia Marchetti. Today, captain Marcela Ferrari paired her with Emily Stellato.

    One is 21. The other, 44.

    They beat Collombon and Bahurel 7-6, 6-3, in an hour and 36 minutes.

    "Every ball weighs a lot," said Stellato. Today, each one weighed a bronze medal.

    Orsi and Marchetti, down for the third match, didn't need to play it.

    ## Four bronzes, three in Doha

    - **2021, Doha:** against France.
    - **2022, Dubai:** 2-1 over Belgium.
    - **2024, Doha:** against Portugal.
    - **2026, Doha:** 2-0 over France.

    France, beaten 2-0 by Spain yesterday, finish fourth. Just like five years ago, also in Doha.

    Ferrari sums it up in one sentence: "Hard work pays off."

    Ahead of them, Spain and Argentina. The usual two.

    Right behind, Italy. Also as usual.

