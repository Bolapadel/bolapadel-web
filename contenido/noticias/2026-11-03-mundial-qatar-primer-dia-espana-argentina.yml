es:
  slug: mundial-padel-2026-primer-dia-espana-argentina
  titulo: "España y Argentina empiezan el Mundial de Qatar con un 3-0"
  entradilla: "Argentina cedió tres juegos en tres partidos ante Australia. España ganó a Suecia, con susto en el partido de Yanguas y Goñi. Ellas también empezaron con pleno. Hoy, Paraguay y Países Bajos."
  seo_titulo: "Mundial de pádel 2026: España y Argentina ganan 3-0"
  seo_descripcion: "Primer día del Mundial de pádel 2026: Argentina gana 3-0 a Australia y España 3-0 a Suecia, con susto de Yanguas y Goñi. Resultados y partidos de hoy."
  palabra_clave: "Mundial de pádel 2026"
  cuerpo: |
    El sábado, Coello y Tapia levantaban juntos el trofeo de Kuwait.

    El lunes, Coello jugó con Paquito Navarro. Tapia no jugó.

    Primer día del Mundial de Qatar. Argentina y España empezaron con un 3-0. Una, sin despeinarse. La otra, con susto.

    ## Argentina: tres juegos en tres partidos

    La campeona debutó en la pista 5, con las gradas llenas. Contra Australia, que volvía a un Mundial ocho años después.

    - **Stupaczuk y Chingotto:** 6-1, 6-1.
    - **Augsburger y Di Nenno:** 6-0, 6-0. En media hora.
    - **Arce y Alfonso:** 6-1, 6-0.

    Seis sets. Tres juegos cedidos. Entre los tres partidos, una hora y 46 minutos de pista.

    Ojo a los últimos. Arce y Alfonso son los dos debutantes de Argentina en un Mundial absoluto. Y Arce llegaba de jugar el sábado [la final de Kuwait](/actualidad/coello-tapia-campeones-major-kuwait-numero-uno-2026/), que perdió con Coello y Tapia. Dos días después, 6-1 y 6-0.

    Tapia y Libaak, el del punto que decidió el Mundial de 2024, no jugaron.

    ## España: el susto, con Goñi

    España también ganó 3-0. A Suecia. Pero no tan limpio.

    - **Coello y Paquito Navarro:** 6-3, 6-2 a Vásquez y Windahl.
    - **Yanguas y Goñi:** 6-7, 7-5, 6-2 a Axelsson y Slaryd.
    - **Lebrón y Jon Sanz:** 6-0, 6-2 a Olsson y Frost.

    <figure><img src="/img/noticias/mundial-2026-espana-coello.jpg" alt="Arturo Coello mira su pala durante el España-Suecia del Mundial de Qatar" width="1068" height="1600" loading="lazy"><figcaption>Arturo Coello, en el debut ante Suecia. Imagen: Federación Española de Pádel</figcaption></figure>

    El partido de Yanguas y Goñi fue el que le dio la eliminatoria a España. Y se les complicó. Perdieron el primer set en el tie-break, 12-10. El segundo lo sacaron 7-5. Dos horas y 13 minutos.

    Goñi es la novedad de la lista. El viernes jugó en Kuwait su primera semifinal en un Major. La perdió con Arce y Tello. El lunes, su primer partido en un Mundial.

    Se estrenó sufriendo. Pero ganando.

    [Javi Leal](/actualidad/javi-leal-sustituye-galan-mundial-qatar/), que entró por la [baja de Ale Galán](/actualidad/ale-galan-baja-mundial-qatar-lesion/), y Coki Nieto no jugaron.

    <figure><img src="/img/noticias/mundial-2026-espana-banquillo.jpg" alt="Juanjo Gutiérrez, entrenador de España, habla con uno de sus jugadores en el debut del Mundial de Qatar" width="1069" height="1600" loading="lazy"><figcaption>Juanjo Gutiérrez, entrenador de España. Imagen: Federación Española de Pádel</figcaption></figure>

    ## Lo más igualado, lejos de los favoritos

    Países Bajos ganó 2-1 a Francia, en el grupo de Argentina. Se decidió en el tercer partido: Van Opstal y Prins ganaron 6-4, 1-6 y 6-3 a Leygue y Blanqué.

    Alemania también ganó 2-1 a Chile en el tercero. Y remontando: perdió el primer set del partido decisivo y ganó los dos siguientes.

    El resto, sin sorpresas. Paraguay, Portugal, Italia y Brasil ganaron 3-0 a Emiratos, Qatar, Estados Unidos y México.

    ## Ellas, sin piedad

    España ganó 3-0 a Alemania. Cedió dos juegos en toda la eliminatoria.

    Gemma Triay, dos días después de [convertirse en la jugadora con más títulos de la historia](/actualidad/gemma-triay-59-titulos-record-historia/), ganó con Marta Ortega 6-0, 6-0. Claudia Fernández y Bea González, 6-0, 6-1. Paula Josemaría y Martina Calvo, 6-1, 6-0.

    Argentina ganó 3-0 a Chile. Riera y Bidahorria, 6-0, 6-1.

    ## Hoy

    - **12:00:** España contra Gran Bretaña y Argentina contra Bélgica, en el cuadro femenino.
    - **Desde las 16:00:** España contra Paraguay y Argentina contra Países Bajos, en el masculino.

    Paraguay también ganó sus tres partidos. En su equipo está Martín Abud, al que Lebrón y Augsburger [ganaron hace una semana en Kuwait](/actualidad/lebron-augsburger-abud-belluati-major-kuwait-libaak-alfonso/).

    Argentina se mide a Países Bajos, el equipo que ganó a Francia.

    Horas de España. [Dónde verlo](/actualidad/donde-ver-mundial-padel-2026-tv-streaming/), aquí.

    Coello ya ha ganado con otro compañero.

    A Tapia todavía no le ha tocado.

en:
  slug: padel-world-cup-2026-day-one-spain-argentina
  titulo: "Spain and Argentina start the World Cup in Qatar with a 3-0"
  entradilla: "Argentina dropped three games in three matches against Australia. Spain beat Sweden, with a scare in Yanguas and Goñi's match. The women also started with clean sweeps. Today, Paraguay and the Netherlands."
  seo_titulo: "2026 Padel World Cup: Spain and Argentina win 3-0"
  seo_descripcion: "Day one of the 2026 Padel World Cup: Argentina beat Australia 3-0 and Spain beat Sweden 3-0, with a scare for Yanguas and Goñi. Results and today's ties."
  palabra_clave: "2026 Padel World Cup"
  cuerpo: |
    On Saturday, Coello and Tapia lifted the Kuwait trophy together.

    On Monday, Coello played with Paquito Navarro. Tapia didn't play.

    Day one of the World Cup in Qatar. Argentina and Spain both started with a 3-0. One without breaking a sweat. The other, with a scare.

    ## Argentina: three games in three matches

    The champions made their debut on court 5, with the stands full. Against Australia, back at a World Cup eight years later.

    - **Stupaczuk and Chingotto:** 6-1, 6-1.
    - **Augsburger and Di Nenno:** 6-0, 6-0. In half an hour.
    - **Arce and Alfonso:** 6-1, 6-0.

    Six sets. Three games dropped. Across the three matches, one hour and 46 minutes on court.

    Keep an eye on the last pair. Arce and Alfonso are Argentina's two World Cup debutants at senior level. And Arce had played [the Kuwait final](/en/news/coello-tapia-win-kuwait-major-year-end-number-one-2026/) on Saturday, losing to Coello and Tapia. Two days later, 6-1 and 6-0.

    Tapia and Libaak, the man who won the point that decided the 2024 World Cup, didn't play.

    ## Spain: the scare, with Goñi

    Spain also won 3-0. Against Sweden. But not as cleanly.

    - **Coello and Paquito Navarro:** 6-3, 6-2 over Vásquez and Windahl.
    - **Yanguas and Goñi:** 6-7, 7-5, 6-2 over Axelsson and Slaryd.
    - **Lebrón and Jon Sanz:** 6-0, 6-2 over Olsson and Frost.

    <figure><img src="/img/noticias/mundial-2026-espana-coello.jpg" alt="Arturo Coello looks at his racket during Spain v Sweden at the World Cup in Qatar" width="1068" height="1600" loading="lazy"><figcaption>Arturo Coello, in the debut against Sweden. Image: Spanish Padel Federation</figcaption></figure>

    Yanguas and Goñi's match was the one that sealed the tie for Spain. And it got complicated. They lost the first set on a tie-break, 12-10. They took the second 7-5. Two hours and 13 minutes.

    Goñi is the newcomer in the squad. On Friday he played his first Major semi-final in Kuwait. He lost it to Arce and Tello. On Monday, his first match at a World Cup.

    He started out suffering. But winning.

    [Javi Leal](/en/news/javi-leal-replaces-galan-padel-world-cup-qatar/), who came in for [the injured Ale Galán](/en/news/ale-galan-out-padel-world-cup-qatar-injury/), and Coki Nieto didn't play.

    <figure><img src="/img/noticias/mundial-2026-espana-banquillo.jpg" alt="Juanjo Gutiérrez, Spain's coach, talks to one of his players on day one of the World Cup in Qatar" width="1069" height="1600" loading="lazy"><figcaption>Juanjo Gutiérrez, Spain's coach. Image: Spanish Padel Federation</figcaption></figure>

    ## The closest ties, away from the favourites

    The Netherlands beat France 2-1, in Argentina's group. It came down to the third match: Van Opstal and Prins beat Leygue and Blanqué 6-4, 1-6, 6-3.

    Germany also beat Chile 2-1 in the third match. And from behind: they lost the first set of the deciding match and won the next two.

    The rest, no surprises. Paraguay, Portugal, Italy and Brazil beat the UAE, Qatar, the United States and Mexico 3-0.

    ## The women, ruthless

    Spain beat Germany 3-0. They dropped two games in the whole tie.

    Gemma Triay, two days after [becoming the player with the most titles in history](/en/news/gemma-triay-59-titles-most-titles-padel-history/), won 6-0, 6-0 with Marta Ortega. Claudia Fernández and Bea González, 6-0, 6-1. Paula Josemaría and Martina Calvo, 6-1, 6-0.

    Argentina beat Chile 3-0. Riera and Bidahorria, 6-0, 6-1.

    ## Today

    - **12:00:** Spain v Great Britain and Argentina v Belgium, in the women's draw.
    - **From 16:00:** Spain v Paraguay and Argentina v the Netherlands, in the men's.

    Paraguay also won all three matches. Their team includes Martín Abud, whom Lebrón and Augsburger [beat a week ago in Kuwait](/en/news/lebron-augsburger-beat-abud-belluati-kuwait-major-libaak-alfonso/).

    Argentina face the Netherlands, the team that beat France.

    Times are CET. [Where to watch](/en/news/where-to-watch-padel-world-cup-2026-tv-streaming/), here.

    Coello has already won with another partner.

    Tapia hasn't had his turn yet.

