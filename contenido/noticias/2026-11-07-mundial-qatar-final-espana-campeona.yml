es:
  slug: mundial-padel-2026-final-espana-campeona-argentina
  titulo: "España gana a Argentina las dos finales del Mundial de Qatar"
  entradilla: "Los chicos ganaron 2-1 y cortaron la racha de Argentina, campeona en 2022 y 2024. Coello y Nieto cerraron la final. Ellas, 2-0: séptimo Mundial seguido."
  seo_titulo: "Mundial de pádel 2026: España gana las dos finales"
  seo_descripcion: "Mundial de pádel 2026: España gana 2-1 a Argentina en la final masculina, con Coello y Nieto en el partido decisivo, y ellas suman su séptimo título seguido."
  palabra_clave: "Mundial de pádel 2026"
  cuerpo: |
    Ocho días. Cinco compañeros. Dos títulos.

    El sábado pasado, Arturo Coello ganó el Major de Kuwait con Tapia. En el Mundial jugó con Paquito, con Goñi, con Javi Leal. Y hoy, con Coki Nieto, cerró la final.

    6-3, 6-2 a Libaak y Alfonso. El tercer partido. El que decidía.

    <figure><img src="/img/noticias/mundial-2026-final-coello-grito.jpg" alt="Arturo Coello celebra un punto con un grito en la final del Mundial de Qatar" width="1400" height="1750" loading="lazy"><figcaption>Arturo Coello, en la final del Mundial. Imagen: Federación Española de Pádel</figcaption></figure>

    España es campeona del mundo. 2-1 a Argentina, que buscaba su tercer Mundial seguido.

    Y ellas, 2-0. Séptimo seguido.

    ## La final, partido a partido

    - **Juan Lebrón y Aimar Goñi:** 5-7, 7-5, 6-2 a Di Nenno y Augsburger, en una hora y 59 minutos.
    - **Paquito Navarro y Jon Sanz:** perdieron 6-1, 6-2 con Tapia y Chingotto.
    - **Arturo Coello y Coki Nieto:** 6-3, 6-2 a Libaak y Alfonso, en una hora y 19 minutos.

    ## Lebrón, contra su compañero

    Lebrón y Augsburger son pareja en el circuito. Hoy, cada uno a un lado de la red.

    Argentina se llevó el primer set. Lebrón y Goñi le dieron la vuelta.

    Tercera remontada de Goñi en el Mundial. El lunes, contra Suecia. El viernes, contra Portugal. Hoy, en la final. Las tres, perdiendo el primer set.

    Hace ocho días jugaba su primera semifinal de un Major. Hoy dio el primer punto de una final del Mundial.

    <figure><img src="/img/noticias/mundial-2026-final-goni-calvo.jpg" alt="Aimar Goñi abraza a Martina Calvo, envuelta en una bandera de España, tras la final del Mundial de Qatar" width="1400" height="1750" loading="lazy"><figcaption>Aimar Goñi y Martina Calvo, tras la final. Imagen: Federación Española de Pádel</figcaption></figure>

    ## Tapia ganó su partido. No le bastó

    Tapia y Chingotto ganaron 6-1, 6-2 en 54 minutos. Fue la primera derrota de España en todo el Mundial.

    1-1. Todo al tercer partido.

    ## Coello y Nieto: lo de 2024, pero con premio

    En la final de hace dos años, Coello y Nieto también ganaron su partido: 6-1, 6-2. No bastó. Argentina se llevó los otros dos.

    Hoy les tocó el último. Y esta vez, sí.

    <figure><img src="/img/noticias/mundial-2026-final-coello-bandera.jpg" alt="Arturo Coello, con la camiseta de España y la bandera española a la cintura, tras ganar la final del Mundial de Qatar" width="1400" height="1750" loading="lazy"><figcaption>Arturo Coello, con la bandera tras la final. Imagen: Federación Española de Pádel</figcaption></figure>

    Quinto Mundial masculino para España. El primero desde 2021, también en Doha.

    Hace dos años, en esta misma ciudad, Argentina ganó 2-1. Hoy, 2-1 para España.

    Juanjo Gutiérrez, el seleccionador, ya estaba en el banquillo en 2021. Esta vez llegó a Doha [sin Galán](/actualidad/ale-galan-baja-mundial-qatar-lesion/), baja por lesión a tres días del Mundial. Y fue moviendo las parejas día a día.

    <figure><img src="/img/noticias/mundial-2026-final-juanjo-gutierrez.jpg" alt="Juanjo Gutiérrez, seleccionador español, con la camiseta de España en la pista de la final del Mundial de Qatar" width="1400" height="1750" loading="lazy"><figcaption>Juanjo Gutiérrez, seleccionador español, en la final. Imagen: Federación Española de Pádel</figcaption></figure>

    ## Ellas: séptimo Mundial seguido

    - **Ari Sánchez y Andrea Ustero:** 6-3, 6-3 a Osoro y Fassio.
    - **Paula Josemaría y Gemma Triay:** 6-2, 6-7, 6-3 a Delfi Brea y Claudia Jensen, en dos horas y 23 minutos.

    Bea González y Claudia Fernández no tuvieron que jugar.

    El set que perdieron Josemaría y Triay fue el primero que cedía España en todo el Mundial.

    Triay le ganó a Brea, su compañera en el circuito. Hace una semana [ganaban juntas en Kuwait](/actualidad/coello-tapia-campeones-major-kuwait-numero-uno-2026/).

    Décimo Mundial para España. Séptimo seguido. El primero de Carolina Navarro como seleccionadora. [Su final, aquí](/actualidad/mundial-padel-2026-espana-campeona-femenina-argentina/).

    <figure><img src="/img/noticias/mundial-2026-final-espana-chicas-celebracion.jpg" alt="Las jugadoras de la selección española se abrazan en la pista tras ganar la final del Mundial de Qatar" width="1066" height="1600" loading="lazy"><figcaption>La selección española celebra el título en Doha. Imagen: Federación Española de Pádel</figcaption></figure>

    ## Cada uno con su camiseta

    <figure><img src="/img/noticias/mundial-2026-final-espana-equipo-masculino.jpg" alt="Los jugadores de la selección española masculina saludan al público en la pista del Mundial de Qatar, uno de ellos con la bandera de España" width="1400" height="1750" loading="lazy"><figcaption>La selección española masculina, en la pista de Doha. Imagen: Federación Española de Pádel</figcaption></figure>

    El sábado pasado, en Kuwait, Coello y Tapia levantaban el mismo trofeo. Triay y Brea, también.

    [Este sábado se jugaban el Mundial](/actualidad/mundial-padel-2026-semifinales-espana-argentina-doble-final/). Cada uno con su camiseta.

    El oro se queda en España.

    Las dos veces.

en:
  slug: padel-world-cup-2026-final-spain-champions-argentina
  titulo: "Spain beat Argentina in both World Cup finals in Qatar"
  entradilla: "The men won 2-1 and ended Argentina's run as 2022 and 2024 champions. Coello and Nieto sealed the final. The women won 2-0: a seventh straight World Cup."
  seo_titulo: "2026 Padel World Cup: Spain win both finals"
  seo_descripcion: "2026 Padel World Cup: Spain beat Argentina 2-1 in the men's final, with Coello and Nieto winning the decider, and the women take a seventh straight title."
  palabra_clave: "2026 Padel World Cup"
  cuerpo: |
    Eight days. Five partners. Two titles.

    Last Saturday, Arturo Coello won the Kuwait Major with Tapia. At the World Cup he played with Paquito, with Goñi, with Javi Leal. And today, with Coki Nieto, he closed out the final.

    6-3, 6-2 over Libaak and Alfonso. The third match. The decider.

    <figure><img src="/img/noticias/mundial-2026-final-coello-grito.jpg" alt="Arturo Coello roars after winning a point in the World Cup final in Qatar" width="1400" height="1750" loading="lazy"><figcaption>Arturo Coello, in the World Cup final. Image: Spanish Padel Federation</figcaption></figure>

    Spain are world champions. 2-1 over Argentina, who were chasing a third World Cup in a row.

    And the women, 2-0. A seventh in a row.

    ## The final, match by match

    - **Juan Lebrón and Aimar Goñi:** 5-7, 7-5, 6-2 over Di Nenno and Augsburger, in an hour and 59 minutes.
    - **Paquito Navarro and Jon Sanz:** lost 6-1, 6-2 to Tapia and Chingotto.
    - **Arturo Coello and Coki Nieto:** 6-3, 6-2 over Libaak and Alfonso, in an hour and 19 minutes.

    ## Lebrón against his partner

    Lebrón and Augsburger are partners on tour. Today, they were on opposite sides of the net.

    Argentina took the first set. Lebrón and Goñi turned it around.

    Goñi's third comeback of the World Cup. On Monday, against Sweden. On Friday, against Portugal. Today, in the final. All three after losing the first set.

    Eight days ago he played his first Major semi-final. Today he won the first point of a World Cup final.

    <figure><img src="/img/noticias/mundial-2026-final-goni-calvo.jpg" alt="Aimar Goñi hugs Martina Calvo, wrapped in a Spanish flag, after the World Cup final in Qatar" width="1400" height="1750" loading="lazy"><figcaption>Aimar Goñi and Martina Calvo, after the final. Image: Spanish Padel Federation</figcaption></figure>

    ## Tapia won his match. It wasn't enough

    Tapia and Chingotto won 6-1, 6-2 in 54 minutes. It was Spain's first defeat of the whole World Cup.

    1-1. Everything down to the third match.

    ## Coello and Nieto: 2024 again, but with the prize

    In the final two years ago, Coello and Nieto also won their match: 6-1, 6-2. It wasn't enough. Argentina took the other two.

    Today they had the last one. And this time, it was enough.

    <figure><img src="/img/noticias/mundial-2026-final-coello-bandera.jpg" alt="Arturo Coello, in Spain's shirt with the Spanish flag around his waist, after winning the World Cup final in Qatar" width="1400" height="1750" loading="lazy"><figcaption>Arturo Coello, with the flag after the final. Image: Spanish Padel Federation</figcaption></figure>

    A fifth men's World Cup for Spain. The first since 2021, also in Doha.

    Two years ago, in this same city, Argentina won 2-1. Today, 2-1 to Spain.

    Juanjo Gutiérrez, the head coach, was already on the bench in 2021. This time he arrived in Doha [without Galán](/en/news/ale-galan-out-padel-world-cup-qatar-injury/), ruled out injured three days before the World Cup. And he kept changing the pairs day by day.

    <figure><img src="/img/noticias/mundial-2026-final-juanjo-gutierrez.jpg" alt="Juanjo Gutiérrez, Spain's head coach, in Spain's shirt on court at the World Cup final in Qatar" width="1400" height="1750" loading="lazy"><figcaption>Juanjo Gutiérrez, Spain's head coach, at the final. Image: Spanish Padel Federation</figcaption></figure>

    ## The women: a seventh straight World Cup

    - **Ari Sánchez and Andrea Ustero:** 6-3, 6-3 over Osoro and Fassio.
    - **Paula Josemaría and Gemma Triay:** 6-2, 6-7, 6-3 over Delfi Brea and Claudia Jensen, in two hours and 23 minutes.

    Bea González and Claudia Fernández didn't need to play.

    The set Josemaría and Triay dropped was the first set Spain lost in the whole World Cup.

    Triay beat Brea, her partner on tour. A week ago [they won Kuwait together](/en/news/coello-tapia-win-kuwait-major-year-end-number-one-2026/).

    A tenth World Cup for Spain. A seventh in a row. Carolina Navarro's first as head coach. [Their final, here](/en/news/padel-world-cup-2026-spain-women-champions-argentina/).

    <figure><img src="/img/noticias/mundial-2026-final-espana-chicas-celebracion.jpg" alt="Spain's players hug on court after winning the World Cup final in Qatar" width="1066" height="1600" loading="lazy"><figcaption>Spain celebrate the title in Doha. Image: Spanish Padel Federation</figcaption></figure>

    ## Each in their own shirt

    <figure><img src="/img/noticias/mundial-2026-final-espana-equipo-masculino.jpg" alt="Spain's men's team wave to the crowd on court at the World Cup in Qatar, one of them wearing the Spanish flag" width="1400" height="1750" loading="lazy"><figcaption>Spain's men's team, on court in Doha. Image: Spanish Padel Federation</figcaption></figure>

    Last Saturday, in Kuwait, Coello and Tapia lifted the same trophy. So did Triay and Brea.

    [This Saturday they played for the World Cup](/en/news/padel-world-cup-2026-semi-finals-spain-argentina-double-final/). Each in their own shirt.

    The gold stays in Spain.

    Both times.

