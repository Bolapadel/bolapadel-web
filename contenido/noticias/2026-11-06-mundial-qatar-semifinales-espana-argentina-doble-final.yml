es:
  slug: mundial-padel-2026-semifinales-espana-argentina-doble-final
  titulo: "España y Argentina jugarán las dos finales del Mundial de Qatar"
  entradilla: "España ganó 2-0 a Portugal y ellas, 2-0 a Francia. Argentina, 2-0 a Italia en los dos cuadros. El sábado, doble final en Doha, como en 2021 y en 2024."
  seo_titulo: "Mundial de pádel 2026: España y Argentina, doble final"
  seo_descripcion: "Semifinales del Mundial de pádel 2026: España gana 2-0 a Portugal y a Francia y Argentina, 2-0 a Italia. El sábado, doble final España-Argentina en Doha."
  palabra_clave: "Mundial de pádel 2026"
  cuerpo: |
    Coello no jugó hoy.

    Tapia, sí. Con Chingotto, el compañero de Galán. 6-3 y 6-2 a Italia.

    Y pasó lo que se esperaba desde el sorteo: España contra Argentina en las dos finales del Mundial.

    En Doha. Como en 2021. Como en 2024.

    ## España: Goñi y Yanguas vuelven a remontar

    España ganó 2-0 a Portugal.

    - **Aimar Goñi y Mike Yanguas:** 4-6, 6-3, 6-2 a los hermanos Deus.
    - **Juan Lebrón y Paquito Navarro:** 6-2, 6-4 a Araújo y Graça.

    Jon Sanz y Javi Leal, que tenían el tercero, no jugaron.

    Goñi y Yanguas perdieron el primer set. Como el lunes contra Suecia. Y como el lunes, le dieron la vuelta: una hora y 38 minutos de partido.

    <figure><img src="/img/noticias/mundial-2026-semifinal-espana-jugador.jpg" alt="Un jugador de España prepara un golpe en el Mundial de Qatar, con banderas españolas en la grada" width="1320" height="1397" loading="lazy"><figcaption>España, en el Mundial de Qatar. Imagen: Federación Española de Pádel</figcaption></figure>

    Lebrón y Paquito cerraron la eliminatoria en algo más de una hora.

    España lleva trece partidos en el Mundial. Los ha ganado todos.

    ## Argentina: Tapia y Chingotto, como en 2024

    Argentina ganó 2-0 a Italia.

    - **Di Nenno y Augsburger:** 6-1, 6-1 a Montiel y Abbate, en 49 minutos.
    - **Tapia y Chingotto:** 6-3, 6-2 a Patiniotis y Brambilla.

    Alfonso y Libaak no jugaron.

    Tapia y Chingotto ya jugaron juntos la final de hace dos años. Ganaron su partido, contra Lebrón y Galán.

    Argentina, campeona de los dos últimos Mundiales, lleva catorce partidos y catorce victorias.

    ## Ellas: ni un set perdido

    España ganó 2-0 a Francia.

    - **Paula Josemaría y Gemma Triay:** 6-3, 6-1 a Godallier y Mansart.
    - **Claudia Fernández y Bea González:** 6-0, 6-0 a Collombon y Bahurel, en 44 minutos.

    Andrea Ustero y Martina Calvo no jugaron.

    Catorce partidos en el Mundial. Catorce victorias. Ni un set perdido. Diecinueve juegos cedidos.

    Van a por el séptimo Mundial seguido. El primero de Carolina Navarro como seleccionadora.

    Argentina ganó 2-0 a Italia. Osoro y Fassio, 6-2, 6-2. Brea y Jensen, 6-2, 6-3.

    <figure><img src="/img/noticias/mundial-2026-semifinal-espana-abrazo.jpg" alt="Dos jugadores de España se abrazan en la pista del Mundial de Qatar ante una grada con banderas españolas" width="1068" height="1600" loading="lazy"><figcaption>España, en el Mundial de Qatar. Imagen: Federación Española de Pádel</figcaption></figure>

    ## Doha, por tercera vez

    Doha ya tuvo Mundial en 2021 y en 2024. Las dos veces, las dos finales fueron España contra Argentina.

    - **2021:** ganó España las dos. En la masculina, Coello y Galán ganaron 6-1, 7-5 a Sanyo y Tapia.
    - **2024:** una para cada país. Ellas, 2-0 para España. Ellos, 2-1 para Argentina, con el último partido decidido en el tie-break del tercer set.

    ## Las finales, este sábado

    - **12:00:** ellas. España contra Argentina.
    - **Después:** ellos. España contra Argentina.

    Horas de España; en Argentina, cuatro menos. [Dónde verlo](/actualidad/donde-ver-mundial-padel-2026-tv-streaming/), aquí.

    El sábado pasado, Coello y Tapia ganaban juntos en Kuwait. Gemma Triay y Delfi Brea, también.

    Este sábado se juegan el Mundial.

    Cada uno con su camiseta.

en:
  slug: padel-world-cup-2026-semi-finals-spain-argentina-double-final
  titulo: "Spain and Argentina will meet in both World Cup finals in Qatar"
  entradilla: "Spain beat Portugal 2-0 and the women beat France 2-0. Argentina beat Italy 2-0 in both draws. On Saturday, a double final in Doha, just like 2021 and 2024."
  seo_titulo: "2026 Padel World Cup: Spain v Argentina in both finals"
  seo_descripcion: "2026 Padel World Cup semi-finals: Spain beat Portugal and France 2-0 and Argentina beat Italy 2-0. On Saturday, a Spain v Argentina double final in Doha."
  palabra_clave: "2026 Padel World Cup"
  cuerpo: |
    Coello didn't play today.

    Tapia did. With Chingotto, Galán's partner. 6-3, 6-2 over Italy.

    And what everyone expected since the draw happened: Spain against Argentina in both World Cup finals.

    In Doha. Just like 2021. Just like 2024.

    ## Spain: Goñi and Yanguas come back again

    Spain beat Portugal 2-0.

    - **Aimar Goñi and Mike Yanguas:** 4-6, 6-3, 6-2 over the Deus brothers.
    - **Juan Lebrón and Paquito Navarro:** 6-2, 6-4 over Araújo and Graça.

    Jon Sanz and Javi Leal, down for the third match, didn't get on court.

    Goñi and Yanguas lost the first set. Just like on Monday against Sweden. And just like on Monday, they turned it around: an hour and 38 minutes on court.

    <figure><img src="/img/noticias/mundial-2026-semifinal-espana-jugador.jpg" alt="A Spain player gets ready to play a shot at the World Cup in Qatar, with Spanish flags in the stands" width="1320" height="1397" loading="lazy"><figcaption>Spain, at the World Cup in Qatar. Image: Spanish Padel Federation</figcaption></figure>

    Lebrón and Paquito closed out the tie in just over an hour.

    Spain have played thirteen matches at the World Cup. They have won them all.

    ## Argentina: Tapia and Chingotto, just like 2024

    Argentina beat Italy 2-0.

    - **Di Nenno and Augsburger:** 6-1, 6-1 over Montiel and Abbate, in 49 minutes.
    - **Tapia and Chingotto:** 6-3, 6-2 over Patiniotis and Brambilla.

    Alfonso and Libaak didn't play.

    Tapia and Chingotto already played the final together two years ago. They won their match, against Lebrón and Galán.

    Argentina, champions at the last two World Cups, have played fourteen matches and won fourteen.

    ## The women: not a set dropped

    Spain beat France 2-0.

    - **Paula Josemaría and Gemma Triay:** 6-3, 6-1 over Godallier and Mansart.
    - **Claudia Fernández and Bea González:** 6-0, 6-0 over Collombon and Bahurel, in 44 minutes.

    Andrea Ustero and Martina Calvo didn't play.

    Fourteen matches at the World Cup. Fourteen wins. Not a set dropped. Nineteen games conceded.

    They are going for a seventh World Cup in a row. Carolina Navarro's first as head coach.

    Argentina beat Italy 2-0. Osoro and Fassio, 6-2, 6-2. Brea and Jensen, 6-2, 6-3.

    <figure><img src="/img/noticias/mundial-2026-semifinal-espana-abrazo.jpg" alt="Two Spain players hug on court at the World Cup in Qatar in front of a crowd with Spanish flags" width="1068" height="1600" loading="lazy"><figcaption>Spain, at the World Cup in Qatar. Image: Spanish Padel Federation</figcaption></figure>

    ## Doha, for the third time

    Doha already hosted the World Cup in 2021 and 2024. Both times, both finals were Spain against Argentina.

    - **2021:** Spain won both. In the men's final, Coello and Galán beat Sanyo and Tapia 6-1, 7-5.
    - **2024:** one each. The women, 2-0 to Spain. The men, 2-1 to Argentina, with the last match decided in a third-set tie-break.

    ## The finals, this Saturday

    - **12:00:** the women. Spain v Argentina.
    - **Afterwards:** the men. Spain v Argentina.

    Times are CET; in Argentina, four hours earlier. [Where to watch](/en/news/where-to-watch-padel-world-cup-2026-tv-streaming/), here.

    Last Saturday, Coello and Tapia won Kuwait together. So did Gemma Triay and Delfi Brea.

    This Saturday they play for the World Cup.

    Each in their own shirt.

