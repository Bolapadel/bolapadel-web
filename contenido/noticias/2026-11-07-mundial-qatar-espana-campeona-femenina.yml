es:
  slug: mundial-padel-2026-espana-campeona-femenina-argentina
  titulo: "España gana el Mundial femenino de Qatar y suma siete títulos seguidos"
  entradilla: "Ari Sánchez y Andrea Ustero ganaron 6-3, 6-3 a Osoro y Fassio. Paula Josemaría y Gemma Triay cerraron el 2-0 contra Brea y Jensen: 6-2, 6-7, 6-3. Décimo Mundial para España."
  seo_titulo: "Mundial de pádel 2026: España, campeona en femenino"
  seo_descripcion: "España gana el Mundial de pádel 2026 femenino: 2-0 a Argentina en Doha, con Ari Sánchez, Andrea Ustero, Paula Josemaría y Gemma Triay. Siete títulos seguidos."
  palabra_clave: "Mundial de pádel 2026"
  cuerpo: |
    España es campeona del mundo. Otra vez.

    2-0 a Argentina en la final de Doha. Séptimo Mundial seguido.

    El punto del título lo ganaron Paula Josemaría y Gemma Triay. Enfrente estaba Delfi Brea, la compañera de Gemma en el circuito.

    Hace una semana ganaron juntas el Major de Kuwait.

    ## La final

    - **Ari Sánchez y Andrea Ustero:** 6-3, 6-3 a Aranza Osoro y Martina Fassio, en una hora y 29 minutos.
    - **Paula Josemaría y Gemma Triay:** 6-2, 6-7, 6-3 a Delfi Brea y Claudia Jensen.

    Claudia Fernández y Bea González, que tenían el tercero, no jugaron.

    <figure><img src="/img/noticias/mundial-2026-final-femenina-espana-abrazo.jpg" alt="Dos jugadoras de la selección española se abrazan en la pista central tras ganar su partido en la final del Mundial de Qatar" width="1112" height="671" loading="lazy"><figcaption>España, en la final del Mundial de Qatar. Imagen: Federación Internacional de Pádel</figcaption></figure>

    ## Ari y Andrea, siete días después

    El sábado pasado, Ari y Andrea perdieron la final de Kuwait. Contra Gemma y Delfi: 3-6, 6-1, 6-1.

    Ayer no pisaron la pista en la semifinal.

    Hoy han abierto la final del Mundial. Sin ceder un set.

    Andrea tiene 19 años.

    ## El único set

    Paula y Gemma ganaron el primero 6-2. El segundo se les fue en el tie-break.

    Fue el único set que perdió España en todo el Mundial. Dieciséis partidos, dieciséis victorias.

    En el tercero, 6-3.

    <figure><img src="/img/noticias/mundial-2026-final-femenina-espana-golpe.jpg" alt="Una jugadora española golpea por alto junto a su compañera en la red, en la final del Mundial de Qatar" width="1112" height="693" loading="lazy"><figcaption>España, en la final del Mundial de Qatar. Imagen: Federación Internacional de Pádel</figcaption></figure>

    Gemma y Delfi comparten el número uno del ranking. El sábado pasado levantaban juntas un trofeo.

    Hoy solo una podía.

    Le ha tocado a Gemma.

    ## Diez Mundiales

    España ganó el Mundial femenino en 2014, 2016, 2018, 2021, 2022 y 2024. Ahora, en 2026. Siete seguidos.

    Diez en total. Argentina tiene ocho.

    Es el primero de Carolina Navarro como seleccionadora.

    ## Ahora, ellos

    La final masculina, también España contra Argentina, va a continuación en la misma pista. [Dónde verlo](/actualidad/donde-ver-mundial-padel-2026-tv-streaming/), aquí.

    Coello y Tapia, otra vez, cada uno con su camiseta.

en:
  slug: padel-world-cup-2026-spain-women-champions-argentina
  titulo: "Spain win the women's World Cup in Qatar for a seventh title in a row"
  entradilla: "Ari Sánchez and Andrea Ustero beat Osoro and Fassio 6-3, 6-3. Paula Josemaría and Gemma Triay sealed the 2-0 against Brea and Jensen: 6-2, 6-7, 6-3. A tenth World Cup for Spain."
  seo_titulo: "2026 Padel World Cup: Spain win the women's title"
  seo_descripcion: "Spain win the women's 2026 Padel World Cup: 2-0 over Argentina in Doha with Ari Sánchez, Andrea Ustero, Paula Josemaría and Gemma Triay. Seven titles in a row."
  palabra_clave: "2026 Padel World Cup"
  cuerpo: |
    Spain are world champions. Again.

    2-0 over Argentina in the final in Doha. A seventh World Cup in a row.

    The title-winning point went to Paula Josemaría and Gemma Triay. On the other side of the net was Delfi Brea, Gemma's partner on the tour.

    A week ago they won the Kuwait Major together.

    ## The final

    - **Ari Sánchez and Andrea Ustero:** 6-3, 6-3 over Aranza Osoro and Martina Fassio, in an hour and 29 minutes.
    - **Paula Josemaría and Gemma Triay:** 6-2, 6-7, 6-3 over Delfi Brea and Claudia Jensen.

    Claudia Fernández and Bea González, down for the third match, didn't get on court.

    <figure><img src="/img/noticias/mundial-2026-final-femenina-espana-abrazo.jpg" alt="Two Spain players hug on centre court after winning their match in the World Cup final in Qatar" width="1112" height="671" loading="lazy"><figcaption>Spain, in the World Cup final in Qatar. Image: International Padel Federation</figcaption></figure>

    ## Ari and Andrea, seven days later

    Last Saturday, Ari and Andrea lost the Kuwait final. Against Gemma and Delfi: 3-6, 6-1, 6-1.

    Yesterday they didn't set foot on court in the semi-final.

    Today they opened the World Cup final. Without dropping a set.

    Andrea is 19.

    ## The only set

    Paula and Gemma took the first 6-2. The second slipped away in the tie-break.

    It was the only set Spain lost in the whole World Cup. Sixteen matches, sixteen wins.

    In the third, 6-3.

    <figure><img src="/img/noticias/mundial-2026-final-femenina-espana-golpe.jpg" alt="A Spain player hits an overhead with her partner at the net, in the World Cup final in Qatar" width="1112" height="693" loading="lazy"><figcaption>Spain, in the World Cup final in Qatar. Image: International Padel Federation</figcaption></figure>

    Gemma and Delfi share the world number one spot. Last Saturday they lifted a trophy together.

    Today only one of them could.

    It was Gemma.

    ## Ten World Cups

    Spain won the women's World Cup in 2014, 2016, 2018, 2021, 2022 and 2024. Now, in 2026. Seven in a row.

    Ten in total. Argentina have eight.

    It's Carolina Navarro's first as head coach.

    ## Now, the men

    The men's final, Spain against Argentina again, follows on the same court. [Where to watch](/en/news/where-to-watch-padel-world-cup-2026-tv-streaming/), here.

    Coello and Tapia, once again, each in their own shirt.

