es:
  slug: premier-padel-finals-2026-barcelona-presentacion-record-publico
  titulo: "Barcelona presenta las Finals 2026 y va a por el récord de público"
  entradilla: "Del 10 al 13 de diciembre, en el Palau Sant Jordi. La organización ha ampliado la grada para superar los 17.000 espectadores en un día, algo que nunca se ha visto en el pádel. Tapia, campeón del año pasado, lo resume así: «Es acabar el año en casa»."
  seo_titulo: "Premier Padel Finals 2026: Barcelona va a por el récord"
  seo_descripcion: "Las Premier Padel Finals 2026 se juegan del 10 al 13 de diciembre en el Palau Sant Jordi. Barcelona quiere superar los 17.000 espectadores en un día."
  palabra_clave: "Premier Padel Finals 2026"
  cuerpo: |
    Agustín Tapia es argentino. Pero cuando habla de Barcelona, dice casa.

    «Es acabar el año en casa», contó ayer en el Saló de Cent del Ayuntamiento de Barcelona. Allí se presentaron las Qatar Airways Premier Padel Finals 2026, ante más de 150 personas.

    Se juegan del 10 al 13 de diciembre en el Palau Sant Jordi.

    Es la tercera edición. Las tres, en Barcelona.

    ## A por el récord

    La organización ha ampliado la grada. El objetivo: pasar de 17.000 espectadores en una sola jornada. Nunca ha pasado en el pádel.

    La mejor cifra hasta ahora es la del P1 de Buenos Aires: 16.920 personas en el sábado de semifinales.

    El año pasado, las Finals de Barcelona juntaron a más de 50.000 aficionados en cuatro días. Y más de seis millones las siguieron por televisión.

    Luigi Carraro, presidente de la FIP, lo tiene claro: «se van a batir todos los récords».

    <figure><img src="/img/noticias/finals-2026-presentacion-carraro.jpg" alt="Luigi Carraro, presidente de la FIP, habla en la presentación de las Premier Padel Finals 2026" width="1024" height="683" loading="lazy"><figcaption>Luigi Carraro, presidente de la FIP, en el Saló de Cent. Imagen: Premier Padel</figcaption></figure>

    Joan Cuscó, por parte de la organización, dio una pista: para el sábado y el domingo quedan muy pocas entradas.

    Carraro también pidió al Ayuntamiento y a la Generalitat que sigan apoyando para que las Finals se queden en Barcelona. Los dos estaban en la sala: David Escudé, concejal de Deportes de la ciudad, y Berni Álvarez, conseller de Deportes de Cataluña.

    ## Tapia, en casa

    Tapia vive en el Maresme. Llegó a España hace ocho o nueve años y desde entonces Barcelona es su casa. Por eso, para él, no tener que coger un avión ya es un alivio. Y tiene ganas de jugar delante de su familia.

    El Palau le ha dado de todo.

    En 2024, Coki Nieto y Jon Sanz les ganaron la final a Coello y a él: 3-6, 7-5 y 6-3. Se acababa una racha de 47 partidos seguidos ganando.

    En 2025, Coello y Tapia volvieron y ganaron. En la final, a Galán y Chingotto: 6-7, 6-3 y 7-6.

    Este año llegan con el número uno ya asegurado. [Lo cerraron en Kuwait](/actualidad/coello-tapia-campeones-major-kuwait-numero-uno-2026/).

    Hace una semana, [se bajaron del Dubái P1 por una lesión de Tapia](/actualidad/coello-tapia-baja-dubai-p1-lesion-tapia/). Su equipo no ha dado plazos. Ayer, Tapia estuvo en la presentación.

    ## Ari y Andrea, también en casa

    En la mesa, con Tapia, se sentaron Ari Sánchez y Andrea Ustero. Ari es de Reus. Andrea, de Barcelona, y tiene 19 años.

    <figure><img src="/img/noticias/finals-2026-presentacion-ustero-sanchez.jpg" alt="Andrea Ustero y Ari Sánchez en la presentación de las Premier Padel Finals 2026" width="1242" height="692" loading="lazy"><figcaption>Andrea Ustero y Ari Sánchez, en la presentación de las Finals. Imagen: Premier Padel</figcaption></figure>

    Ari ya sabe lo que es ganar aquí: fue campeona de las Finals en 2024, con Paula Josemaría.

    Ahora llega con Andrea. El 31 de octubre jugaron juntas la final de Kuwait. Y hace once días [ganaron su partido en la final del Mundial](/actualidad/mundial-padel-2026-espana-campeona-femenina-argentina/): 6-3 y 6-3.

    Ari habló de un año espectacular, mejor de lo que esperaba. Le gusta el reto del récord de público. Y contó un detalle: en la pista hablan en catalán, y las rivales no las entienden.

    Andrea quiere acabar el año como mejor se puede: en Barcelona, delante de la gente que la ha visto crecer.

    ## Cómo se juega

    Entran los 16 mejores jugadores y las 16 mejores jugadoras de la temporada. Ocho parejas por cuadro.

    - **Jueves 10 y viernes 11:** cuartos de final.
    - **Sábado 12:** semifinales.
    - **Domingo 13:** tercer puesto y finales.

    Antes queda el Major de México, del 23 al 29 de noviembre. Es la última oportunidad para entrar.

    En 2024, Barcelona le quitó a Tapia una racha. En 2025, le dio un título.

    En 2026 juega en casa. Y la casa quiere estar más llena que nunca.

en:
  slug: premier-padel-finals-2026-barcelona-presentation-attendance-record
  titulo: "Barcelona presents the 2026 Finals and goes for the attendance record"
  entradilla: "December 10 to 13, at the Palau Sant Jordi. The organisers have extended the stands to go past 17,000 fans in a single day, something padel has never seen. Tapia, last year's champion, sums it up: \"It's finishing the year at home.\""
  seo_titulo: "Premier Padel Finals 2026: Barcelona goes for the record"
  seo_descripcion: "The Premier Padel Finals 2026 are played from December 10 to 13 at the Palau Sant Jordi. Barcelona wants to go past 17,000 fans in a single day."
  palabra_clave: "Premier Padel Finals 2026"
  cuerpo: |
    Agustín Tapia is Argentine. But when he talks about Barcelona, he says home.

    "It's finishing the year at home," he said yesterday at the Saló de Cent of Barcelona City Hall. That's where the Qatar Airways Premier Padel Finals 2026 were presented, in front of more than 150 people.

    They are played from December 10 to 13 at the Palau Sant Jordi.

    It's the third edition. All three, in Barcelona.

    ## Going for the record

    The organisers have extended the stands. The goal: more than 17,000 fans in a single session. It has never happened in padel.

    The best figure so far belongs to the Buenos Aires P1: 16,920 people on semi-final Saturday.

    Last year, the Barcelona Finals brought together more than 50,000 fans over four days. And more than six million followed them on TV.

    Luigi Carraro, president of the FIP, has no doubts: "all the records will be broken."

    <figure><img src="/img/noticias/finals-2026-presentacion-carraro.jpg" alt="Luigi Carraro, president of the FIP, speaks at the presentation of the Premier Padel Finals 2026" width="1024" height="683" loading="lazy"><figcaption>Luigi Carraro, president of the FIP, at the Saló de Cent. Photo: Premier Padel</figcaption></figure>

    Joan Cuscó, for the organisers, gave a hint: very few tickets are left for Saturday and Sunday.

    Carraro also asked the City Council and the Generalitat to keep backing the event so the Finals stay in Barcelona. Both were in the room: David Escudé, the city's sports councillor, and Berni Álvarez, Catalonia's minister for sport.

    ## Tapia, at home

    Tapia lives in the Maresme. He arrived in Spain eight or nine years ago and Barcelona has been his home ever since. So, for him, not having to catch a plane is already a relief. And he's looking forward to playing in front of his family.

    The Palau has given him everything.

    In 2024, Coki Nieto and Jon Sanz beat him and Coello in the final: 3-6, 7-5 and 6-3. It ended a run of 47 straight wins.

    In 2025, Coello and Tapia came back and won it. In the final, against Galán and Chingotto: 6-7, 6-3 and 7-6.

    This year they arrive with the number one already secured. [They sealed it in Kuwait](/en/news/coello-tapia-win-kuwait-major-year-end-number-one-2026/).

    A week ago, [they withdrew from the Dubai P1 because of an injury to Tapia](/en/news/coello-tapia-out-dubai-p1-tapia-injury/). His team has not given a timeline. Yesterday, Tapia was at the presentation.

    ## Ari and Andrea, at home too

    Sitting with Tapia on the panel were Ari Sánchez and Andrea Ustero. Ari is from Reus. Andrea is from Barcelona, and she's 19.

    <figure><img src="/img/noticias/finals-2026-presentacion-ustero-sanchez.jpg" alt="Andrea Ustero and Ari Sánchez at the presentation of the Premier Padel Finals 2026" width="1242" height="692" loading="lazy"><figcaption>Andrea Ustero and Ari Sánchez, at the Finals presentation. Photo: Premier Padel</figcaption></figure>

    Ari already knows what it's like to win here: she was Finals champion in 2024, with Paula Josemaría.

    Now she arrives with Andrea. On October 31 they played the Kuwait final together. And eleven days ago [they won their match in the World Cup final](/en/news/padel-world-cup-2026-spain-women-champions-argentina/): 6-3 and 6-3.

    Ari spoke of a spectacular year, better than she expected. She likes the challenge of the attendance record. And she shared a detail: on court they talk in Catalan, and their opponents can't understand them.

    Andrea wants to end the year the best way possible: in Barcelona, in front of the people who have watched her grow up.

    ## How it works

    The 16 best men and the 16 best women of the season qualify. Eight pairs per draw.

    - **Thursday 10 and Friday 11:** quarter-finals.
    - **Saturday 12:** semi-finals.
    - **Sunday 13:** third place and finals.

    Before that comes the Mexico Major, from November 23 to 29. It's the last chance to get in.

    In 2024, Barcelona took a winning run away from Tapia. In 2025, it gave him a title.

    In 2026 he plays at home. And home wants to be fuller than ever.

