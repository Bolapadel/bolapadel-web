es:
  slug: augsburger-libaak-nuevo-logo-siux
  titulo: "Augsburger y Libaak estrenan marca propia con Siux"
  entradilla: "Dos argentinos de Siux, dos logos nuevos en una semana. Leo Augsburger ya firma como «Laugsburger». Tino Libaak lo hace con tres letras: TLK."
  seo_titulo: "Augsburger y Libaak presentan su nuevo logo con Siux"
  seo_descripcion: "Leo Augsburger firma ya como «Laugsburger» y Tino Libaak estrena el logo TLK. Augsburger y Libaak, dos jugadores de Siux con nuevo logo en una semana."
  palabra_clave: "Augsburger Libaak logo"
  cuerpo: |
    Una semana. Dos logos.

    Y los dos salen de la misma casa: Siux.

    ## Augsburger, el primero

    El 13 de octubre Leo Augsburger presentó su nueva identidad.

    Ahora firma como «Laugsburger». Así aparece en su ropa y en todo lo que comunica.

    El guiño estaba en su propio apellido. Augs-burger. Él y su marca lo han convertido en logo.

    La idea es que transmita lo que se le ve en pista: energía, pasión y compromiso.

    Tiene 22 años, es de Posadas (Misiones) y es sexto del ranking. El domingo jugó la final de Milán con Juan Lebrón.

    ## Y ahora, Libaak

    Estos días le ha tocado a Tino Libaak.

    Su firma son tres letras: TLK. Las iniciales de su apodo y de su apellido, con líneas modernas.

    Encaja con él. Joven, deportivo y con mucho margen todavía. Tiene 21 años, es de Villa Mercedes y es 30.º del ranking.

    El logo será su emblema a partir de ahora. Y podría acabar en una línea de producto con su sello.

    ## Lo que hay detrás

    Esto no va de diseño.

    Va de que el jugador deja de llevar solo la marca de otro. Empieza a tener la suya.

    En el tenis o en el fútbol lo vemos desde hace años. En el pádel está empezando.

    Juan Lebrón ya tiene el suyo: el lobo, por su apodo.

    Ahora se suman dos chavales de 21 y 22 años.

en:
  slug: augsburger-libaak-new-logo-siux
  titulo: "Augsburger and Libaak launch their own brand with Siux"
  entradilla: "Two Argentinians from Siux, two new logos in one week. Leo Augsburger now signs as \"Laugsburger\". Tino Libaak does it with three letters: TLK."
  seo_titulo: "Augsburger and Libaak unveil new logos with Siux"
  seo_descripcion: "Leo Augsburger now signs as \"Laugsburger\" and Tino Libaak unveils his TLK logo. Augsburger and Libaak: two Siux players with a new logo in one week."
  palabra_clave: "Augsburger Libaak logo"
  cuerpo: |
    One week. Two logos.

    And both come from the same house: Siux.

    ## Augsburger went first

    On 13 October, Leo Augsburger unveiled his new identity.

    He now signs as "Laugsburger". That's how it appears on his clothing and everything he puts out.

    The wink was already in his surname. Augs-burger. He and his brand turned it into a logo.

    The idea is for it to convey what you see from him on court: energy, passion and commitment.

    He's 22, from Posadas (Misiones), and sixth in the ranking. On Sunday he played the Milan final with Juan Lebrón.

    ## And now, Libaak

    These days it's been Tino Libaak's turn.

    His signature is three letters: TLK. The initials of his nickname and his surname, with modern lines.

    It suits him. Young, sporty and with plenty of room to grow. He's 21, from Villa Mercedes, and 30th in the ranking.

    The logo will be his emblem from now on. And it could end up on a product line with his stamp.

    ## What's behind it

    This isn't about design.

    It's about players no longer just wearing someone else's brand. They're starting to have their own.

    We've seen it in tennis and football for years. In padel, it's just beginning.

    Juan Lebrón already has his: the wolf, after his nickname.

    Now two kids aged 21 and 22 are joining him.

