es:
  slug: juanjo-gutierrez-coello-paquito-mundial-padel-2026-declaraciones
  titulo: "España, campeona del mundo, le da todo el mérito a Juanjo Gutiérrez"
  entradilla: "Coello, Lebrón y Paquito lo dijeron en la sala de prensa de Doha: las decisiones del seleccionador marcaron la final. Paquito, que se despide de la selección, empezó por darle las gracias."
  seo_titulo: "Juanjo Gutiérrez: España le da el mérito del Mundial"
  seo_descripcion: "Juanjo Gutiérrez, según los campeones del Mundial de pádel: Coello, Lebrón y Paquito le dan el mérito de la final. Trece parejas en seis eliminatorias."
  palabra_clave: "Juanjo Gutiérrez"
  cuerpo: |
    Arturo Coello cerró la final del Mundial. El tercer partido. El que decidía.

    Y en la sala de prensa, lo primero que hizo fue quitarse el mérito.

    «No quiero atribuirme méritos que no me corresponden», dijo. «Hoy, sin embargo, todo el mérito es suyo, de Juanjo Gutiérrez. Él vio algo que nosotros no veíamos y tuvo una sensación diferente».

    Y confesó algo más:

    «Sinceramente, yo no estaba del todo convencido con la decisión de jugar el tercer punto, mientras que él tuvo el valor de llevarla adelante».

    <figure><img src="/img/noticias/mundial-2026-final-coello-grito.jpg" alt="Arturo Coello celebra un punto con un grito en la final del Mundial de Qatar" width="1400" height="1750" loading="lazy"><figcaption>Arturo Coello, en la final del Mundial. Imagen: Federación Española de Pádel</figcaption></figure>

    ## La decisión de Juanjo

    La final llegó 1-1 al último partido. Lebrón y Goñi habían remontado a Di Nenno y Augsburger. Tapia y Chingotto habían ganado a Paquito y Sanz.

    En el tercero estaba Coello. Con Coki Nieto. 6-3, 6-2 a Libaak y Alfonso. [La final, entera](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/).

    Juanjo lo explicó después, ya fuera de la sala de prensa:

    «Me arriesgué, pero arriesgar forma parte del juego. Necesitaba a Arturo para el tercer partido porque sabe mantener la calma en los momentos decisivos».

    Y lo resumió así: «Tiene una especie de instinto asesino».

    ## Trece parejas en seis eliminatorias

    La final fue la última jugada de una semana entera moviendo piezas.

    España jugó 16 partidos en Doha. Con trece parejas distintas.

    Solo tres repitieron: Goñi y Yanguas, Lebrón y Paquito, y Paquito y Sanz.

    Coello jugó con cuatro compañeros: Paquito, Goñi, Javi Leal y Nieto. Lebrón, también con cuatro: Sanz, Paquito, Leal y Goñi.

    En la final, dos de las tres parejas jugaban juntas por primera vez en este Mundial. Lebrón y Goñi ganaron el primer partido. Coello y Nieto, el último.

    <figure><img src="/img/noticias/mundial-2026-espana-banquillo.jpg" alt="Juanjo Gutiérrez, seleccionador español, habla con uno de sus jugadores en el banquillo del Mundial de Qatar" width="1069" height="1600" loading="lazy"><figcaption>Juanjo Gutiérrez, en el banquillo de España. Imagen: Federación Española de Pádel</figcaption></figure>

    «Hay que tener el valor de tomar esas decisiones», dijo Juanjo. «Es necesario intentar ganar, incluso asumiendo ciertos riesgos».

    ## Lebrón, entre canciones

    Lebrón llegó a la sala de prensa bromeando y cantando. Luego se puso serio.

    Habló de su partido: «En el primer set tuvimos nuestras oportunidades, pero no supimos aprovecharlas».

    Y de los rivales: «Martín y Leo jugaron un partidazo y hay que darles la enhorabuena». Leo Augsburger es su compañero en el circuito. Ayer estaba al otro lado de la red.

    Y de Goñi: «Hay que felicitar al joven Aimar, que lo dio todo en la pista».

    Coello también habló de Lebrón: «Puede cantar y bromear, pero cuando entra en la pista, lo más probable es que gane».

    Goñi, en su primer Mundial, casi no encontraba las palabras: «Jugar con Juan hace que todo sea mucho más sencillo. De verdad que no sé qué más decir».

    ## Paquito: la última, con las gracias

    Paquito Navarro se despide de la selección. «Esta es mi última participación con España», dijo.

    Ya estaba en el Mundial de 2014, en Mallorca. Doce años después, se va campeón.

    Y empezó por ahí: «Antes que nada, quiero dar las gracias a Juanjo. Creo que tuvo un valor enorme».

    También salió en su defensa:

    «También tuvimos que hacer frente a todo lo que se leía en las redes sociales, con tantas opiniones de personas que parecían estar en contra de sus decisiones y sus ideas. Me gustaría que todos aquellos que ya lo daban por acabado tuvieran el valor de pedirle disculpas».

    <figure><img src="/img/noticias/mundial-2026-espana-suecia-remate.jpg" alt="Paquito Navarro salta para rematar en el debut de España ante Suecia en el Mundial de Qatar" width="1068" height="1600" loading="lazy"><figcaption>Paquito Navarro, en el debut ante Suecia. Imagen: Federación Española de Pádel</figcaption></figure>

    También se rio de sí mismo. Con Jon Sanz perdió el único partido de España en todo el Mundial: 6-1, 6-2 con Tapia y Chingotto.

    «Ser un veterano de la selección nacional no significa necesariamente jugar bien», dijo. «Probablemente hemos recibido la mayor lección de nuestras vidas». Y se echó a reír.

    ## «Todo lo que habíamos imaginado»

    La última palabra fue para Juanjo. Ya ganó el Mundial de 2021, también en Doha.

    «Tuvimos suerte porque todo lo que habíamos imaginado que podía suceder acabó sucediendo. Y aquí estamos, con la Copa en las manos y siendo campeones del mundo».

    Trece parejas. Un partido perdido. Un título.

    Coello no lo veía claro.

    Juanjo, sí.

en:
  slug: juanjo-gutierrez-coello-paquito-padel-world-cup-2026-reaction
  titulo: "Spain, world champions, give all the credit to Juanjo Gutiérrez"
  entradilla: "Coello, Lebrón and Paquito said it in the Doha press room: the head coach's decisions shaped the final. Paquito, who is saying goodbye to the national team, started by thanking him."
  seo_titulo: "Juanjo Gutiérrez: Spain give him credit for the World Cup"
  seo_descripcion: "Juanjo Gutiérrez, through the eyes of the Padel World Cup champions: Coello, Lebrón and Paquito give him credit for the final. Thirteen pairs in six ties."
  palabra_clave: "Juanjo Gutiérrez"
  cuerpo: |
    Arturo Coello closed out the World Cup final. The third match. The decider.

    And in the press room, the first thing he did was hand the credit to someone else.

    “I don't want to take credit that isn't mine,” he said. “Today, though, all the credit goes to him, to Juanjo Gutiérrez. He saw something we didn't see and had a different feeling.”

    And he admitted something else:

    “Honestly, I wasn't fully convinced by the decision to play the third point, while he had the courage to go through with it.”

    <figure><img src="/img/noticias/mundial-2026-final-coello-grito.jpg" alt="Arturo Coello roars after winning a point in the World Cup final in Qatar" width="1400" height="1750" loading="lazy"><figcaption>Arturo Coello, in the World Cup final. Image: Spanish Padel Federation</figcaption></figure>

    ## Juanjo's call

    The final reached the last match at 1-1. Lebrón and Goñi had come back against Di Nenno and Augsburger. Tapia and Chingotto had beaten Paquito and Sanz.

    In the third match was Coello. With Coki Nieto. 6-3, 6-2 over Libaak and Alfonso. [The full final](/en/news/padel-world-cup-2026-final-spain-champions-argentina/).

    Juanjo explained it later, outside the press room:

    “I took a risk, but taking risks is part of the game. I needed Arturo for the third match because he knows how to stay calm in the decisive moments.”

    And he summed it up: “He has a kind of killer instinct.”

    ## Thirteen pairs in six ties

    The final was the last move of a whole week of shuffling the pieces.

    Spain played 16 matches in Doha. With thirteen different pairs.

    Only three were repeated: Goñi and Yanguas, Lebrón and Paquito, and Paquito and Sanz.

    Coello played with four partners: Paquito, Goñi, Javi Leal and Nieto. Lebrón, also with four: Sanz, Paquito, Leal and Goñi.

    In the final, two of the three pairs were playing together for the first time at this World Cup. Lebrón and Goñi won the first match. Coello and Nieto, the last.

    <figure><img src="/img/noticias/mundial-2026-espana-banquillo.jpg" alt="Juanjo Gutiérrez, Spain's head coach, talks to one of his players on the bench at the World Cup in Qatar" width="1069" height="1600" loading="lazy"><figcaption>Juanjo Gutiérrez, on Spain's bench. Image: Spanish Padel Federation</figcaption></figure>

    “You have to have the courage to make those decisions,” said Juanjo. “You have to try to win, even if it means taking some risks.”

    ## Lebrón, between songs

    Lebrón arrived at the press room joking and singing. Then he got serious.

    He talked about his match: “In the first set we had our chances, but we didn't take them.”

    And about his opponents: “Martín and Leo played a great match and we have to congratulate them.” Leo Augsburger is his partner on tour. Yesterday he was on the other side of the net.

    And about Goñi: “We have to congratulate young Aimar, who gave everything on court.”

    Coello also talked about Lebrón: “He can sing and joke, but when he steps on court, he'll most likely win.”

    Goñi, at his first World Cup, could barely find the words: “Playing with Juan makes everything much simpler. Honestly, I don't know what else to say.”

    ## Paquito: the last one, with thanks

    Paquito Navarro is saying goodbye to the national team. “This is my last time with Spain,” he said.

    He was already at the 2014 World Cup, in Mallorca. Twelve years later, he leaves as a champion.

    And that is where he started: “First of all, I want to thank Juanjo. I think he showed enormous courage.”

    He also stood up for him:

    “We also had to deal with everything we read on social media, with so many opinions from people who seemed to be against his decisions and his ideas. I'd like everyone who had already written him off to have the courage to apologise to him.”

    <figure><img src="/img/noticias/mundial-2026-espana-suecia-remate.jpg" alt="Paquito Navarro jumps for a smash in Spain's opening tie against Sweden at the World Cup in Qatar" width="1068" height="1600" loading="lazy"><figcaption>Paquito Navarro, in the opening tie against Sweden. Image: Spanish Padel Federation</figcaption></figure>

    He also laughed at himself. With Jon Sanz, he lost Spain's only match of the whole World Cup: 6-1, 6-2 to Tapia and Chingotto.

    “Being a national team veteran doesn't necessarily mean playing well,” he said. “We probably got the biggest lesson of our lives.” And he burst out laughing.

    ## “Everything we had imagined”

    The last word went to Juanjo. He already won the 2021 World Cup, also in Doha.

    “We were lucky, because everything we had imagined could happen ended up happening. And here we are, with the Cup in our hands, world champions.”

    Thirteen pairs. One match lost. One title.

    Coello didn't see it clearly.

    Juanjo did.

