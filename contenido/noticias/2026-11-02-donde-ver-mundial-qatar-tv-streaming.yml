es:
  slug: donde-ver-mundial-padel-2026-tv-streaming
  titulo: "Dónde ver el Mundial de Qatar por televisión y en streaming"
  entradilla: "Movistar Plus+ en España y Andorra. ESPN en toda América. Red Bull TV, gratis, en casi todo el mundo. Y el YouTube de la FIP para lo que no llegue a la tele."
  seo_titulo: "Dónde ver el Mundial de pádel 2026: TV y streaming"
  seo_descripcion: "Dónde ver el Mundial de pádel 2026 de Qatar: Movistar Plus+ en España, ESPN en América, Red Bull TV y el YouTube de la FIP. Canales, país por país."
  palabra_clave: "dónde ver el Mundial de pádel 2026"
  cuerpo: |
    Hoy empieza el Mundial de Qatar.

    Y la primera pregunta no es quién lo gana. Es dónde se ve.

    Ahí va. País por país, según el reparto que ha publicado la Federación Internacional de Pádel.

    ## En España

    Movistar Plus+. También en Andorra.

    Hoy juega España. Ellos, a las 16:00, contra Suecia. Ellas abren el día: a las 12:00, contra Alemania.

    Ojo con la pista. Ninguna de las dos juega hoy en la central: ellos, en la Grand Stand 2; ellas, en la pista 5.

    Lo que no emita la tele de cada país se podrá seguir en el canal de YouTube de la FIP, @PADELFIP, según Padel Addict.

    ## En Argentina y el resto de América

    ESPN. De Sudamérica a Centroamérica y el Caribe.

    Argentina, que va a por su tercer Mundial seguido, debuta hoy contra Australia, a las 12:00 hora argentina. Ellas, a las 8:00, contra Chile.

    ## En el resto del mundo

    Red Bull TV lo da en todo el planeta, gratis. Menos en los países donde hay un acuerdo local en exclusiva.

    Donde no llegue Red Bull TV, el YouTube de la FIP.

    Y cada país, su canal:

    - **Italia, San Marino y Ciudad del Vaticano:** SuperTennis.
    - **Portugal:** Sport TV.
    - **Países Bajos:** KNLTB.
    - **Bulgaria:** bTV.
    - **Croacia:** SPTV.
    - **Grecia:** MagentaTV.
    - **Israel:** Charlton.
    - **beIN Sports:** Francia (con Mónaco, Suiza y los territorios de ultramar), Estados Unidos, Canadá, Turquía, Oriente Medio, el norte de África, Australia, Nueva Zelanda, Tailandia, Malasia, Filipinas, Indonesia y Singapur.

    ## Cuándo

    Del lunes 2 al sábado 7 de noviembre, en Doha.

    Fase de grupos hasta el miércoles. Cuartos, el jueves. Semifinales, el viernes. Y el sábado, las finales.

    Los [grupos](/actualidad/grupos-mundial-padel-2026-qatar/), los 16 de [España](/actualidad/convocatoria-espana-mundial-padel-2026/) y los de [Argentina](/actualidad/convocatoria-argentina-mundial-padel-2026/) ya los tienes.

    Ahora ya sabes dónde mirar.

en:
  slug: where-to-watch-padel-world-cup-2026-tv-streaming
  titulo: "Where to watch the World Cup in Qatar on TV and streaming"
  entradilla: "Movistar Plus+ in Spain and Andorra. ESPN across the Americas. Red Bull TV, free, almost everywhere else. And the FIP's YouTube channel for whatever TV doesn't show."
  seo_titulo: "Where to watch the 2026 Padel World Cup: TV and streaming"
  seo_descripcion: "Where to watch the 2026 Padel World Cup in Qatar: Movistar Plus+ in Spain, ESPN in the Americas, Red Bull TV and the FIP's YouTube channel. Country by country."
  palabra_clave: "where to watch the 2026 Padel World Cup"
  cuerpo: |
    The World Cup in Qatar starts today.

    And the first question isn't who wins it. It's where to watch it.

    Here it is. Country by country, according to the broadcast list published by the International Padel Federation.

    ## In Spain

    Movistar Plus+. Also in Andorra.

    Spain play today. The men, at 16:00 (CET), against Sweden. The women open the day: at 12:00, against Germany.

    Watch the court. Neither team plays on centre court today: the men are on Grand Stand 2; the women, on court 5.

    Whatever a country's TV doesn't show can be followed on the FIP's YouTube channel, @PADELFIP, according to Padel Addict.

    ## In Argentina and the rest of the Americas

    ESPN. From South America to Central America and the Caribbean.

    Argentina, going for a third World Cup in a row, start today against Australia, at 12:00 Argentina time. The women, at 8:00, against Chile.

    ## In the rest of the world

    Red Bull TV shows it all over the planet, for free. Except in countries with an exclusive local deal.

    Where Red Bull TV doesn't reach, the FIP's YouTube channel.

    And each country, its own channel:

    - **Italy, San Marino and Vatican City:** SuperTennis.
    - **Portugal:** Sport TV.
    - **Netherlands:** KNLTB.
    - **Bulgaria:** bTV.
    - **Croatia:** SPTV.
    - **Greece:** MagentaTV.
    - **Israel:** Charlton.
    - **beIN Sports:** France (with Monaco, Switzerland and the overseas territories), United States, Canada, Turkey, the Middle East, North Africa, Australia, New Zealand, Thailand, Malaysia, the Philippines, Indonesia and Singapore.

    ## When

    From Monday 2 to Saturday 7 November, in Doha.

    Group stage until Wednesday. Quarter-finals, Thursday. Semi-finals, Friday. And on Saturday, the finals.

    You already have the [groups](/en/news/padel-world-cup-2026-groups-qatar/), [Spain's 16](/en/news/spain-squad-padel-world-cup-2026/) and [Argentina's](/en/news/argentina-squad-padel-world-cup-2026/).

    Now you know where to look.

