es:
  slug: lebron-augsburger-abud-belluati-major-kuwait-libaak-alfonso
  titulo: "Lebrón y Augsburger ganan a Abud y Belluati y jugarán contra Libaak y Alfonso"
  entradilla: "Se acabó la racha de los que llegaron desde la previa. Coello y Tapia, en menos de una hora, y Yanguas y Nieto, en tres sets, también están en octavos. Hoy, Augsburger juega contra su compañero de selección."
  seo_titulo: "Lebrón y Augsburger ganan a Abud y Belluati en Kuwait"
  seo_descripcion: "Lebrón y Augsburger ganan a Abud y Belluati (6-4, 6-3) en el Major de Kuwait. Coello y Tapia y Yanguas y Nieto, también a octavos. Hoy, Libaak y Alfonso."
  palabra_clave: "Lebrón y Augsburger"
  cuerpo: |
    El lunes te conté [la remontada de Martín Abud y Juan Cruz Belluati](/actualidad/abud-belluati-remontada-major-kuwait-lebron-augsburger/).

    Venían de la previa. El domingo perdieron el primer set. Y le dieron la vuelta.

    El martes se encontraron con Juan Lebrón y Leo Augsburger, terceros cabezas de serie.

    6-4 y 6-3. Una hora y 17 minutos.

    ## Sin fisuras

    Abud y Belluati tuvieron su momento en el primer set: siete puntos seguidos.

    No les bastó.

    Lebrón y Augsburger ganaron el 58 % de los puntos. En el segundo set no perdieron ni un saque.

    No fueron los únicos que se despidieron. De las parejas que remontaron el domingo, tres cayeron el martes: Abud y Belluati, Adam Axelsson y Mario Ortega (ante Juan Tello y Maxi Arce: 6-4, 4-6, 6-3) y José Solano y Ramiro Pereyra.

    ## Hoy, una cuenta pendiente

    En octavos, Lebrón y Augsburger juegan contra Tino Libaak y Gonzalo Alfonso, duodécimos cabezas de serie.

    No es un cruce cualquiera.

    El 3 de septiembre, en los octavos del Madrid P1, Libaak y Alfonso les ganaron: 7-6 y 7-5.

    Y luego está lo de Augsburger y Libaak.

    En el último Mundial ganaron juntos el punto que le dio el título a Argentina. Hace una semana [estrenaron marca propia juntos](/actualidad/augsburger-libaak-nuevo-logo-siux/). La semana que viene, con Alfonso, estarán en el mismo equipo en [el Mundial de Doha](/actualidad/convocatoria-argentina-mundial-padel-2026/).

    Hoy, cada uno a un lado de la red. No antes de las 16:00, hora española.

    ## Coello y Tapia, en 53 minutos

    Los números 1 ganaron a Flavio Abbate y Franco Dal Bianco: 6-3 y 6-0.

    Menos de una hora.

    Vienen de [ganar en Milán](/actualidad/milano-p1-coello-tapia-sanchez-ustero-campeones/). Y en Kuwait no están Galán y Chingotto, [baja por la lesión de Galán](/actualidad/chingotto-galan-baja-major-kuwait-lesion/).

    Hoy juegan contra Enrique Goenaga y Guillermo Collado, que el martes ganaron a los cabezas de serie número 16, Javi Garrido y Juan Ignacio de Pascual (6-2, 7-6). No antes de las 18:00.

    ## Yanguas y Nieto, a la vuelta

    Coki Nieto se perdió Düsseldorf y Milán por molestias físicas.

    En su vuelta, él y Mike Yanguas, sextos cabezas de serie, ganaron a Solano y Pereyra: 6-3, 3-6 y 6-4. Dos horas y ocho minutos.

    En septiembre fueron finalistas en el Madrid P1. Hoy, Jairo Bautista y Lucas Bergamini, décimos cabezas de serie.

    ## En el cuadro femenino

    La sorpresa la dieron Julieta Bidahorria y Virginia Riera.

    Ganaron a Ale Salazar y Aranzazu Osoro, octavas cabezas de serie: 6-2, 2-6 y 6-1. Es su mejor resultado en un Major este año.

    No llegaban de la nada: en cinco semanas habían ganado tres torneos FIP, en Nairobi, Houten y Sevilla. Hoy, contra Victoria Iglesias y Lorena Rufo.

    ## Hoy, octavos

    Coello y Tapia. Yanguas y Nieto.

    Y Augsburger contra Libaak.

    La semana que viene, en Doha, volverán a estar en el mismo lado.

en:
  slug: lebron-augsburger-beat-abud-belluati-kuwait-major-libaak-alfonso
  titulo: "Lebrón and Augsburger beat Abud and Belluati and will face Libaak and Alfonso"
  entradilla: "The qualifiers' run is over. Coello and Tapia, in under an hour, and Yanguas and Nieto, in three sets, are also into the round of 16. Today, Augsburger faces his national team partner."
  seo_titulo: "Lebrón and Augsburger beat Abud and Belluati in Kuwait"
  seo_descripcion: "Lebrón and Augsburger beat Abud and Belluati (6-4, 6-3) at the Kuwait Major. Coello and Tapia and Yanguas and Nieto also go through. Next: Libaak and Alfonso."
  palabra_clave: "Lebrón and Augsburger"
  cuerpo: |
    On Monday I told you about [Martín Abud and Juan Cruz Belluati's comeback](/en/news/abud-belluati-comeback-kuwait-major-lebron-augsburger/).

    They came through qualifying. On Sunday they lost the first set. And turned it around.

    On Tuesday they ran into Juan Lebrón and Leo Augsburger, the third seeds.

    6-4, 6-3. One hour and 17 minutes.

    ## No cracks

    Abud and Belluati had their moment in the first set: seven points in a row.

    It wasn't enough.

    Lebrón and Augsburger won 58% of the points. In the second set they didn't drop serve once.

    They weren't the only ones to go. Of the pairs who came back from a set down on Sunday, three went out on Tuesday: Abud and Belluati, Adam Axelsson and Mario Ortega (against Juan Tello and Maxi Arce: 6-4, 4-6, 6-3) and José Solano and Ramiro Pereyra.

    ## Today, unfinished business

    In the round of 16, Lebrón and Augsburger face Tino Libaak and Gonzalo Alfonso, the 12th seeds.

    This is no ordinary match.

    On 3 September, in the round of 16 at the Madrid P1, Libaak and Alfonso beat them: 7-6, 7-5.

    And then there's Augsburger and Libaak.

    At the last World Cup they won, together, the point that gave Argentina the title. A week ago [they launched their own brand together](/en/news/augsburger-libaak-new-logo-siux/). Next week, along with Alfonso, they'll be on the same team at [the World Cup in Doha](/en/news/argentina-squad-padel-world-cup-2026/).

    Today, one on each side of the net. Not before 16:00 Spanish time.

    ## Coello and Tapia, in 53 minutes

    The world number ones beat Flavio Abbate and Franco Dal Bianco: 6-3, 6-0.

    Under an hour.

    They come in after [winning in Milan](/en/news/milano-p1-coello-tapia-sanchez-ustero-champions/). And Galán and Chingotto aren't in Kuwait, [out because of Galán's injury](/en/news/chingotto-galan-out-kuwait-major-injury/).

    Today they face Enrique Goenaga and Guillermo Collado, who on Tuesday beat the 16th seeds, Javi Garrido and Juan Ignacio de Pascual (6-2, 7-6). Not before 18:00.

    ## Yanguas and Nieto, back in action

    Coki Nieto missed Düsseldorf and Milan with physical discomfort.

    On his return, he and Mike Yanguas, the sixth seeds, beat Solano and Pereyra: 6-3, 3-6, 6-4. Two hours and eight minutes.

    In September they were runners-up at the Madrid P1. Today, Jairo Bautista and Lucas Bergamini, the 10th seeds.

    ## In the women's draw

    The upset came from Julieta Bidahorria and Virginia Riera.

    They beat Ale Salazar and Aranzazu Osoro, the eighth seeds: 6-2, 2-6, 6-1. It's their best result at a Major this year.

    It didn't come out of nowhere: in five weeks they had won three FIP tournaments, in Nairobi, Houten and Seville. Today, against Victoria Iglesias and Lorena Rufo.

    ## Today, the round of 16

    Coello and Tapia. Yanguas and Nieto.

    And Augsburger against Libaak.

    Next week, in Doha, they'll be on the same side again.

