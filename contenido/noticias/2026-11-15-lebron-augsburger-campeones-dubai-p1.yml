  slug: lebron-augsburger-campeones-dubai-p1-libaak-alfonso
  titulo: "Lebrón y Augsburger ganan el Dubái P1 a Libaak y Alfonso"
  entradilla: "A la tercera. La pareja que les había ganado las dos veces anteriores se cruzó con ellos en la final, y esta vez el título fue para Lebrón y Augsburger. En ellas, campeonas Martina Calvo y Claudia Fernández."
  seo_titulo: "Lebrón y Augsburger, campeones del Dubái P1 2026"
  seo_descripcion: "Lebrón y Augsburger ganan el Dubái P1 a Libaak y Alfonso por 7-6, 5-7 y 6-3. En el cuadro femenino, campeonas Martina Calvo y Claudia Fernández."
  palabra_clave: "Dubái P1"
  cuerpo: |
    A la tercera.

    Libaak y Alfonso les habían ganado dos veces este año. En Madrid y en Kuwait. Las dos, en octavos.

    Hoy se cruzaban en una final. Y esta vez ha sido para ellos.

    Juan Lebrón y Leo Augsburger (2) son campeones del Dubái P1. Han ganado 7-6, 5-7 y 6-3 a Tino Libaak y Gonzalo Alfonso (10). Casi dos horas y media de partido.

    ## Dos títulos, dos muros

    Cinco finales en 2026.

    Las cuatro primeras, contra Coello y Tapia. Ganaron una, la de Bruselas, en abril.

    [La quinta era la primera sin los números uno al otro lado](/actualidad/lebron-augsburger-final-dubai-p1-libaak-alfonso/). Y la han ganado.

    Dos títulos juntos. Uno, ante los números uno. Otro, ante la pareja que siempre les ganaba.

    ## Un break en el tercero

    El primer set se fue al tie-break. En Madrid lo perdieron así. Hoy lo ganaron.

    El segundo, 7-5 para Libaak y Alfonso.

    En el tercero, Lebrón y Augsburger no cedieron su saque. Les bastó un break.

    Al final, se llevaron el 52 % de los puntos. Así de igualada fue.

    Lebrón reconoció después que en el segundo set desconectaron un poco. Y contó qué les sostiene: «Pase lo que pase tenemos que estar juntos en todo momento».

    <figure><img src="/img/noticias/dubai-p1-2026-lebron-final.jpg" alt="Juan Lebrón aprieta el puño en la pista del Dubái P1" width="1402" height="1750" loading="lazy"><figcaption>Juan Lebrón, en Dubái. Imagen: Premier Padel</figcaption></figure>

    ## Ocho días después del Mundial

    El sábado 7, en Doha, [Lebrón le ganó a Augsburger la final del Mundial](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/). Cada uno con su camiseta.

    Augsburger venía de perder aquella final. Hoy dio las gracias a su equipo por el apoyo de estos días y pidió algo sencillo: disfrutar y desconectar.

    Ocho días después, levantan juntos un título.

    <figure><img src="/img/noticias/dubai-p1-2026-augsburger-final.jpg" alt="Leo Augsburger grita junto a la red en el Dubái P1" width="1400" height="1750" loading="lazy"><figcaption>Leo Augsburger, en Dubái. Imagen: Premier Padel</figcaption></figure>

    ## Libaak y Alfonso, a un paso

    Libaak y Alfonso también perdieron aquella final del Mundial. Hoy se quedan sin su primer título juntos.

    Pero se van de Dubái con la primera final de Libaak en Premier Padel, con 21 años. Y con una racha que no para desde octubre: cuartos en Róterdam, Düsseldorf y Milán, semifinales en Kuwait y final en Dubái.

    ## Ellas: Claudia Fernández repite en Dubái

    Martina Calvo y Claudia Fernández (4) son campeonas del Dubái P1. Han ganado 7-5 y 6-1 a Paula Josemaría y Bea González (2).

    Se habían cruzado seis veces este año, siempre en semifinales. Tres para cada pareja. La primera final ha sido para Martina y Claudia.

    Es su tercer título juntas en 2026, después de Londres y Düsseldorf. Y llega ocho días después de [ganar el Mundial con España](/actualidad/mundial-padel-2026-espana-campeona-femenina-argentina/).

    <figure><img src="/img/noticias/dubai-p1-2026-calvo-fernandez-campeonas.jpg" alt="Martina Calvo y Claudia Fernández celebran en la pista del Dubái P1" width="1400" height="1750" loading="lazy"><figcaption>Martina Calvo y Claudia Fernández, campeonas en Dubái. Imagen: Premier Padel</figcaption></figure>

    Claudia Fernández ya ganó Dubái el año pasado. Con Bea González.

    Hace nueve días, en la semifinal del Mundial, volvieron a jugar juntas con España. Hoy, cada una a un lado de la red.

    Según Premier Padel, a Gemma Triay y Delfi Brea les basta llegar a semifinales en México para asegurar el número uno.

    ## Lo que viene

    Queda el Major de México, en Acapulco, del 23 al 29 de noviembre. Allí se reparten las últimas plazas de las Finals de Barcelona, del 10 al 13 de diciembre.

    El Dubái P1 va por su tercera edición. Las dos primeras las ganaron Coello y Tapia.

    Desde el martes se sabía que este año habría campeones nuevos.

    Ya los tiene. Y celebran juntos.

en:
  slug: lebron-augsburger-win-dubai-p1-libaak-alfonso
  titulo: "Lebrón and Augsburger win the Dubai P1 against Libaak and Alfonso"
  entradilla: "Third time lucky. The pair that had beaten them both previous times met them in the final, and this time the title went to Lebrón and Augsburger. In the women's draw, Martina Calvo and Claudia Fernández are the champions."
  seo_titulo: "Lebrón and Augsburger win the Dubai P1 2026"
  seo_descripcion: "Lebrón and Augsburger win the Dubai P1, beating Libaak and Alfonso 7-6, 5-7, 6-3. In the women's draw, Martina Calvo and Claudia Fernández are champions."
  palabra_clave: "Dubai P1"
  cuerpo: |
    Third time lucky.

    Libaak and Alfonso had beaten them twice this year. In Madrid and in Kuwait. Both times in the round of 16.

    Today they met in a final. And this time it went their way.

    Juan Lebrón and Leo Augsburger (2) are the Dubai P1 champions. They beat Tino Libaak and Gonzalo Alfonso (10) 7-6, 5-7, 6-3. Almost two and a half hours of padel.

    ## Two titles, two walls

    Five finals in 2026.

    The first four, against Coello and Tapia. They won one, in Brussels, in April.

    [The fifth was the first without the world number ones on the other side](/en/news/lebron-augsburger-dubai-p1-final-libaak-alfonso/). And they won it.

    Two titles together. One, against the number ones. The other, against the pair that always beat them.

    ## One break in the third

    The first set went to a tie-break. In Madrid they lost it that way. Today they won it.

    The second, 7-5 to Libaak and Alfonso.

    In the third, Lebrón and Augsburger didn't drop serve. One break was enough.

    In the end, they won 52% of the points. That's how close it was.

    Lebrón admitted afterwards that they switched off a little in the second set. And he explained what holds them together: "Whatever happens, we have to stay together at all times."

    <figure><img src="/img/noticias/dubai-p1-2026-lebron-final.jpg" alt="Juan Lebrón clenches his fist on court at the Dubai P1" width="1402" height="1750" loading="lazy"><figcaption>Juan Lebrón, in Dubai. Photo: Premier Padel</figcaption></figure>

    ## Eight days after the World Cup

    On Saturday 7, in Doha, [Lebrón beat Augsburger in the World Cup final](/en/news/padel-world-cup-2026-final-spain-champions-argentina/). Each in his own shirt.

    Augsburger was coming off that defeat. Today he thanked his team for their support these past days and asked for something simple: to enjoy it and switch off.

    Eight days later, they lift a title together.

    <figure><img src="/img/noticias/dubai-p1-2026-augsburger-final.jpg" alt="Leo Augsburger shouts near the net at the Dubai P1" width="1400" height="1750" loading="lazy"><figcaption>Leo Augsburger, in Dubai. Photo: Premier Padel</figcaption></figure>

    ## Libaak and Alfonso, one step away

    Libaak and Alfonso also lost that World Cup final. Today they miss out on their first title together.

    But they leave Dubai with Libaak's first Premier Padel final, at 21. And with a run that hasn't stopped since October: quarter-finals in Rotterdam, Düsseldorf and Milan, semi-finals in Kuwait and a final in Dubai.

    ## Women: Claudia Fernández wins Dubai again

    Martina Calvo and Claudia Fernández (4) are the Dubai P1 champions. They beat Paula Josemaría and Bea González (2) 7-5, 6-1.

    They had met six times this year, always in the semi-finals. Three wins each. The first final went to Martina and Claudia.

    It's their third title together in 2026, after London and Düsseldorf. And it comes eight days after [winning the World Cup with Spain](/en/news/padel-world-cup-2026-spain-women-champions-argentina/).

    <figure><img src="/img/noticias/dubai-p1-2026-calvo-fernandez-campeonas.jpg" alt="Martina Calvo and Claudia Fernández celebrate on court at the Dubai P1" width="1400" height="1750" loading="lazy"><figcaption>Martina Calvo and Claudia Fernández, champions in Dubai. Photo: Premier Padel</figcaption></figure>

    Claudia Fernández already won Dubai last year. With Bea González.

    Nine days ago, in the World Cup semi-final, they played together again for Spain. Today, each on one side of the net.

    According to Premier Padel, Gemma Triay and Delfi Brea only need to reach the semi-finals in Mexico to secure the number one spot.

    ## What's next

    The Mexico Major is left, in Acapulco, from 23 to 29 November. That's where the last places for the Barcelona Finals, from 10 to 13 December, will be decided.

    The Dubai P1 is in its third edition. Coello and Tapia won the first two.

    Since Tuesday we knew this year would bring new champions.

    Now it has them. And they're celebrating together.

