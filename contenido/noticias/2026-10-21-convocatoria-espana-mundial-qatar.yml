es:
  slug: convocatoria-espana-mundial-padel-2026
  titulo: "Estos son los 16 de España para el Mundial de Qatar"
  entradilla: "Ocho jugadores y ocho jugadoras. Del 2 al 7 de noviembre, en Doha. Ellos quieren recuperar un título que no ganan desde 2021. Ellas van a por el séptimo seguido."
  seo_titulo: "Convocatoria de España para el Mundial de pádel 2026"
  seo_descripcion: "Convocatoria de España para el Mundial de pádel 2026 en Doha: Coello, Galán y Lebrón lideran a los chicos; Triay, Bea y Ari, a las chicas."
  palabra_clave: "Mundial de pádel 2026"
  cuerpo: |
    Doce días.

    Es lo que falta para el Mundial de Qatar. Del 2 al 7 de noviembre, en el Khalifa International Tennis & Squash Complex de Doha.

    Dieciséis selecciones en el cuadro masculino. Dieciséis en el femenino.

    España ya tiene a los suyos. La Federación Española de Pádel presentó las listas el 24 de septiembre en Madrid. Ocho y ocho.

    ## Ellos: a recuperar lo perdido

    Los elige Juanjo Gutiérrez. Este es el equipo, con su puesto en el ranking FIP de esta semana:

    | Jugador | Puesto |
    |---|---|
    | Arturo Coello | 1 |
    | Alejandro Galán | 3 |
    | Juan Lebrón | 5 |
    | Paquito Navarro | 8 |
    | Jon Sanz | 9 |
    | Mike Yanguas | 10 |
    | Coki Nieto | 13 |
    | Aimar Goñi | 32 |

    El número 1 del mundo. El 3. El 5. Seis jugadores dentro del top 10.

    La novedad es Aimar Goñi. De Pamplona, 21 años recién cumplidos y 1,90 de altura. Juega en el revés y es el 32 del ranking.

    La última plaza ha sido para él, por delante de nombres como Momo González o Javi Leal.

    Y hay una cuenta pendiente. España no gana el Mundial masculino desde 2021. Argentina se llevó los dos últimos. El de 2024 se decidió en la final, por 2-1.

    Ahora vuelven a por él.

    <figure><img src="/img/noticias/mundial-2026-convocatoria-espana-femenina.jpg" alt="Las ocho jugadoras convocadas por España para el Mundial de Qatar 2026" width="1320" height="1611" loading="lazy"><figcaption>Imagen: Federación Española de Pádel</figcaption></figure>

    ## Ellas: a por el séptimo

    Carolina Navarro dirige su primer Mundial como seleccionadora. Su lista:

    | Jugadora | Puesto |
    |---|---|
    | Gemma Triay | 1 |
    | Bea González | 3 |
    | Ari Sánchez | 4 |
    | Paula Josemaría | 5 |
    | Claudia Fernández | 6 |
    | Andrea Ustero | 7 |
    | Martina Calvo | 8 |
    | Marta Ortega | 10 |

    Las ocho son, a día de hoy, las ocho españolas mejor clasificadas. Y Gemma Triay es la número 1 del mundo.

    La novedad es Marta Ortega. Entra ella y se queda fuera Ale Salazar. Según la seleccionadora, han pesado el momento de forma y la pista de Doha, que espera rápida.

    Aquí no hay cuenta pendiente. Hay una racha.

    España ha ganado los seis últimos Mundiales femeninos, desde 2014. En Qatar va a por el séptimo seguido.

    ## Doce días

    Hay 1,2 millones de euros en premios, repartidos a partes iguales entre hombres y mujeres.

    Pero en un Mundial se juega por otra cosa.

    Ellos, por recuperar. Ellas, por seguir.

en:
  slug: spain-squad-padel-world-cup-2026
  titulo: "These are Spain's 16 for the World Cup in Qatar"
  entradilla: "Eight men and eight women. From 2 to 7 November, in Doha. The men want back a title they haven't won since 2021. The women are going for a seventh in a row."
  seo_titulo: "Spain's squad for the 2026 Padel World Cup"
  seo_descripcion: "Spain's squad for the 2026 Padel World Cup in Doha: Coello, Galán and Lebrón lead the men's team; Triay, Bea and Ari lead the women's team."
  palabra_clave: "2026 Padel World Cup"
  cuerpo: |
    Twelve days.

    That's how long until the World Cup in Qatar. From 2 to 7 November, at the Khalifa International Tennis & Squash Complex in Doha.

    Sixteen teams in the men's draw. Sixteen in the women's.

    Spain already has its players. The Spanish Padel Federation unveiled the squads on 24 September in Madrid. Eight and eight.

    ## The men: winning back what was lost

    Juanjo Gutiérrez picks them. This is the team, with their position in this week's FIP ranking:

    | Player | Rank |
    |---|---|
    | Arturo Coello | 1 |
    | Alejandro Galán | 3 |
    | Juan Lebrón | 5 |
    | Paquito Navarro | 8 |
    | Jon Sanz | 9 |
    | Mike Yanguas | 10 |
    | Coki Nieto | 13 |
    | Aimar Goñi | 32 |

    The world number 1. Number 3. Number 5. Six players inside the top 10.

    The new name is Aimar Goñi. From Pamplona, just turned 21 and 1.90 m tall. He plays on the backhand side and is 32nd in the ranking.

    The last spot went to him, ahead of names like Momo González or Javi Leal.

    And there's unfinished business. Spain haven't won the men's World Cup since 2021. Argentina took the last two. The 2024 one was decided in the final, 2-1.

    Now they're going back for it.

    <figure><img src="/img/noticias/mundial-2026-convocatoria-espana-femenina.jpg" alt="The eight women selected by Spain for the 2026 World Cup in Qatar" width="1320" height="1611" loading="lazy"><figcaption>Image: Spanish Padel Federation</figcaption></figure>

    ## The women: going for a seventh

    Carolina Navarro leads her first World Cup as head coach. Her list:

    | Player | Rank |
    |---|---|
    | Gemma Triay | 1 |
    | Bea González | 3 |
    | Ari Sánchez | 4 |
    | Paula Josemaría | 5 |
    | Claudia Fernández | 6 |
    | Andrea Ustero | 7 |
    | Martina Calvo | 8 |
    | Marta Ortega | 10 |

    All eight are, as of today, the eight highest-ranked Spanish women. And Gemma Triay is world number 1.

    The new name is Marta Ortega. She comes in and Ale Salazar misses out. According to the coach, recent form and the Doha court, which she expects to be fast, were key.

    There's no unfinished business here. There's a streak.

    Spain have won the last six women's World Cups, since 2014. In Qatar they're going for a seventh in a row.

    ## Twelve days

    There's €1.2 million in prize money, split equally between men and women.

    But at a World Cup you play for something else.

    The men, to win it back. The women, to keep it.

