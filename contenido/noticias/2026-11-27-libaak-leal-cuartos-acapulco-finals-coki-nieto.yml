es:
  slug: libaak-leal-cuartos-acapulco-finals-barcelona-coki-nieto
  titulo: "Libaak y Leal se juegan las Finals de Barcelona en los cuartos de Acapulco"
  entradilla: "Los dos ganaron sus octavos en el Major de México y esta noche se cruzan, con una plaza para Barcelona en juego. Coki Nieto, campeón de las Finals en 2024, se queda fuera por tres puntos."
  seo_titulo: "Libaak y Leal se juegan las Finals en Acapulco"
  seo_descripcion: "Libaak y Leal se cruzan en cuartos del Major de México con una plaza para las Finals de Barcelona en juego. Coki Nieto se queda fuera por tres puntos."
  palabra_clave: "Finals de Barcelona"
  cuerpo: |
    Tino Libaak y Javi Leal ganaron anoche en Acapulco. Los dos.

    Y ahora se juegan lo mismo. En el mismo partido.

    Esta noche, en cuartos del Major de México, Libaak y Gonza Alfonso se cruzan con Leal y Fran Guerrero. En España, ya de madrugada.

    Encima de la pista hay una plaza para las Finals de Barcelona.

    ## Dos puntos

    Las Finals las juegan los 16 mejores jugadores de la Race.

    Alfonso está prácticamente dentro. Guerrero ya estaba clasificado. Los que esperan son sus compañeros.

    En la Race del lunes, Leal tenía 3.237 puntos. Libaak, 3.235.

    Dos puntos.

    Los dos han llegado a cuartos, así que siguen igual de cerca. Mañana, solo uno seguirá en el cuadro.

    ## Cómo llegan

    Libaak y Alfonso ganaron a Franco Stupaczuk y Jon Sanz, terceros cabezas de serie: 7-6, 4-6 y 6-4. Más de dos horas.

    Libaak tiene 21 años. Desde finales de septiembre, con Alfonso, no ha bajado de cuartos: Róterdam, Düsseldorf, Milán, Kuwait, Dubái, el FIP Platinum de Aguascalientes y ahora Acapulco. Siete torneos seguidos. En Dubái, hace dos semanas, [jugaron la final](/actualidad/lebron-augsburger-campeones-dubai-p1-libaak-alfonso/).

    Leal y Guerrero ganaron a Edu Alonso y Aimar Goñi: 7-6, 6-7 y 6-2. Más de dos horas y media. El partido más largo del día.

    Fue una revancha. Hace un mes, en octavos del Major de Kuwait, Alonso y Goñi les ganaron.

    Leal tiene 23 años. Hace tres semanas fue [campeón del mundo con España](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/) en Qatar.

    <figure><img src="/img/noticias/acapulco-2026-javi-leal-octavos.jpg" alt="Javi Leal grita y aprieta los puños en la pista de Acapulco" width="819" height="1024" loading="lazy"><figcaption>Javi Leal, en Acapulco. Imagen: Premier Padel</figcaption></figure>

    ## Se conocen de memoria

    Esta noche será la cuarta vez que se cruzan en dos meses:

    - Octavos de Róterdam (1 de octubre): Libaak y Alfonso, 7-5, 3-6 y 6-4.
    - Dieciseisavos de Düsseldorf (7 de octubre): Libaak y Alfonso, 3-6, 7-6 y 7-5.
    - Cuartos del FIP Platinum de Aguascalientes (19 de noviembre): Leal y Guerrero, 6-4 y 6-4.

    Dos a uno para Libaak y Alfonso. Pero la última, hace ocho días y también en México, fue para Leal y Guerrero.

    ## Coki se queda fuera

    El que no estará en Barcelona es Coki Nieto.

    Antes de los octavos, estaba a tres puntos de la última plaza. Necesitaba ganar.

    Anoche, con Mike Yanguas, cayó ante Íñigo Jofre y Juanlu Esbrí: 6-3, 3-6 y 2-6. Empezaron mejor. No les alcanzó.

    Según PadelSpain, se queda fuera por tres puntos.

    Coki ha jugado las dos Finals que se han celebrado. En 2024 las ganó con Jon Sanz, en la final ante Coello y Tapia, que llevaban 47 victorias seguidas. En 2025 las jugó con Yanguas.

    Y hace tres semanas, en la final del Mundial, ganó con Coello su partido. Enfrente estaban Libaak y Alfonso.

    Yanguas sí estará en Barcelona. Coki, esta vez, no.

    <figure><img src="/img/noticias/coki-nieto-finals-2026.jpg" alt="Coki Nieto camina por la pista con la pala en la mano" width="819" height="1024" loading="lazy"><figcaption>Coki Nieto. Imagen: Premier Padel</figcaption></figure>

    ## El resto de la noche

    - Coello y Tapia (1) ganaron a Alex Ruiz y Javi García: 6-1, 6-7 y 6-0. En cuartos, Ramiro Valenzuela y Francisco Gil, que juegan los primeros de su vida en un Major tras remontar a Marc Sintes y Juan Zamora (3-6, 7-6 y 6-1).
    - Lebrón y Augsburger (2) ganaron a Sanyo Gutiérrez y Maxi Sánchez: 7-6 y 6-4. Ahora, Jofre y Esbrí.
    - Di Nenno y Paquito Navarro (4) ganaron a José Jiménez y Alex Chozas: 6-3 y 6-4. Ahora, Jairo Bautista y Lucas Bergamini, que ganaron a Momo González y Lucas Campagnolo (7-5 y 6-1).

    Ellas: Gemma Triay y Delfi Brea (1) remontaron a Jimena Velasco y Raquel Eugenio (3-6, 6-3 y 6-3). Bea Caldera y Carmen Goenaga ganaron a Alejandra Salazar y Aranzazu Osoro (6-3 y 6-4). Y Marina Guinart y Alejandra Alonso, tras su 6-1 y 6-3 a Jessica Castelló y Nuria Rodríguez, ya tienen plaza en Barcelona, según Premier Padel.

    ## Esta noche

    Libaak, 21 años. Leal, 23.

    Dos puntos en la Race.

    Un partido.

    Y Barcelona, al otro lado de la red.

en:
  slug: libaak-leal-acapulco-quarter-final-barcelona-finals-coki-nieto
  titulo: "Libaak and Leal play for the Barcelona Finals in the Acapulco quarter-finals"
  entradilla: "Both won their round of 16 matches at the Mexico Major and tonight they meet, with a place in Barcelona at stake. Coki Nieto, 2024 Finals champion, misses out by three points."
  seo_titulo: "Libaak and Leal play for a Finals spot in Acapulco"
  seo_descripcion: "Libaak and Leal meet in the Mexico Major quarter-finals with a place at the Barcelona Finals at stake. Coki Nieto misses out by three points."
  palabra_clave: "Premier Padel Finals"
  cuerpo: |
    Tino Libaak and Javi Leal both won last night in Acapulco.

    And now they are playing for the same thing. In the same match.

    Tonight, in the quarter-finals of the Mexico Major, Libaak and Gonza Alfonso face Leal and Fran Guerrero. In Spain, it will already be the early hours.

    On that court there is a place at the Barcelona Finals.

    ## Two points

    The Finals are played by the top 16 players in the Race.

    Alfonso is practically in. Guerrero had already qualified. The ones waiting are their partners.

    In Monday's Race, Leal had 3,237 points. Libaak, 3,235.

    Two points.

    Both have reached the quarter-finals, so they are still just as close. Tomorrow, only one of them will still be in the draw.

    ## How they got here

    Libaak and Alfonso beat Franco Stupaczuk and Jon Sanz, the third seeds: 7-6, 4-6, 6-4. More than two hours.

    Libaak is 21. Since late September, with Alfonso, he hasn't gone out before the quarter-finals: Rotterdam, Düsseldorf, Milan, Kuwait, Dubai, the FIP Platinum in Aguascalientes and now Acapulco. Seven tournaments in a row. In Dubai, two weeks ago, [they played the final](/en/news/lebron-augsburger-win-dubai-p1-libaak-alfonso/).

    Leal and Guerrero beat Edu Alonso and Aimar Goñi: 7-6, 6-7, 6-2. More than two and a half hours. The longest match of the day.

    It was a revenge. A month ago, in the round of 16 at the Kuwait Major, Alonso and Goñi beat them.

    Leal is 23. Three weeks ago he became [world champion with Spain](/en/news/padel-world-cup-2026-final-spain-champions-argentina/) in Qatar.

    <figure><img src="/img/noticias/acapulco-2026-javi-leal-octavos.jpg" alt="Javi Leal shouts and clenches his fists on court in Acapulco" width="819" height="1024" loading="lazy"><figcaption>Javi Leal, in Acapulco. Photo: Premier Padel</figcaption></figure>

    ## They know each other by heart

    Tonight will be the fourth time they meet in two months:

    - Round of 16 in Rotterdam (1 October): Libaak and Alfonso, 7-5, 3-6, 6-4.
    - Round of 32 in Düsseldorf (7 October): Libaak and Alfonso, 3-6, 7-6, 7-5.
    - Quarter-finals of the FIP Platinum in Aguascalientes (19 November): Leal and Guerrero, 6-4, 6-4.

    Two to one for Libaak and Alfonso. But the last one, eight days ago and also in Mexico, went to Leal and Guerrero.

    ## Coki misses out

    The one who won't be in Barcelona is Coki Nieto.

    Before the round of 16, he was three points away from the last place. He needed to win.

    Last night, with Mike Yanguas, he lost to Íñigo Jofre and Juanlu Esbrí: 6-3, 3-6, 2-6. They started better. It wasn't enough.

    According to PadelSpain, he misses out by three points.

    Coki has played both Finals held so far. In 2024 he won them with Jon Sanz, beating Coello and Tapia in the final, who had won 47 matches in a row. In 2025 he played them with Yanguas.

    And three weeks ago, in the World Cup final, he won his match with Coello. On the other side of the net were Libaak and Alfonso.

    Yanguas will be in Barcelona. Coki, this time, won't.

    <figure><img src="/img/noticias/coki-nieto-finals-2026.jpg" alt="Coki Nieto walks on court holding his racket" width="819" height="1024" loading="lazy"><figcaption>Coki Nieto. Photo: Premier Padel</figcaption></figure>

    ## The rest of the night

    - Coello and Tapia (1) beat Alex Ruiz and Javi García: 6-1, 6-7, 6-0. In the quarter-finals, Ramiro Valenzuela and Francisco Gil, who play their first ever Major quarter-final after coming back against Marc Sintes and Juan Zamora (3-6, 7-6, 6-1).
    - Lebrón and Augsburger (2) beat Sanyo Gutiérrez and Maxi Sánchez: 7-6, 6-4. Next, Jofre and Esbrí.
    - Di Nenno and Paquito Navarro (4) beat José Jiménez and Alex Chozas: 6-3, 6-4. Next, Jairo Bautista and Lucas Bergamini, who beat Momo González and Lucas Campagnolo (7-5, 6-1).

    Women: Gemma Triay and Delfi Brea (1) came back against Jimena Velasco and Raquel Eugenio (3-6, 6-3, 6-3). Bea Caldera and Carmen Goenaga beat Alejandra Salazar and Aranzazu Osoro (6-3, 6-4). And Marina Guinart and Alejandra Alonso, after their 6-1, 6-3 win over Jessica Castelló and Nuria Rodríguez, have secured their place in Barcelona, according to Premier Padel.

    ## Tonight

    Libaak, 21. Leal, 23.

    Two points in the Race.

    One match.

    And Barcelona, on the other side of the net.

