es:
  slug: ale-salazar-despedida-finals-barcelona-libaak
  titulo: "Ale Salazar se despedirá del pádel profesional en las Finals de Barcelona"
  entradilla: "La victoria de Gemma Triay y Delfi Brea en Acapulco le da la plaza. Será el último torneo de su carrera. Tino Libaak, que ganó a Javi Leal, también estará."
  seo_titulo: "Ale Salazar se despedirá en las Finals de Barcelona"
  seo_descripcion: "Ale Salazar jugará las Finals de Barcelona, el último torneo de su carrera, gracias a Gemma Triay y Delfi Brea. Libaak también se clasifica."
  palabra_clave: "Ale Salazar"
  cuerpo: |
    Ale Salazar ya sabe dónde se despide.

    En Barcelona.

    Anoche, en Acapulco, se confirmó: jugará las Finals del Palau Sant Jordi, del 10 al 13 de diciembre. Será el último torneo de su carrera.

    Y no lo decidió ella. Lo decidió Gemma Triay.

    ## Lo esperó desde fuera

    El jueves, Salazar perdió en octavos del Major de México. Con Aranza Osoro, ante Bea Caldera y Carmen Goenaga: 6-3 y 6-4.

    Desde ahí, ya no dependía de ella.

    Si Caldera y Goenaga ganaban anoche en cuartos, entraban en las Finals. Y Salazar se quedaba fuera.

    Enfrente tenían a Gemma Triay y Delfi Brea, primeras cabezas de serie.

    Ganaron Gemma y Delfi: 6-2, 4-6 y 7-5. Dos horas y 38 minutos.

    ## Gemma, otra vez

    Gemma Triay fue su compañera entre 2021 y 2023. Juntas ganaron el Master Final de 2022. En Barcelona.

    Hace un mes, Gemma se convirtió en [la jugadora con más títulos de la historia](/actualidad/gemma-triay-59-titulos-record-historia/). Lleva 59. Salazar, 58.

    Anoche, Gemma le abrió la puerta de su último torneo.

    ## Una carrera que acaba en Barcelona

    Madrileña. 40 años. Cumple 41 el 31 de diciembre.

    Siete veces campeona del mundo con España. Solo Gemma tiene más títulos que ella.

    En julio de 2025 anunció que 2026 sería su última temporada. En septiembre, Madrid, su ciudad, la despidió en el último torneo que jugó allí.

    Faltaba Barcelona.

    Ha estado en las dos Finals que se han jugado. En 2024, con Jessica Castelló, llegó a semifinales. En 2025, con Martina Calvo, a cuartos.

    Esta será la tercera. Y la última.

    Con ella entra Verónica Virseda. Con las dos, ya se conocen las 16 chicas que jugarán en Barcelona. Aranza Osoro, su compañera en Acapulco, se queda a las puertas.

    ## También Libaak

    La otra plaza de anoche se decidió en la pista.

    Tino Libaak y Javi Leal llegaban a cuartos separados por dos puntos en la Race. Un partido. Una plaza.

    Se la llevó Libaak. Con Gonza Alfonso, ganó a Leal y Fran Guerrero: 7-6 y 7-5, con un 7-1 en el tie-break.

    Libaak tiene 21 años. Serán sus primeras Finals. Alfonso, que iba por delante en la Race, también estará.

    A Leal, [campeón del mundo con España](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/) hace tres semanas, se le escapa Barcelona por un partido. Hace un año, en este mismo torneo, fue él quien se quedó con el último billete.

    <figure><img src="/img/noticias/libaak-finals-2026-celebracion.jpg" alt="Tino Libaak sonríe con los brazos abiertos y la pala en la mano" width="1700" height="1358" loading="lazy"><figcaption>Tino Libaak. Imagen: Premier Padel</figcaption></figure>

    En los chicos aún queda una puerta abierta. Según las cuentas de AnalistasPadel, Jairo Bautista y Lucas Bergamini se meterían si llegan a la final. Esta noche juegan contra Coello y Tapia. Juan Tello y Maxi Arce estarán pendientes.

    ## Esta noche, semifinales

    En hora española (aproximada):

    - 23:00 · Ari Sánchez y Andrea Ustero contra Paula Josemaría y Bea González.
    - 01:00 · Libaak y Alfonso contra Íñigo Jofre y Juanlu Esbrí.
    - 02:30 · Gemma Triay y Delfi Brea contra Claudia Fernández y Martina Calvo.
    - 04:30 · Coello y Tapia contra Bautista y Bergamini.

    ## Su última pista

    Libaak, 21 años, jugará sus primeras Finals.

    Ale Salazar, 40, las últimas.

    Del 10 al 13 de diciembre. En el Palau Sant Jordi.

    Ahí se despide una de las grandes.

en:
  slug: ale-salazar-farewell-barcelona-finals-libaak
  titulo: "Ale Salazar will say goodbye to professional padel at the Barcelona Finals"
  entradilla: "Gemma Triay and Delfi Brea's win in Acapulco gives her the place. It will be the last tournament of her career. Tino Libaak, who beat Javi Leal, will be there too."
  seo_titulo: "Ale Salazar will say goodbye at the Barcelona Finals"
  seo_descripcion: "Ale Salazar will play the Barcelona Finals, the last tournament of her career, thanks to Gemma Triay and Delfi Brea. Libaak also qualifies."
  palabra_clave: "Ale Salazar"
  cuerpo: |
    Ale Salazar now knows where she will say goodbye.

    In Barcelona.

    Last night, in Acapulco, it was confirmed: she will play the Finals at the Palau Sant Jordi, from 10 to 13 December. It will be the last tournament of her career.

    And it wasn't up to her. It was up to Gemma Triay.

    ## Waiting from the outside

    On Thursday, Salazar lost in the round of 16 of the Mexico Major. With Aranza Osoro, to Bea Caldera and Carmen Goenaga: 6-3, 6-4.

    From then on, it was out of her hands.

    If Caldera and Goenaga won their quarter-final last night, they were into the Finals. And Salazar was out.

    Across the net were Gemma Triay and Delfi Brea, the top seeds.

    Gemma and Delfi won: 6-2, 4-6, 7-5. Two hours and 38 minutes.

    ## Gemma, again

    Gemma Triay was her partner from 2021 to 2023. Together they won the 2022 Master Final. In Barcelona.

    A month ago, Gemma became [the player with the most titles in history](/en/news/gemma-triay-59-titles-most-titles-padel-history/). She has 59. Salazar, 58.

    Last night, Gemma opened the door to her last tournament.

    ## A career that ends in Barcelona

    Born in Madrid. 40 years old. She turns 41 on 31 December.

    Seven-time world champion with Spain. Only Gemma has more titles than her.

    In July 2025 she announced that 2026 would be her last season. In September, Madrid, her home city, said goodbye to her at the last tournament she played there.

    Barcelona was still missing.

    She has been at both Finals played so far. In 2024, with Jessica Castelló, she reached the semi-finals. In 2025, with Martina Calvo, the quarter-finals.

    This will be her third. And her last.

    Verónica Virseda goes through with her. With the two of them, the 16 women who will play in Barcelona are now known. Aranza Osoro, her partner in Acapulco, misses out by a whisker.

    ## Libaak too

    The other place last night was decided on court.

    Tino Libaak and Javi Leal reached the quarter-finals two points apart in the Race. One match. One place.

    Libaak took it. With Gonza Alfonso, he beat Leal and Fran Guerrero: 7-6, 7-5, winning the tie-break 7-1.

    Libaak is 21. These will be his first Finals. Alfonso, who was ahead of him in the Race, will be there too.

    Leal, [world champion with Spain](/en/news/padel-world-cup-2026-final-spain-champions-argentina/) three weeks ago, misses out on Barcelona by one match. A year ago, at this same tournament, he was the one who took the last ticket.

    <figure><img src="/img/noticias/libaak-finals-2026-celebracion.jpg" alt="Tino Libaak smiles with his arms open and his racket in hand" width="1700" height="1358" loading="lazy"><figcaption>Tino Libaak. Photo: Premier Padel</figcaption></figure>

    In the men's draw there is still one door open. According to AnalistasPadel's numbers, Jairo Bautista and Lucas Bergamini would get in if they reach the final. Tonight they face Coello and Tapia. Juan Tello and Maxi Arce will be watching.

    ## Tonight, semi-finals

    Spanish time (approximate):

    - 23:00 · Ari Sánchez and Andrea Ustero vs Paula Josemaría and Bea González.
    - 01:00 · Libaak and Alfonso vs Íñigo Jofre and Juanlu Esbrí.
    - 02:30 · Gemma Triay and Delfi Brea vs Claudia Fernández and Martina Calvo.
    - 04:30 · Coello and Tapia vs Bautista and Bergamini.

    ## Her last court

    Libaak, 21, will play his first Finals.

    Ale Salazar, 40, her last.

    From 10 to 13 December. At the Palau Sant Jordi.

    That is where one of the greats says goodbye.

