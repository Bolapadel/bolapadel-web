  titulo: "Coello y Tapia remontan en Milán: tercer título en tres semanas"
  entradilla: "Perdieron el primer set ante Augsburger y Lebrón y acabaron ganando 4-6, 6-3, 6-2. En la final femenina, Ari Sánchez y Andrea Ustero volvieron a ganar a Josemaría y González: 7-6, 6-3."
  seo_titulo: "Coello y Tapia, Sánchez y Ustero ganan el Milano P1 2026"
  seo_descripcion: "Coello y Tapia remontaron a Augsburger y Lebrón (4-6, 6-3, 6-2) y Ari Sánchez y Andrea Ustero ganaron a Josemaría y González en la final de Milán."
  palabra_clave: "Milano P1 2026"
  cuerpo: |
    Esta vez les tocó a ellos remontar.

    Augsburger y Lebrón, que el sábado le dieron la vuelta a un 0-6 ante Galán y Chingotto, se llevaron el primer set de la final: 6-4.

    Coello y Tapia no se descompusieron. 6-3. Y 6-2. Una hora y cincuenta y siete minutos.

    Rotterdam, Düsseldorf y Milán. Tres semanas, tres títulos.

    ## Ari y Ustero, otra vez

    La final femenina repetía la de Rotterdam. Y acabó igual.

    Ari Sánchez y Andrea Ustero ganaron a Paula Josemaría y Bea González en dos sets: 7-6 (tie-break 7-3) y 6-3.

    Tres finales seguidas para ellas, en Rotterdam, Düsseldorf y Milán. Dos títulos.

    | Final | Ganan | Pierden | Resultado |
    |---|---|---|---|
    | Masculina | Coello / Tapia | Augsburger / Lebrón | 4-6 · 6-3 · 6-2 |
    | Femenina | Sánchez / Ustero | Josemaría / González | 7-6 · 6-3 |

