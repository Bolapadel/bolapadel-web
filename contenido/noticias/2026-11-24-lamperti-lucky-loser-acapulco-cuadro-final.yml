es:
  slug: lamperti-lucky-loser-acapulco-cuadro-final
  titulo: "Lamperti entra como lucky loser y jugará el cuadro final de Acapulco, su último Premier"
  entradilla: "Perdió en dos tie-breaks el último partido de la previa, pero una baja le ha dado la plaza. Esta noche, con Octavio Álvarez, juega contra Goenaga y Collado."
  seo_titulo: "Lamperti entra como lucky loser en Acapulco"
  seo_descripcion: "Miguel Lamperti, 48 años, entra como lucky loser en el cuadro final de Acapulco, su último Premier, y esta noche juega contra Goenaga y Collado."
  palabra_clave: "Lamperti lucky loser"
  cuerpo: |
    Miguel Lamperti perdió anoche.

    7-6 y 7-6 contra Aris Patiniotis y Thijs Roper. Dos tie-breaks. Casi dos horas.

    Era el último partido de la previa del Major de México. El que daba la entrada al cuadro final de su último torneo de Premier Padel.

    Parecía el final.

    No lo era.

    ## La plaza del lucky loser

    Una baja en el cuadro ha dejado un hueco libre. Y ese hueco es para Lamperti y Octavio Álvarez, como lucky loser.

    Su último Premier tendrá cuadro final.

    Hace un año, en este mismo torneo, entró saliendo de la previa. Esta vez entra por otro camino.

    Da igual por dónde. Está dentro.

    ## Contra Goenaga y Collado

    Es hoy martes, en la Cancha Mifel. Segundo partido de la sesión de las 16:00 en Acapulco. En España, sobre las 00:30, ya de madrugada.

    Enfrente, Enrique Goenaga y Guillermo Collado.

    Goenaga tiene 24 años, es de Palma y juega en el drive. Collado tiene 21, es de Madrid y juega en el revés.

    Entre Lamperti y Collado hay 27 años.

    Juegan juntos desde septiembre. En el Major de Kuwait llegaron a octavos: por el camino ganaron a Javi Garrido y Juani de Pascual, el chico con el que Lamperti salió de la previa de Acapulco hace un año. Después cayeron con Coello y Tapia.

    Si ganan Lamperti y Álvarez, en dieciseisavos les esperan Tino Libaak y Gonzalo Alfonso, cabezas de serie n.º 9 y finalistas del Dubái P1.

    ## El último baile

    Lamperti tiene 48 años. Anunció en enero que 2026 sería su última temporada en el máximo nivel. Y después de Acapulco solo quedan las Finals de Barcelona, reservadas a las mejores parejas del año. [Por eso este es su último Premier](/actualidad/miguel-lamperti-acapulco-previa-ultimo-premier/).

    Ayer, la previa se le cerró en dos tie-breaks.

    Hoy, el cuadro le abre la puerta.

    El último baile tiene cuadro final. A disfrutarlo, Miguel.

en:
  slug: lamperti-lucky-loser-acapulco-main-draw
  titulo: "Lamperti gets in as a lucky loser and will play the Acapulco main draw, his last Premier event"
  entradilla: "He lost the final qualifying match in two tie-breaks, but a withdrawal has opened a spot. Tonight, with Octavio Álvarez, he faces Goenaga and Collado."
  seo_titulo: "Lamperti gets into Acapulco as a lucky loser"
  seo_descripcion: "Miguel Lamperti, 48, gets into the Acapulco main draw as a lucky loser at his last Premier event, and tonight he faces Goenaga and Collado."
  palabra_clave: "Lamperti lucky loser"
  cuerpo: |
    Miguel Lamperti lost last night.

    7-6, 7-6 against Aris Patiniotis and Thijs Roper. Two tie-breaks. Almost two hours.

    It was the final qualifying match at the Mexico Major. The one that led into the main draw of his last Premier Padel tournament.

    It looked like the end.

    It wasn't.

    ## The lucky loser spot

    A withdrawal from the draw has left a spot open. And that spot goes to Lamperti and Octavio Álvarez, as lucky losers.

    His last Premier event will have a main draw.

    A year ago, at this very tournament, he got in by coming through qualifying. This time he gets in by another route.

    It doesn't matter how. He's in.

    ## Against Goenaga and Collado

    It's today, Tuesday, on Cancha Mifel. Second match of the 4pm session in Acapulco. In Spain, around 00:30, in the early hours.

    On the other side of the net, Enrique Goenaga and Guillermo Collado.

    Goenaga is 24, from Palma, and plays on the right. Collado is 21, from Madrid, and plays on the left.

    There are 27 years between Lamperti and Collado.

    They've played together since September. At the Kuwait Major they reached the round of 16: along the way they beat Javi Garrido and Juani de Pascual, the kid Lamperti came through qualifying with in Acapulco a year ago. Then they lost to Coello and Tapia.

    If Lamperti and Álvarez win, Tino Libaak and Gonzalo Alfonso, the No. 9 seeds and finalists at the Dubai P1, await in the round of 32.

    ## The last dance

    Lamperti is 48. He announced in January that 2026 would be his last season at the top level. And after Acapulco, only the Finals in Barcelona remain, reserved for the best pairs of the year. [That's why this is his last Premier event](/en/news/miguel-lamperti-acapulco-qualifying-last-premier/).

    Yesterday, qualifying closed the door on him in two tie-breaks.

    Today, the draw opens it.

    The last dance has a main draw. Enjoy it, Miguel.

