  seo_titulo: "Abud y Belluati remontan en el Major de Kuwait"
  seo_descripcion: "Abud y Belluati remontan en el Major de Kuwait (3-6, 6-2, 7-5) y jugarán contra Lebrón y Augsburger. Cinco remontadas en el primer día del cuadro masculino."
  palabra_clave: "Major de Kuwait"
  cuerpo: |
    Martín Abud nunca había ganado un partido en el cuadro final de un Major.

    Hasta el domingo.

    Él y Juan Cruz Belluati llegaron a Kuwait desde la previa. En su primer partido del cuadro, el primer set se les fue: 3-6 ante Javier Martínez y Luis Hernández.

    Le dieron la vuelta. 6-2. Y un tercero que se decidió al final: 7-5.

    Dos horas y 43 minutos.

    El premio, el martes en dieciseisavos: Juan Lebrón y Leo Augsburger, terceros cabezas de serie.

    ## Una cuenta pendiente

    El rival no era cualquiera para Abud.

    El 1 de septiembre, en el Madrid P1, cayó en primera ronda contra esa misma pareja. Entonces jugaba con Marcos González.

    Siete semanas después, con Belluati al lado, ha sido al revés.

    ## Un domingo de remontadas

    No fueron los únicos.

    De los dieciséis partidos del domingo, cinco los ganó la pareja que había perdido el primer set:

    - **Adam Axelsson y Mario Ortega**, también desde la previa, a Maxi Sánchez y Sanyo Gutiérrez: 4-6, 7-6 (9-7) y 6-3. Casi dos horas y media. El martes, Maxi Arce y Juan Tello.
    - **Juan Ignacio Rubini y Alex Chozas** a David Gala y Enzo Jensen: 1-6, 7-6 (7-5) y 6-4.
    - **Andrés Fernández Lancha y José Antonio Diestro** a Alonso Rodríguez y Pablo García: 4-6, 6-0 y 6-3. Hoy, Franco Stupaczuk y Jon Sanz.
    - **José Solano y Ramiro Pereyra** a Javier Barahona e Ignacio Piotto: 6-7, 6-4 y 6-4.

    Un detalle. Hace dos semanas, en la previa de Milán, Axelsson y Ortega dejaron fuera a Abud y Belluati.

    El domingo remontaron los cuatro.

    ## Enfrente, los que remontaron un 0-6

    Lebrón y Augsburger saben mucho de esto.

    En la semifinal de Milán perdieron el primer set 0-6 contra Galán y Chingotto. [Acabaron ganando 6-2 y 6-2](/actualidad/augsburger-lebron-remontada-galan-chingotto-milano/).

    Abud y Belluati llegan con la confianza de haber salvado un partido que se les escapaba. Enfrente tendrán a una pareja que también sabe darle la vuelta a todo.

    El martes veremos hasta dónde llega la racha.

en:
  slug: abud-belluati-comeback-kuwait-major-lebron-augsburger
  titulo: "Abud and Belluati come back in Kuwait and will face Lebrón and Augsburger"
  entradilla: "They came through qualifying, lost the first set and turned it around. It's Martín Abud's first main-draw win at a Major. On Tuesday, the third seeds."
  seo_titulo: "Abud and Belluati come back at the Kuwait Major"
  seo_descripcion: "Abud and Belluati come back at the Kuwait Major (3-6, 6-2, 7-5) and will face Lebrón and Augsburger. Five comebacks on the men's opening day."
  palabra_clave: "Kuwait Major"
  cuerpo: |
    Martín Abud had never won a main-draw match at a Major.

    Until Sunday.

    He and Juan Cruz Belluati reached Kuwait through qualifying. In their first main-draw match, the first set got away from them: 3-6 against Javier Martínez and Luis Hernández.

    They turned it around. 6-2. And a third set decided at the very end: 7-5.

    Two hours and 43 minutes.

    The reward, on Tuesday in the round of 32: Juan Lebrón and Leo Augsburger, the third seeds.

    ## Unfinished business

    This wasn't just any opponent for Abud.

    On 1 September, at the Madrid P1, he lost in the first round to this very pair. Back then he was playing with Marcos González.

    Seven weeks later, with Belluati by his side, it went the other way.

    ## A Sunday of comebacks

    They weren't the only ones.

    Of Sunday's sixteen matches, five were won by the pair that had lost the first set:

    - **Adam Axelsson and Mario Ortega**, also from qualifying, beat Maxi Sánchez and Sanyo Gutiérrez: 4-6, 7-6 (9-7), 6-3. Almost two and a half hours. On Tuesday, Maxi Arce and Juan Tello.
    - **Juan Ignacio Rubini and Alex Chozas** beat David Gala and Enzo Jensen: 1-6, 7-6 (7-5), 6-4.
    - **Andrés Fernández Lancha and José Antonio Diestro** beat Alonso Rodríguez and Pablo García: 4-6, 6-0, 6-3. Today, Franco Stupaczuk and Jon Sanz.
    - **José Solano and Ramiro Pereyra** beat Javier Barahona and Ignacio Piotto: 6-7, 6-4, 6-4.

    One detail. Two weeks ago, in Milan qualifying, Axelsson and Ortega knocked out Abud and Belluati.

    On Sunday, all four came back.

    ## Up next, the pair who came back from 0-6

    Lebrón and Augsburger know a thing or two about this.

    In the Milan semi-final they lost the first set 0-6 to Galán and Chingotto. [They went on to win 6-2, 6-2](/en/news/augsburger-lebron-comeback-galan-chingotto-milano/).

    Abud and Belluati arrive with the confidence of having rescued a match that was slipping away. Across the net, a pair that also knows how to turn anything around.

    On Tuesday we'll see how far the run goes.

