es:
  slug: ale-galan-baja-mundial-qatar-lesion
  titulo: "Ale Galán no jugará el Mundial de Qatar por lesión"
  entradilla: "Lo ha comunicado la Federación Española de Pádel este viernes. Después de perderse el Major de Kuwait, Galán tampoco estará en Doha. El Mundial empieza el lunes."
  seo_titulo: "Ale Galán, baja en el Mundial de pádel de Qatar"
  seo_descripcion: "Ale Galán no jugará el Mundial de Qatar por lesión, según la Federación Española de Pádel. España pierde al número 3 del mundo a tres días de empezar."
  palabra_clave: "Galán Mundial"
  cuerpo: |
    Se temía desde hace una semana. Hoy es oficial.

    Ale Galán no jugará el Mundial de Qatar.

    Lo ha comunicado la Federación Española de Pádel este viernes por la mañana. Baja médica. Sin más detalles.

    No se sabe qué lesión tiene. Tampoco cuánto tiempo estará fuera.

    La Federación le desea una pronta recuperación. Nosotros también.

    ## Primero Kuwait, ahora Doha

    El sábado pasado ya [se bajó del Major de Kuwait](/actualidad/chingotto-galan-baja-major-kuwait-lesion/). Lo contó él mismo en Instagram.

    Desde ese día, la pregunta era otra. Si llegaría a Doha.

    No llega.

    Su último partido fue el 17 de octubre, en las semifinales de Milán. Él y Chingotto ganaron el primer set 6-0 a [Lebrón y Augsburger](/actualidad/augsburger-lebron-remontada-galan-chingotto-milano/). Perdieron los otros dos: 6-2 y 6-2.

    ## Adiós al reencuentro

    Esa noche, al otro lado de la red, estaba Juan Lebrón.

    Con él fue número 1 del mundo. Y con él iba a volver a jugar en Doha: a principios de octubre, el seleccionador Juanjo Gutiérrez contó que volverían a compartir pista en el Mundial.

    No habrá reencuentro.

    ## Un hueco en el revés

    Galán es el número 3 del mundo y juega en el revés.

    Sin él, a España le quedan siete de [los ocho convocados](/actualidad/convocatoria-espana-mundial-padel-2026/).

    La Federación no ha dicho si llamará a otro jugador. Según Padel Addict, hay plazo hasta mañana, sábado.

    Cuando se hizo la lista, la última plaza fue para Aimar Goñi, por delante de Momo González y Javi Leal. Los dos juegan en el revés.

    Goñi, por cierto, juega hoy [la semifinal del Major de Kuwait](/actualidad/aimar-goni-edu-alonso-semifinales-major-kuwait-mundial/). Por el camino ganó a Javi Leal.

    ## El lunes, Doha

    El Mundial se juega del 2 al 7 de noviembre.

    España no gana el masculino desde 2021. Argentina se llevó los dos últimos.

    Chingotto, su compañero en el circuito, está en [la lista de Argentina](/actualidad/convocatoria-argentina-mundial-padel-2026/).

    Hace seis días escribió que esperaba volver pronto a la pista.

    Tendrá que ser después de Doha.

en:
  slug: ale-galan-out-padel-world-cup-qatar-injury
  titulo: "Ale Galán will miss the World Cup in Qatar through injury"
  entradilla: "The Spanish Padel Federation announced it on Friday. After missing the Kuwait Major, Galán won't be in Doha either. The World Cup starts on Monday."
  seo_titulo: "Ale Galán out of the Padel World Cup in Qatar"
  seo_descripcion: "Ale Galán will miss the World Cup in Qatar through injury, the Spanish Padel Federation says. Spain lose the world number 3 three days before it starts."
  palabra_clave: "Galán World Cup"
  cuerpo: |
    It had been feared for a week. Today it's official.

    Ale Galán won't play the World Cup in Qatar.

    The Spanish Padel Federation announced it on Friday morning. Medical leave. No further details.

    We don't know what the injury is. Or how long he'll be out.

    The Federation wishes him a speedy recovery. So do we.

    ## First Kuwait, now Doha

    Last Saturday he [pulled out of the Kuwait Major](/en/news/chingotto-galan-out-kuwait-major-injury/). He announced it himself on Instagram.

    From that day on, the question was a different one. Would he make it to Doha?

    He won't.

    His last match was on 17 October, in the Milan semi-finals. He and Chingotto won the first set 6-0 against [Lebrón and Augsburger](/en/news/augsburger-lebron-comeback-galan-chingotto-milano/). They lost the next two: 6-2, 6-2.

    ## No reunion

    That night, on the other side of the net, was Juan Lebrón.

    With him, Galán was world number 1. And with him he was going to play again in Doha: in early October, Spain coach Juanjo Gutiérrez said they would share a court again at the World Cup.

    There will be no reunion.

    ## A gap on the backhand side

    Galán is the world number 3 and plays on the backhand side.

    Without him, Spain have seven of [the eight players called up](/en/news/spain-squad-padel-world-cup-2026/).

    The Federation hasn't said whether it will call up another player. According to Padel Addict, the deadline is tomorrow, Saturday.

    When the squad was picked, the last spot went to Aimar Goñi, ahead of Momo González and Javi Leal. Both play on the backhand side.

    Goñi, by the way, plays [the Kuwait Major semi-final](/en/news/aimar-goni-edu-alonso-semifinal-kuwait-major-world-cup/) today. Along the way he beat Javi Leal.

    ## Monday, Doha

    The World Cup runs from 2 to 7 November.

    Spain haven't won the men's title since 2021. Argentina took the last two.

    Chingotto, his partner on tour, is in [Argentina's squad](/en/news/argentina-squad-padel-world-cup-2026/).

    Six days ago he wrote that he hoped to be back on court soon.

    It will have to be after Doha.

