es:
  slug: mundial-padel-2026-segundo-dia-espana-cuartos-tapia
  titulo: "España ya está en cuartos del Mundial de Qatar y Tapia se estrena con victoria"
  entradilla: "España ganó 3-0 a Paraguay, con el debut de Javi Leal, y tiene el pase asegurado. Argentina ganó 3-0 a Países Bajos en el estreno de Tapia. Ellas, otros dos 3-0. Hoy se cierran los grupos."
  seo_titulo: "Mundial de pádel 2026: España, en cuartos; debuta Tapia"
  seo_descripcion: "Segundo día del Mundial de pádel 2026: España gana 3-0 a Paraguay y ya está en cuartos, con el debut de Javi Leal. Argentina, 3-0 con el estreno de Tapia."
  palabra_clave: "Mundial de pádel 2026"
  cuerpo: |
    Arturo Coello lleva cuatro días y tres compañeros.

    El sábado ganó Kuwait con Tapia. El lunes, ya en el Mundial, ganó con Paquito Navarro. El martes, con Aimar Goñi.

    Tres compañeros. Tres victorias.

    Y el martes, por fin, también le tocó a Tapia.

    ## España: el estreno de Javi Leal

    España ganó 3-0 a Paraguay. Con el pleno, ya está en cuartos: pase lo que pase hoy, acaba entre las dos primeras de su grupo.

    - **Yanguas y Javi Leal:** 6-4, 6-3 a González y Dehnike.
    - **Paquito Navarro y Lebrón:** 6-0, 6-2 a Petit y Popovich.
    - **Goñi y Coello:** 6-1, 6-3 a Miranda y Rodríguez.

    <figure><img src="/img/noticias/mundial-2026-espana-paraguay-choque.jpg" alt="Dos jugadores de España se chocan la mano en el partido contra Paraguay del Mundial de Qatar" width="1069" height="1600" loading="lazy"><figcaption>España, ante Paraguay. Imagen: Federación Española de Pádel</figcaption></figure>

    El primer punto lo puso Javi Leal. Entró en la lista el viernes, por la [baja de Ale Galán](/actualidad/ale-galan-baja-mundial-qatar-lesion/). El martes jugó su primer partido en un Mundial. Una hora y seis minutos.

    Y ganó.

    Lebrón y Paquito fueron los más rápidos: 40 minutos.

    Goñi, que el lunes [sufrió dos horas y 13 minutos](/actualidad/mundial-padel-2026-primer-dia-espana-argentina/) con Yanguas, necesitó 44 con Coello.

    No jugaron Jon Sanz ni Coki Nieto. En Paraguay, tampoco Martín Abud.

    ## Argentina: le tocó a Tapia

    Argentina ganó 3-0 a Países Bajos, el equipo que el lunes había ganado a Francia.

    - **Tapia y Libaak:** 6-4, 6-2 a Richters y Roper.
    - **Stupaczuk y Arce:** 6-1, 6-3 a Van Opstal y Prins.
    - **Augsburger y Chingotto:** 6-3, 6-4 a Nolten y Van Betuw.

    Tapia y Libaak, que no jugaron el lunes, pusieron el primer punto. Libaak es el del punto que decidió el Mundial de 2024.

    Augsburger jugó con Chingotto. Un detalle: las parejas de los dos en el circuito son españolas. Lebrón también ganó el martes, con España. Galán se ha perdido el Mundial por lesión.

    Más trabajo que el lunes. Contra Australia, Argentina cedió tres juegos. Contra Países Bajos, 17. Casi tres horas de pista entre los tres partidos.

    Hoy, Francia. Si Argentina gana, es primera de grupo.

    ## Qatar, a dos bolas de partido

    Lo más emocionante del día no lo jugaron los favoritos.

    Qatar, el anfitrión, perdió 2-1 con Chile. Y tuvo dos bolas de partido para ganar.

    Los hermanos Rashed y Mashari Nawaf ganaron el primer partido, 6-3, 6-3. Chile empató. En el tercero, Mohammed Saadon y Hassan Waly ganaron el primer set 6-2 y tuvieron dos bolas de partido en el segundo. No las cerraron. Muñoz y Torres le dieron la vuelta: 2-6, 7-6 y 6-3. Casi dos horas, con la grada llena.

    En el grupo D, Italia y Brasil siguen invictas. Hoy se juegan el primer puesto.

    ## Ellas, otros dos 3-0

    España ganó 3-0 a Gran Bretaña. Cedió tres juegos en toda la eliminatoria.

    <figure><img src="/img/noticias/mundial-2026-espana-paraguay-celebracion.jpg" alt="Un jugador de España celebra un punto ante Paraguay en el Mundial de Qatar" width="1069" height="1600" loading="lazy"><figcaption>España, ante Paraguay. Imagen: Federación Española de Pádel</figcaption></figure>

    Jugaron Ari Sánchez y Andrea Ustero, que el sábado perdieron [la final de Kuwait](/actualidad/gemma-triay-59-titulos-record-historia/) contra Triay y Brea. Cada una, con otra compañera. Ari y Paula Josemaría, 6-0, 6-1. Andrea y Martina Calvo, 6-0, 6-0. Marta Ortega y Bea González, 6-1, 6-1.

    Argentina ganó 3-0 a Bélgica. Delfi Brea, la otra campeona de Kuwait, ganó con Martina Fassio 6-0, 6-0.

    Hoy, España contra Brasil: si gana, es primera de grupo. Argentina y Francia ya están en cuartos y se juegan el primer puesto.

    ## Hoy, último día de grupos

    - **12:00:** ellas. España contra Brasil y Argentina contra Francia.
    - **16:00:** ellos. España contra Emiratos, Argentina contra Francia y Suecia contra Paraguay, que decide el otro billete del grupo de España.

    Horas de España; en Argentina, cuatro menos. [Dónde verlo](/actualidad/donde-ver-mundial-padel-2026-tv-streaming/), aquí. Mañana, cuartos.

    Coello y Tapia ya han ganado los dos esta semana.

    Cada uno por su lado. Como toca hasta el sábado.

en:
  slug: padel-world-cup-2026-day-two-spain-quarter-finals-tapia
  titulo: "Spain are through to the World Cup quarter-finals in Qatar and Tapia wins on his debut"
  entradilla: "Spain beat Paraguay 3-0, with Javi Leal making his debut, and are sure of a place in the last eight. Argentina beat the Netherlands 3-0 in Tapia's first match. The women, two more 3-0s. The groups finish today."
  seo_titulo: "2026 Padel World Cup: Spain into the quarters, Tapia debuts"
  seo_descripcion: "Day two of the 2026 Padel World Cup: Spain beat Paraguay 3-0 and reach the quarter-finals, with Javi Leal's debut. Argentina win 3-0 in Tapia's first match."
  palabra_clave: "2026 Padel World Cup"
  cuerpo: |
    Arturo Coello: four days, three partners.

    On Saturday he won Kuwait with Tapia. On Monday, at the World Cup, he won with Paquito Navarro. On Tuesday, with Aimar Goñi.

    Three partners. Three wins.

    And on Tuesday, at last, it was Tapia's turn too.

    ## Spain: Javi Leal's debut

    Spain beat Paraguay 3-0. With the clean sweep, they are into the quarter-finals: whatever happens today, they finish in the top two of their group.

    - **Yanguas and Javi Leal:** 6-4, 6-3 over González and Dehnike.
    - **Paquito Navarro and Lebrón:** 6-0, 6-2 over Petit and Popovich.
    - **Goñi and Coello:** 6-1, 6-3 over Miranda and Rodríguez.

    <figure><img src="/img/noticias/mundial-2026-espana-paraguay-choque.jpg" alt="Two Spain players high-five during the match against Paraguay at the World Cup in Qatar" width="1069" height="1600" loading="lazy"><figcaption>Spain, against Paraguay. Image: Spanish Padel Federation</figcaption></figure>

    The first point came from Javi Leal. He joined the squad on Friday, after [Ale Galán's injury](/en/news/ale-galan-out-padel-world-cup-qatar-injury/). On Tuesday he played his first ever World Cup match. One hour and six minutes.

    And he won.

    Lebrón and Paquito were the quickest: 40 minutes.

    Goñi, who [suffered for two hours and 13 minutes](/en/news/padel-world-cup-2026-day-one-spain-argentina/) with Yanguas on Monday, needed 44 with Coello.

    Jon Sanz and Coki Nieto didn't play. For Paraguay, neither did Martín Abud.

    ## Argentina: Tapia's turn

    Argentina beat the Netherlands 3-0, the team that had beaten France on Monday.

    - **Tapia and Libaak:** 6-4, 6-2 over Richters and Roper.
    - **Stupaczuk and Arce:** 6-1, 6-3 over Van Opstal and Prins.
    - **Augsburger and Chingotto:** 6-3, 6-4 over Nolten and Van Betuw.

    Tapia and Libaak, who didn't play on Monday, won the first point. Libaak is the man who won the point that decided the 2024 World Cup.

    Augsburger played with Chingotto. A detail: both of their partners on the tour are Spanish. Lebrón also won on Tuesday, for Spain. Galán is missing the World Cup through injury.

    More work than on Monday. Against Australia, Argentina dropped three games. Against the Netherlands, 17. Almost three hours on court across the three matches.

    Today, France. If Argentina win, they top the group.

    ## Qatar, two match points away

    The most dramatic tie of the day didn't involve the favourites.

    Hosts Qatar lost 2-1 to Chile. And they had two match points to win it.

    The brothers Rashed and Mashari Nawaf won the first match, 6-3, 6-3. Chile levelled. In the third, Mohammed Saadon and Hassan Waly took the first set 6-2 and had two match points in the second. They didn't convert them. Muñoz and Torres turned it around: 2-6, 7-6, 6-3. Almost two hours, in front of a full stand.

    In group D, Italy and Brazil are still unbeaten. Today they play for top spot.

    ## The women, two more 3-0s

    Spain beat Great Britain 3-0. They dropped three games in the whole tie.

    <figure><img src="/img/noticias/mundial-2026-espana-paraguay-celebracion.jpg" alt="A Spain player celebrates a point against Paraguay at the World Cup in Qatar" width="1069" height="1600" loading="lazy"><figcaption>Spain, against Paraguay. Image: Spanish Padel Federation</figcaption></figure>

    Ari Sánchez and Andrea Ustero played, three days after losing [the Kuwait final](/en/news/gemma-triay-59-titles-most-titles-padel-history/) to Triay and Brea. Each with a different partner. Ari and Paula Josemaría, 6-0, 6-1. Andrea and Martina Calvo, 6-0, 6-0. Marta Ortega and Bea González, 6-1, 6-1.

    Argentina beat Belgium 3-0. Delfi Brea, the other Kuwait champion, won 6-0, 6-0 with Martina Fassio.

    Today, Spain face Brazil: if they win, they top the group. Argentina and France are already in the quarter-finals and play for first place.

    ## Today, the last day of the groups

    - **12:00:** the women. Spain v Brazil and Argentina v France.
    - **16:00:** the men. Spain v the UAE, Argentina v France and Sweden v Paraguay, which decides the other place in Spain's group.

    Times are CET; in Argentina, four hours earlier. [Where to watch](/en/news/where-to-watch-padel-world-cup-2026-tv-streaming/), here. Tomorrow, the quarter-finals.

    Coello and Tapia have both won this week.

    Each on his own side. As it should be until Saturday.

