es:
  slug: lebron-augsburger-final-dubai-p1-libaak-alfonso
  titulo: "Lebrón y Augsburger jugarán la final del Dubái P1 contra Libaak y Alfonso"
  entradilla: "Es su quinta final del año y la primera sin Coello y Tapia al otro lado. Enfrente, la pareja que les ha ganado las dos veces que se han cruzado en 2026."
  seo_titulo: "Lebrón y Augsburger, a la final del Dubái P1 contra Libaak"
  seo_descripcion: "Lebrón y Augsburger ganan 6-4 y 6-2 a Abbate y Dal Bianco y jugarán la final del Dubái P1 contra Libaak y Alfonso. Es su quinta final de 2026."
  palabra_clave: "final Dubái P1"
  cuerpo: |
    Cinco finales en 2026.

    Las cuatro primeras, contra Coello y Tapia: Cancún, Bruselas, Málaga y Milán. Ganaron una, la de Bruselas.

    La quinta es distinta.

    Este domingo, en Dubái, Juan Lebrón y Leo Augsburger no tendrán a los números uno al otro lado de la red. [Coello y Tapia se bajaron del torneo por una lesión de Tapia](/actualidad/coello-tapia-baja-dubai-p1-lesion-tapia/).

    Tendrán a Tino Libaak y Gonzalo Alfonso. La pareja que este año les ha ganado las dos veces.

    ## Una hora y a la final

    Lebrón y Augsburger (2) han ganado hoy 6-4 y 6-2 a Flavio Abbate y Franco Dal Bianco. En poco más de una hora.

    Abbate y Dal Bianco jugaban su primera semifinal juntos. Por el camino habían dejado a Roglan y Aragón y a Momo y Campagnolo.

    ## Dos de dos

    Libaak y Alfonso se han cruzado dos veces con Lebrón y Augsburger. Las dos, este año. Las dos, en octavos. Y las dos las han ganado.

    - **Madrid P1, septiembre:** 7-6 y 7-5.
    - **Major de Kuwait, octubre:** 4-6, 7-5 y 6-1. [Lo contamos aquí](/actualidad/libaak-alfonso-lebron-augsburger-cuartos-major-kuwait/).

    La tercera es una final.

    ## La primera final de Libaak

    Libaak y Alfonso (10) han ganado 6-1 y 6-4 a Javi Garrido y Juani De Pascual (14). También en una hora.

    Tino Libaak tiene 21 años. Es su primera final en Premier Padel.

    Gonzalo Alfonso, 30, juega la tercera. Las dos anteriores fueron en 2025, con Tolito Aguirre: Gijón y Cancún. Se le escaparon las dos. La de Cancún, contra Lebrón, que entonces jugaba con Stupaczuk.

    Juegan juntos desde finales de julio. Y desde octubre van subiendo: cuartos en Róterdam, Düsseldorf y Milán. Semifinales en Kuwait. Final en Dubái.

    Para Garrido y De Pascual, el torneo termina en semifinales. [Las primeras de Garrido en un año](/actualidad/garrido-de-pascual-semifinales-dubai-p1/). Las primeras de De Pascual en Premier.

    ## Tres argentinos y un campeón del mundo

    Hace una semana, en Doha, tres de los cuatro finalistas perdieron la final del Mundial con Argentina. Augsburger, Libaak y Alfonso.

    El cuarto la ganó. [Lebrón, con Goñi, remontó el primer partido](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/) a Augsburger y Di Nenno. Libaak y Alfonso jugaron el punto decisivo y perdieron con Coello y Nieto.

    Ocho días después, Augsburger juega con Lebrón. Y sus dos compañeros de selección, enfrente.

    Uno de ellos, además, es compañero de marca: [Augsburger y Libaak estrenaron logo propio con Siux](/actualidad/augsburger-libaak-nuevo-logo-siux/) en octubre.

    ## Y las Finals, de fondo

    Solo los 16 primeros de la Race juegan las Finals de Barcelona, del 10 al 13 de diciembre.

    Según Premier Padel, con esta final Alfonso ya está en esos puestos y Libaak se queda a 70 puntos. Si ganan el domingo, Libaak también se mete.

    Después solo queda el Major de México.

    ## Ellas: una final que nunca se había jugado

    Bea González y Paula Josemaría (2) contra Martina Calvo y Claudia Fernández (4).

    Se han cruzado seis veces este año. Las seis, en semifinales. Tres para cada pareja.

    La séptima es la primera final.

    <figure><img src="/img/noticias/dubai-p1-2026-bea-gonzalez-josemaria.jpg" alt="Bea González y Paula Josemaría hablan en la pista en el Dubái P1" width="1400" height="1750" loading="lazy"><figcaption>Bea González y Paula Josemaría, en Dubái. Imagen: Premier Padel</figcaption></figure>

    Bea y Paula han ganado 6-4 y 7-5 a Ari Sánchez y Andrea Ustero (3), que les habían ganado las tres últimas veces: las finales de Róterdam y Milán y la semifinal de Kuwait. Es su duodécima final del año. Han ganado seis títulos; el último, en Valladolid, en junio.

    Calvo y Fernández, 6-3 y 6-1 a Tamara Icardo y Claudia Jensen (6), que el viernes habían eliminado a Triay y Brea. Es su quinta final del año. Van a por el tercer título, después de Londres y Düsseldorf.

    ## Las finales del domingo

    Hora española.

    - **15:00** · Calvo / Fernández (4) – Josemaría / Bea González (2)
    - **No antes de las 17:00** · Libaak / Alfonso (10) – Lebrón / Augsburger (2)

    Desde el martes se sabía que el Dubái P1 iba a tener campeones nuevos.

    Ahora se sabe entre quiénes.

en:
  slug: lebron-augsburger-dubai-p1-final-libaak-alfonso
  titulo: "Lebrón and Augsburger will play the Dubai P1 final against Libaak and Alfonso"
  entradilla: "It's their fifth final of the year and the first without Coello and Tapia on the other side. Across the net, the pair that has beaten them both times they've met in 2026."
  seo_titulo: "Lebrón and Augsburger reach Dubai P1 final against Libaak"
  seo_descripcion: "Lebrón and Augsburger beat Abbate and Dal Bianco 6-4, 6-2 and will play the Dubai P1 final against Libaak and Alfonso. It's their fifth final of 2026."
  palabra_clave: "Dubai P1 final"
  cuerpo: |
    Five finals in 2026.

    The first four, against Coello and Tapia: Cancún, Brussels, Málaga and Milan. They won one, in Brussels.

    The fifth is different.

    This Sunday, in Dubai, Juan Lebrón and Leo Augsburger won't have the world number ones on the other side of the net. [Coello and Tapia pulled out of the tournament because of an injury to Tapia](/en/news/coello-tapia-out-dubai-p1-tapia-injury/).

    They'll have Tino Libaak and Gonzalo Alfonso. The pair that has beaten them both times this year.

    ## An hour, and into the final

    Lebrón and Augsburger (2) beat Flavio Abbate and Franco Dal Bianco 6-4, 6-2 today. In just over an hour.

    Abbate and Dal Bianco were playing their first semi-final together. On the way they had knocked out Roglan and Aragón and Momo and Campagnolo.

    ## Two out of two

    Libaak and Alfonso have faced Lebrón and Augsburger twice. Both times this year. Both times in the round of 16. And they won both.

    - **Madrid P1, September:** 7-6, 7-5.
    - **Kuwait Major, October:** 4-6, 7-5, 6-1. [We told that story here](/en/news/libaak-alfonso-beat-lebron-augsburger-kuwait-major-quarterfinals/).

    The third is a final.

    ## Libaak's first final

    Libaak and Alfonso (10) beat Javi Garrido and Juani De Pascual (14) 6-1, 6-4. Also in an hour.

    Tino Libaak is 21. It's his first Premier Padel final.

    Gonzalo Alfonso, 30, plays his third. The previous two came in 2025, with Tolito Aguirre: Gijón and Cancún. Both slipped away. The one in Cancún, against Lebrón, who was playing with Stupaczuk at the time.

    They've been playing together since late July. And since October they've kept climbing: quarter-finals in Rotterdam, Düsseldorf and Milan. Semi-finals in Kuwait. Final in Dubai.

    For Garrido and De Pascual, the tournament ends in the semi-finals. [Garrido's first in a year](/en/news/garrido-de-pascual-semi-finals-dubai-p1/). De Pascual's first in Premier.

    ## Three Argentinians and a world champion

    A week ago, in Doha, three of the four finalists lost the World Cup final with Argentina. Augsburger, Libaak and Alfonso.

    The fourth won it. [Lebrón, with Goñi, came back to win the first match](/en/news/padel-world-cup-2026-final-spain-champions-argentina/) against Augsburger and Di Nenno. Libaak and Alfonso played the deciding point and lost to Coello and Nieto.

    Eight days later, Augsburger plays alongside Lebrón. And his two national teammates, across the net.

    One of them is also a brand-mate: [Augsburger and Libaak launched their own logos with Siux](/en/news/augsburger-libaak-new-logo-siux/) in October.

    ## And the Finals, in the background

    Only the top 16 in the Race play the Barcelona Finals, from 10 to 13 December.

    According to Premier Padel, with this final Alfonso is already in those places and Libaak is 70 points away. If they win on Sunday, Libaak moves in too.

    After that, only the Mexico Major is left.

    ## Women: a final that had never been played

    Bea González and Paula Josemaría (2) against Martina Calvo and Claudia Fernández (4).

    They've met six times this year. All six in the semi-finals. Three wins each.

    The seventh is their first final.

    <figure><img src="/img/noticias/dubai-p1-2026-bea-gonzalez-josemaria.jpg" alt="Bea González and Paula Josemaría talk on court at the Dubai P1" width="1400" height="1750" loading="lazy"><figcaption>Bea González and Paula Josemaría, in Dubai. Photo: Premier Padel</figcaption></figure>

    Bea and Paula beat Ari Sánchez and Andrea Ustero (3) 6-4, 7-5. Ari and Andrea had won their last three meetings: the Rotterdam and Milan finals and the Kuwait semi-final. It's their twelfth final of the year. They've won six titles; the last one, in Valladolid, in June.

    Calvo and Fernández beat Tamara Icardo and Claudia Jensen (6) 6-3, 6-1. Icardo and Jensen had knocked out Triay and Brea on Friday. It's their fifth final of the year. They're going for a third title, after London and Düsseldorf.

    ## Sunday's finals

    Spanish time (CET).

    - **15:00** · Calvo / Fernández (4) – Josemaría / Bea González (2)
    - **Not before 17:00** · Libaak / Alfonso (10) – Lebrón / Augsburger (2)

    Since Tuesday we knew the Dubai P1 would have new champions.

    Now we know which pairs it's between.

