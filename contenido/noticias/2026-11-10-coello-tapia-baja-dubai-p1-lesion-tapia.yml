es:
  slug: coello-tapia-baja-dubai-p1-lesion-tapia
  titulo: "Coello y Tapia son baja en el Dubái P1 por una lesión de Tapia"
  entradilla: "Agustín Tapia está lesionado y los número uno no jugarán en Dubái, donde iban a por su tercer título seguido. Su sitio en el cuadro lo ocupará una pareja lucky loser."
  seo_titulo: "Coello y Tapia, baja en el Dubái P1 por lesión de Tapia"
  seo_descripcion: "Agustín Tapia se lesiona y él y Arturo Coello no jugarán el Dubái P1, donde iban a por su tercer título seguido. Entra una pareja lucky loser."
  palabra_clave: "Coello y Tapia Dubái P1"
  cuerpo: |
    > **Actualización, 11 de noviembre.** La pareja lucky loser son Marcos González y Diego García. Este miércoles [ganaron a Chozas y Rubini](/actualidad/roglan-aragon-remontan-navarro-di-nenno-dubai-p1/) y el jueves juegan los octavos contra Libaak y Alfonso.

    Coello y Tapia no jugarán el Dubái P1.

    Agustín Tapia está lesionado. Lo ha comunicado el torneo esta noche, con el cuadro principal masculino actualizado.

    No se ha dicho qué lesión tiene. Tampoco cuánto tiempo estará parado.

    Su sitio lo ocupará una pareja lucky loser. Una de las que perdieron en la previa y que ahora tiene una segunda oportunidad.

    Mucho ánimo, Agustín.

    ## Iban a por el tercero seguido

    Dubái es un torneo suyo. Lo ganaron en 2024 y en 2025.

    Las dos veces, en la final contra Galán y Chingotto. Y las dos veces con un marcador casi calcado: 6-4 y 6-3 el primer año, 6-3 y 6-4 el segundo.

    Este año Galán y Chingotto tampoco están, por la lesión de Ale Galán.

    Así que el domingo, el Dubái P1 tendrá campeones nuevos.

    ## El número uno ya es suyo

    Lo de Dubái no toca lo importante. Coello y Tapia ya se aseguraron el número uno del año [en Kuwait](/actualidad/coello-tapia-campeones-major-kuwait-numero-uno-2026/), hace diez días.

    Después, cada uno con su camiseta, jugaron [la final del Mundial de Qatar](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/). Tapia ganó su partido, con Chingotto. Coello, el suyo, con Coki Nieto.

    Dubái iba a ser el reencuentro. Tendrá que esperar.

    ## Quién se encuentra el hueco

    Chozas y Rubini ganaron este martes su primer partido: 6-2 y 6-4 a Fernández y Cepero. El miércoles les tocaban los número uno. Ahora jugarán contra la pareja lucky loser.

    En ese cuarto del cuadro, los primeros cabezas de serie pasan a ser Guerrero y Leal (6). Javi Leal, campeón del mundo el sábado con España. Y la pareja que [ganó a Coello y Tapia](/actualidad/javi-leal-sustituye-galan-mundial-qatar/) en las semifinales de Pretoria, este verano: 7-5 y 7-5.

    En toda la mitad de arriba, los favoritos pasan a ser Stupaczuk y Sanz (3). En la de abajo esperan Lebrón y Augsburger (2), que ahora son la pareja con más ranking del torneo.

    ## Lo que queda de año

    Después de Dubái, dos citas: el Major de México, del 23 al 29 de noviembre, y las Finals de Barcelona, del 10 al 13 de diciembre.

    Coello y Tapia volverán. Esta semana, Dubái es de otros.

en:
  slug: coello-tapia-out-dubai-p1-tapia-injury
  titulo: "Coello and Tapia pull out of the Dubai P1 after an injury to Tapia"
  entradilla: "Agustín Tapia is injured and the world number ones won't play in Dubai, where they were going for a third straight title. A lucky loser pair will take their place in the draw."
  seo_titulo: "Coello and Tapia out of the Dubai P1 with a Tapia injury"
  seo_descripcion: "Agustín Tapia is injured, so he and Arturo Coello won't play the Dubai P1, where they were chasing a third straight title. A lucky loser pair comes in."
  palabra_clave: "Coello Tapia Dubai P1"
  cuerpo: |
    > **Update, 11 November.** The lucky loser pair are Marcos González and Diego García. On Wednesday they [beat Chozas and Rubini](/en/news/roglan-aragon-comeback-navarro-di-nenno-dubai-p1/) and on Thursday they play Libaak and Alfonso in the last 16.

    Coello and Tapia won't play the Dubai P1.

    Agustín Tapia is injured. The tournament announced it tonight, along with the updated men's main draw.

    Nobody has said what the injury is. Or how long he'll be out.

    Their place will go to a lucky loser pair. One of the pairs that lost in qualifying and now gets a second chance.

    Get well soon, Agustín.

    ## Going for three in a row

    Dubai is their tournament. They won it in 2024 and in 2025.

    Both times in the final against Galán and Chingotto. And both times with an almost identical score: 6-4, 6-3 the first year, 6-3, 6-4 the second.

    Galán and Chingotto aren't there this year either, because of Ale Galán's injury.

    So on Sunday, the Dubai P1 will have new champions.

    ## Number one is already theirs

    Dubai doesn't touch what matters. Coello and Tapia already sealed the year-end number one [in Kuwait](/en/news/coello-tapia-win-kuwait-major-year-end-number-one-2026/), ten days ago.

    Then, each in his own shirt, they played [the World Cup final in Qatar](/en/news/padel-world-cup-2026-final-spain-champions-argentina/). Tapia won his match, with Chingotto. Coello won his, with Coki Nieto.

    Dubai was going to be the reunion. It will have to wait.

    ## Who finds the gap

    Chozas and Rubini won their first match on Tuesday: 6-2, 6-4 against Fernández and Cepero. On Wednesday they were due to face the world number ones. Now they'll play the lucky loser pair.

    In that quarter of the draw, the top seeds are now Guerrero and Leal (6). Javi Leal, a world champion with Spain on Saturday. And the pair who [beat Coello and Tapia](/en/news/javi-leal-replaces-galan-padel-world-cup-qatar/) in the Pretoria semi-finals this summer: 7-5, 7-5.

    In the whole top half, the favourites are now Stupaczuk and Sanz (3). In the bottom half wait Lebrón and Augsburger (2), now the highest-ranked pair in the tournament.

    ## What's left of the year

    After Dubai, two events remain: the Mexico Major, from 23 to 29 November, and the Finals in Barcelona, from 10 to 13 December.

    Coello and Tapia will be back. This week, Dubai belongs to someone else.

