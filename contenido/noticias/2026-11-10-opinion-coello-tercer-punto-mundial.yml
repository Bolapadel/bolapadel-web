es:
  slug: coello-tercer-punto-mundial-padel-2026-opinion
  titulo: "Por qué guardar a Coello para el tercer punto tenía sentido"
  entradilla: "Antes de la final del Mundial, mucha gente no entendía que Juanjo Gutiérrez dejara a Coello para el último partido. Yo sí. Lo escribí en un WhatsApp y nunca lo conté aquí."
  seo_titulo: "Coello en el tercer punto: por qué tenía sentido"
  seo_descripcion: "Coello en el tercer punto de la final del Mundial de pádel: mi opinión, escrita antes del partido, sobre la decisión de Juanjo Gutiérrez que tanto se criticó."
  palabra_clave: "Coello tercer punto"
  cuerpo: |
    Un buen amigo, seguidor de Bola Pádel, me ha dicho que no he dado mi opinión sobre lo de Coello.

    Tiene razón.

    Contamos la final. Contamos lo que dijeron Coello, Paquito y Juanjo en la sala de prensa. Pero yo no dije lo que pensaba.

    Y lo pensaba antes de que empezara.

    ## Lo que escribí antes de la final

    El sábado, con las parejas ya anunciadas, mandé esto por WhatsApp:

    <figure><img src="/img/noticias/opinion-coello-whatsapp-luis.jpg" alt="Mensaje de WhatsApp de Luis González antes de la final: «Pues a mí no me parece mala idea. En el primero la bola va a salir y para contraponer a Leo tienes a otro pegador, ya depende de Juan si controla el partido. El segundo es tirarlo. En el tercero si llegas tienes a Coello»" width="1105" height="856" loading="lazy"><figcaption>El mensaje, a las 15:22. Imagen: Luis González</figcaption></figure>

    Lo pongo tal cual. Sin arreglarlo.

    ## Por qué no me parecía ninguna locura

    En redes, mucha gente lo veía al revés. Y lo entiendo.

    Guardar al número uno del mundo para el último partido da miedo. Si pierdes los dos primeros, Coello se queda en el banquillo. Mirando.

    Ni él lo tenía claro. [Lo dijo después en la sala de prensa](/actualidad/juanjo-gutierrez-coello-paquito-mundial-padel-2026-declaraciones/).

    Yo partía de una premisa: Tapia y Chingotto iban a jugar juntos el segundo partido. Y sin Galán, ese partido era casi imposible de sacar.

    Entonces había que ir a buscar el primero y el tercero.

    Y no era ningún secreto. Dos semanas antes de la final, Juanjo ya lo había contado en [un programa de VeinteDiez](https://www.youtube.com/watch?v=5snxoYnI4Fw), con Rodri Ovide, el seleccionador argentino, delante: la idea era poner a Paquito en el segundo y jugárselo en el tercero.

    Las parejas españolas, para mí, estaban claras. La única duda era si acompañaría a Paquito Jon Sanz o Mike Yanguas.

    Yo lo miraba partido a partido.

    **El primero.** Enfrente estaba Leo Augsburger, que vive del remate. Para eso tenías a Aimar Goñi, otro pegador. Y a Juan Lebrón para llevar el partido. Costó: perdieron el primer set. Pero lo ganaron. 5-7, 7-5, 6-2.

    **El segundo.** Enfrente, Tapia y Chingotto. La mejor pareja del Mundial sobre el papel. Lo de «tirarlo» suena feo, y no va por Paquito ni por Jon Sanz. Va por lo que tenían al otro lado. Ganó Argentina, 6-1, 6-2.

    **El tercero.** Si llegabas, tenías a Coello. Llegaron. Coello y Coki Nieto ganaron 6-3, 6-2 a Libaak y Alfonso. [España, campeona del mundo](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/).

    ## ¿Y Coello en el primero?

    ¿Podías poner a Coello y Coki en el primero? Sí.

    Pero para mí no tenía sentido. Esto va de ganar dos partidos. Y Coello era la bala de plata de Juanjo.

    Y piensa en la otra opción. Si nos daba miedo que un debutante jugara el primer partido, imagina haberlo puesto en el tercero. A todo o nada.

    <figure><img src="/img/noticias/mundial-2026-final-coello-grito.jpg" alt="Arturo Coello celebra un punto con un grito en la final del Mundial de Qatar" width="1400" height="1750" loading="lazy"><figcaption>Arturo Coello, en la final del Mundial. Imagen: Federación Española de Pádel</figcaption></figure>

    ## Hace dos años, al revés

    En la final de 2024, también en Doha, Coello jugó el primer partido. Con Coki. Lo ganaron 6-1, 6-2.

    Y España perdió el Mundial en el tercero. En el tie-break del último set.

    Esta vez, Juanjo puso a su mejor jugador donde se deciden las finales.

    Para mí, el planteamiento tenía todo el sentido del mundo.

    ## El mérito no es mío

    Acertar en un WhatsApp no cuesta nada. Si fallas, no se entera nadie.

    Juanjo se la jugó delante de todo el mundo. Con un Mundial en juego. Y con mucha gente diciéndole que se equivocaba.

    Ese es el mérito. Y es suyo.

    Yo solo quería decir lo que pensaba.

    Ya está dicho.

en:
  slug: coello-third-point-padel-world-cup-2026-opinion
  titulo: "Why saving Coello for the third point made sense"
  entradilla: "Before the World Cup final, a lot of people couldn't understand why Juanjo Gutiérrez kept Coello for the last match. I could. I wrote it in a WhatsApp message and never said it here."
  seo_titulo: "Coello in the third point: why it made sense"
  seo_descripcion: "Coello in the third point of the Padel World Cup final: my view, written before the match, on Juanjo Gutiérrez's much-criticised decision."
  palabra_clave: "Coello third point"
  cuerpo: |
    A good friend who follows Bola Pádel told me I never gave my opinion on the Coello thing.

    He's right.

    We covered the final. We covered what Coello, Paquito and Juanjo said in the press room. But I never said what I thought.

    And I thought it before it started.

    ## What I wrote before the final

    On Saturday, with the pairs already announced, I sent this on WhatsApp:

    <figure><img src="/img/noticias/opinion-coello-whatsapp-luis.jpg" alt="Luis González's WhatsApp message before the final, in Spanish, about Spain's line-up" width="1105" height="856" loading="lazy"><figcaption>The message, at 15:22. Image: Luis González</figcaption></figure>

    In English:

    > Honestly, I don't think it's a bad idea.
    >
    > In the first one the ball is going to fly, and to counter Leo you've got another big hitter; then it's up to Juan whether he controls the match.
    >
    > The second one, you write off.
    >
    > In the third, if you get there, you've got Coello.

    I'm copying it as it was. Without tidying it up.

    ## Why it didn't seem crazy to me

    On social media, a lot of people saw it the other way round. And I get it.

    Saving the world number one for the last match is scary. If you lose the first two, Coello stays on the bench. Watching.

    Even he wasn't sure. [He said so afterwards in the press room](/en/news/juanjo-gutierrez-coello-paquito-padel-world-cup-2026-reaction/).

    I started from one premise: Tapia and Chingotto were going to play the second match together. And without Galán, that match was almost impossible to win.

    So you had to go after the first and the third.

    And it was no secret. Two weeks before the final, Juanjo had already said it on [a VeinteDiez show](https://www.youtube.com/watch?v=5snxoYnI4Fw), with Rodri Ovide, Argentina's head coach, right there: the idea was to put Paquito in the second and go all in on the third.

    The Spanish pairs, to me, were clear. The only question was whether Jon Sanz or Mike Yanguas would partner Paquito.

    I looked at it match by match.

    **The first.** Across the net was Leo Augsburger, who lives off his smash. For that you had Aimar Goñi, another big hitter. And Juan Lebrón to run the match. It was hard: they lost the first set. But they won it. 5-7, 7-5, 6-2.

    **The second.** Across the net, Tapia and Chingotto. The best pair at the World Cup on paper. "Write it off" sounds harsh, and it's not about Paquito or Jon Sanz. It's about who they had on the other side. Argentina won, 6-1, 6-2.

    **The third.** If you got there, you had Coello. They got there. Coello and Coki Nieto beat Libaak and Alfonso 6-3, 6-2. [Spain, world champions](/en/news/padel-world-cup-2026-final-spain-champions-argentina/).

    ## What about Coello in the first?

    Could you put Coello and Coki in the first match? Yes.

    But to me it made no sense. This is about winning two matches. And Coello was Juanjo's silver bullet.

    And think about the other option. If we were scared of a debutant playing the first match, imagine putting him in the third. All or nothing.

    <figure><img src="/img/noticias/mundial-2026-final-coello-grito.jpg" alt="Arturo Coello roars after winning a point in the World Cup final in Qatar" width="1400" height="1750" loading="lazy"><figcaption>Arturo Coello, in the World Cup final. Image: Spanish Padel Federation</figcaption></figure>

    ## Two years ago, the other way round

    In the 2024 final, also in Doha, Coello played the first match. With Coki. They won it 6-1, 6-2.

    And Spain lost the World Cup in the third. In the tie-break of the final set.

    This time, Juanjo put his best player where finals are decided.

    To me, the plan made all the sense in the world.

    ## The credit isn't mine

    Getting it right in a WhatsApp message costs nothing. If you're wrong, nobody finds out.

    Juanjo took the risk in front of everyone. With a World Cup at stake. And with a lot of people telling him he was wrong.

    That's the credit. And it's his.

    I just wanted to say what I thought.

    Now it's said.

