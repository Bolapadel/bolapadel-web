es:
  slug: chingotto-galan-baja-major-kuwait-lesion
  titulo: "Chingotto y Galán son baja para el Major de Kuwait por lesión de Ale Galán"
  entradilla: "Ale Galán está lesionado y la segunda pareja del ranking no jugará en Kuwait. Justo donde, hace un año, ganaron el primer Mundial de parejas de la FIP."
  seo_titulo: "Chingotto y Galán, baja en el Major de Kuwait por lesión"
  seo_descripcion: "Ale Galán se lesiona y él y Fede Chingotto se pierden el Major de Kuwait. Volvían como campeones del Mundial de parejas y a nueve días del Mundial de Qatar."
  palabra_clave: "Galán Major de Kuwait"
  cuerpo: |
    Lo contó él mismo. Una historia en Instagram, este sábado por la noche.

    Ale Galán está lesionado. No jugará el Major de Kuwait.

    Y con él se queda fuera Fede Chingotto. La segunda pareja del ranking no estará en el tercer Major del año.

    Galán no ha dicho qué lesión tiene. Tampoco cuánto tiempo estará parado. Solo que se lo pierde y una frase: «Espero volver pronto a la pista».

    Nosotros también.

    ## Volvían como campeones del mundo

    Kuwait no era un torneo más para ellos.

    En noviembre del año pasado ganaron allí el primer Mundial de parejas de la FIP. En la final, contra Coello y Tapia: 2-6, 7-5 y 6-2.

    Este año volvían como cabezas de serie número 2. Su sitio en el cuadro lo ocupará una pareja que llega de la previa.

    ## Un año de finales

    Lo que pierde el torneo se entiende con dos números.

    Catorce finales en 2026. Siete títulos: Gijón, Miami, Newgiza, Asunción, Buenos Aires, Pretoria y Madrid.

    Madrid fue el último, a principios de septiembre. Después llegaron la final de París, los cuartos de Róterdam y las semifinales de Düsseldorf y [Milán](/actualidad/augsburger-lebron-remontada-galan-chingotto-milano/).

    Los dos Majors del año, Italia y París, terminaron igual. En la final. Contra Coello y Tapia.

    Kuwait era la tercera oportunidad. Tendrá que esperar.

    ## El Mundial, a nueve días

    Hay otra fecha marcada en rojo. Del 2 al 7 de noviembre, el Mundial de Qatar.

    Galán está en [la lista de España](/actualidad/convocatoria-espana-mundial-padel-2026/). Chingotto, en [la de Argentina](/actualidad/convocatoria-argentina-mundial-padel-2026/).

    Hoy no se sabe nada más.

    El cuadro principal de Kuwait arranca el martes 27, en The Arena Kuwait. La final, el sábado 31.

    Será el primer Major del año sin Chingalán en la final.

en:
  slug: chingotto-galan-out-kuwait-major-injury
  titulo: "Chingotto and Galán pull out of the Kuwait Major after an injury to Ale Galán"
  entradilla: "Ale Galán is injured and the second-ranked pair won't play in Kuwait. The very place where, a year ago, they won the first FIP World Cup Pairs."
  seo_titulo: "Chingotto and Galán out of the Kuwait Major through injury"
  seo_descripcion: "Ale Galán is injured, so he and Fede Chingotto miss the Kuwait Major. They were back as World Cup Pairs champions, nine days before the World Cup in Qatar."
  palabra_clave: "Galán Kuwait Major"
  cuerpo: |
    He announced it himself. An Instagram story, on Saturday night.

    Ale Galán is injured. He won't play the Kuwait Major.

    And Fede Chingotto goes out with him. The second-ranked pair will miss the third Major of the year.

    Galán hasn't said what the injury is. Or how long he'll be out. Only that he'll miss it, and one line: "I hope to be back on court soon."

    So do we.

    ## Back as world champions

    Kuwait wasn't just another tournament for them.

    Last November they won the first FIP World Cup Pairs there. In the final, against Coello and Tapia: 2-6, 7-5, 6-2.

    This year they were back as the number 2 seeds. Their place in the draw will go to a pair coming through qualifying.

    ## A year of finals

    Two numbers explain what the tournament is losing.

    Fourteen finals in 2026. Seven titles: Gijón, Miami, Newgiza, Asunción, Buenos Aires, Pretoria and Madrid.

    Madrid was the last one, in early September. Since then: the final in Paris, the quarter-finals in Rotterdam and the semi-finals in Düsseldorf and [Milan](/en/news/augsburger-lebron-comeback-galan-chingotto-milano/).

    The year's two Majors, Italy and Paris, ended the same way. In the final. Against Coello and Tapia.

    Kuwait was the third chance. It will have to wait.

    ## The World Cup, nine days away

    There's another date circled in red. From 2 to 7 November, the World Cup in Qatar.

    Galán is in [Spain's squad](/en/news/spain-squad-padel-world-cup-2026/). Chingotto, in [Argentina's](/en/news/argentina-squad-padel-world-cup-2026/).

    Nothing more is known today.

    The Kuwait main draw starts on Tuesday 27, at The Arena Kuwait. The final is on Saturday 31.

    It will be the first Major of the year without Chingalán in the final.

