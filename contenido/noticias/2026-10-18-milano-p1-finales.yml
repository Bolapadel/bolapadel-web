  cuerpo: |
    Domingo de finales en Milán. Y el cuadro ha dejado lo que tenía que dejar.

    ## La final masculina

    Coello y Tapia, primeros cabezas de serie, resolvieron su semifinal sin dramas: 6-4 y 6-3 a Jon Sanz y Franco Stupaczuk.

    No es un rival cualquiera. Es la tercera vez en tres semanas que se cruzan. Las dos anteriores fueron finales, en Rotterdam y en Düsseldorf. Las dos acabaron igual.

    Enfrente estarán Leo Augsburger y Juan Lebrón. Lo suyo fue otra película: perdieron el primer set 0-6 ante Galán y Chingotto. Y luego ganaron los dos siguientes, 6-2 y 6-2.

    En la Race, Coello y Tapia mandan con 13.820 puntos. Augsburger y Lebrón son la tercera pareja, con 5.925.

    ## La final femenina

    Abre el domingo, a las 15:00. Ari Sánchez y Andrea Ustero contra Paula Josemaría y Bea González.

    Es la misma final que se jugó hace dos semanas en Rotterdam. Aquel día ganaron Sánchez y Ustero: 6-4, 6-4.

    Para llegar aquí, Sánchez y Ustero tumbaron a las primeras cabezas de serie, Gemma Triay y Delfina Brea (6-1, 6-4). Josemaría y González sufrieron más: 6-2 y 7-6 ante Martina Calvo y Claudia Fernández.

    ## Las semifinales, de un vistazo

