    | Men | Augsburger / Lebrón | Galán / Chingotto | 0-6 · 6-2 · 6-2 |
    | Women | Sánchez / Ustero | Triay / Brea | 6-1 · 6-4 |
    | Women | Josemaría / González | Calvo / Fernández | 6-2 · 7-6 |

    Two finals. One of them is a rematch.
