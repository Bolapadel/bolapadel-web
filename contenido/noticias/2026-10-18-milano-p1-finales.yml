  cuerpo: |
    Finals Sunday in Milan. And the draw delivered what it promised.

    ## The men's final

    Top seeds Coello and Tapia had no trouble in their semi: 6-4, 6-3 against Jon Sanz and Franco Stupaczuk.

    That's no random opponent. It was the third time in three weeks these two pairs met. The previous two were finals, in Rotterdam and Düsseldorf. Both ended the same way.

    Across the net: Leo Augsburger and Juan Lebrón. Their semi was a different story. They lost the first set 0-6 to Galán and Chingotto. Then they won the next two, 6-2 and 6-2.

    In the Race, Coello and Tapia lead with 13,820 points. Augsburger and Lebrón are the third pair, with 5,925.

    ## The women's final

    It opens the day at 3 pm. Ari Sánchez and Andrea Ustero against Paula Josemaría and Bea González.

    It's a rematch of the Rotterdam final two weeks ago. Sánchez and Ustero won that one 6-4, 6-4.

    To get here, Sánchez and Ustero knocked out the top seeds, Gemma Triay and Delfina Brea (6-1, 6-4). Josemaría and González had it harder: 6-2, 7-6 against Martina Calvo and Claudia Fernández.

    ## Semifinals at a glance

