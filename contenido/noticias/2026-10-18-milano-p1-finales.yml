    | Femenino | Sánchez / Ustero | Triay / Brea | 6-1 · 6-4 |
    | Femenino | Josemaría / González | Calvo / Fernández | 6-2 · 7-6 |

    Dos finales. Una de ellas, con revancha incluida.

