es:
  slug: hexagon-world-series-2027-sedes-equipos-formato
  titulo: "La Hexagon sale de Madrid: cuatro sedes, ocho equipos y adiós a los sets"
  entradilla: "La Hexagon Cup pasa a ser Hexagon World Series. En 2027 empieza en Madrid y termina en Abu Dhabi, con ocho equipos y un formato sin juegos ni sets: al mejor de cinco super tie-breaks."
  seo_titulo: "Hexagon World Series 2027: sedes, equipos y nuevo formato"
  seo_descripcion: "Hexagon World Series 2027: Madrid, Norteamérica, Escandinavia y Abu Dhabi, ocho equipos y partidos al mejor de cinco super tie-breaks. Adiós a los sets."
  palabra_clave: "Hexagon World Series 2027"
  cuerpo: |
    Nació en 2024. Tres ediciones, las tres en Madrid.

    En 2027 sale de casa.

    La Hexagon Cup pasa a llamarse Hexagon World Series. Cuatro pruebas, tres continentes. Y un circuito por equipos oficial de la FIP. El primero.

    Lo presentaron este miércoles en Abu Dhabi. Con Enrique Buenaventura, el fundador de la Hexagon Cup, y Gary Davidson. Son los dos cofundadores del nuevo circuito.

    ## El calendario

    - **Madrid** (Caja Mágica): del 21 al 24 de enero.
    - **Norteamérica**: marzo.
    - **Escandinavia**: junio.
    - **Abu Dhabi**: del 21 al 24 de octubre.

    Las ciudades de Norteamérica y Escandinavia todavía no se conocen.

    Madrid abre, como siempre. Abu Dhabi cierra. Allí se coronará al primer campeón de la temporada.

    ## Siete equipos y uno por desvelar

    Siguen los dos que se han repartido los títulos:

    - **AD/vantage Padel Team**, de Andy Murray, Anthony Joshua, Dani Vallverdú y Arran Yentob. Campeón en 2024 y 2026.
    - **KRÜ Padel by Taktika**, del Kun Agüero, con Gabriel Pérez Krieb y Edu Conde. Campeón en 2025.

    En la final de febrero se vieron las caras. Ganó el equipo de Murray, 2-0.

    Y estos cinco:

    - **ElevenEleven Team USA**, de Eva Longoria.
    - **Rafa Nadal Academy Team**.
    - **Team Bella Puerto Rico**, de María Esteve y Carlos López-Lay.
    - **X Padel**, del piloto de Fórmula 1 Pierre Gasly y el empresario Loïc Féry.
    - **Dalma Team**, que es nuevo. Representará a Abu Dhabi toda la temporada.

    El octavo se anunciará aparte.

    Cada equipo lleva una pareja masculina y una femenina. Los dos partidos valen lo mismo. Y los premios son iguales para ellos y para ellas.

    Los jugadores de cada equipo se irán conociendo en las próximas semanas.

    ## Adiós a los sets

    Aquí está lo gordo.

    No habrá juegos. No habrá sets.

    Cada partido se juega al mejor de cinco super tie-breaks. Los cuatro primeros, a 10 puntos. El quinto, si hace falta, a 6.

    ¿Y si un super tie-break llega al 10-10? Star Point. Un punto y se acabó.

    Lo han diseñado con la FIP. La idea, según la organización: partidos más dinámicos y más momentos decisivos.

    ## Cómo se gana

    En cada prueba, dos grupos de cuatro equipos. Cada cruce, un partido masculino y uno femenino. Después, una ronda final según la posición de cada uno.

    Lo que no cuentan todavía es cómo se desempata un cruce que acabe 1-1.

    Y por primera vez, las cuatro pruebas suman para una clasificación general:

    | Puesto | Puntos |
    |---|---|
    | 1.º | 25 |
    | 2.º | 18 |
    | 3.º | 15 |
    | 4.º | 12 |
    | 5.º | 9 |
    | 6.º | 6 |
    | 7.º | 3 |
    | 8.º | 0 |

    El que más sume al acabar en Abu Dhabi será el campeón del mundo por equipos de la Hexagon World Series.

    ## Tres meses

    En 2026 la Hexagon Cup reunió a más de 37.000 espectadores en Madrid.

    En enero vuelve a la Caja Mágica. Con el formato nuevo.

    Habrá a quien le encante. Y a quien le cueste reconocer ahí el pádel de siempre.

    Lo veremos en Madrid. Del 21 al 24 de enero.

en:
  slug: hexagon-world-series-2027-venues-teams-format
  titulo: "Hexagon leaves Madrid: four venues, eight teams and goodbye to sets"
  entradilla: "The Hexagon Cup becomes the Hexagon World Series. In 2027 it starts in Madrid and ends in Abu Dhabi, with eight teams and a format with no games or sets: best of five super tie-breaks."
  seo_titulo: "Hexagon World Series 2027: venues, teams and new format"
  seo_descripcion: "Hexagon World Series 2027: Madrid, North America, Scandinavia and Abu Dhabi, eight teams and matches played as best of five super tie-breaks. No more sets."
  palabra_clave: "Hexagon World Series 2027"
  cuerpo: |
    It was born in 2024. Three editions, all three in Madrid.

    In 2027 it leaves home.

    The Hexagon Cup becomes the Hexagon World Series. Four events, three continents. And an official FIP team circuit. The first one.

    It was presented this Wednesday in Abu Dhabi. With Enrique Buenaventura, the founder of the Hexagon Cup, and Gary Davidson. They are the two co-founders of the new circuit.

    ## The calendar

    - **Madrid** (Caja Mágica): 21 to 24 January.
    - **North America**: March.
    - **Scandinavia**: June.
    - **Abu Dhabi**: 21 to 24 October.

    The cities in North America and Scandinavia haven't been announced yet.

    Madrid opens, as always. Abu Dhabi closes. That's where the first season champion will be crowned.

    ## Seven teams and one still to be revealed

    The two that have shared the titles are back:

    - **AD/vantage Padel Team**, backed by Andy Murray, Anthony Joshua, Dani Vallverdú and Arran Yentob. Champions in 2024 and 2026.
    - **KRÜ Padel by Taktika**, led by Kun Agüero, with Gabriel Pérez Krieb and Edu Conde. Champions in 2025.

    They met in February's final. Murray's team won, 2-0.

    And these five:

    - **ElevenEleven Team USA**, backed by Eva Longoria.
    - **Rafa Nadal Academy Team**.
    - **Team Bella Puerto Rico**, backed by María Esteve and Carlos López-Lay.
    - **X Padel**, backed by Formula 1 driver Pierre Gasly and businessman Loïc Féry.
    - **Dalma Team**, the new one. It will represent Abu Dhabi all season.

    The eighth will be announced separately.

    Each team has a men's pair and a women's pair. Both matches are worth the same. And prize money is equal for men and women.

    Each team's players will be revealed over the coming weeks.

    ## Goodbye to sets

    Here's the big one.

    No games. No sets.

    Every match is played as the best of five super tie-breaks. The first four, to 10 points. The fifth, if needed, to 6.

    And if a super tie-break reaches 10-10? Star Point. One point and it's over.

    It was designed with the FIP. The idea, according to the organisers: more dynamic matches and more decisive moments.

    ## How you win it

    At each event, two groups of four teams. Each tie, one men's match and one women's match. Then a final round based on each team's position.

    What they haven't explained yet is how a tie that ends 1-1 is decided.

    And for the first time, the four events count towards an overall standings table:

    | Position | Points |
    |---|---|
    | 1st | 25 |
    | 2nd | 18 |
    | 3rd | 15 |
    | 4th | 12 |
    | 5th | 9 |
    | 6th | 6 |
    | 7th | 3 |
    | 8th | 0 |

    Whoever has the most points after Abu Dhabi will be the Hexagon World Series team world champion.

    ## Three months

    In 2026 the Hexagon Cup drew more than 37,000 spectators in Madrid.

    In January it returns to the Caja Mágica. With the new format.

    Some will love it. Others will struggle to recognise the padel they know.

    We'll see in Madrid. From 21 to 24 January.

