es:
  slug: convocatoria-argentina-mundial-padel-2026
  titulo: "Estos son los 16 de Argentina para el Mundial de Qatar"
  entradilla: "Ocho jugadores y ocho jugadoras. Ellos defienden el título y van a por el tercero seguido. Ellas quieren la revancha después de dos finales perdidas ante España."
  seo_titulo: "Convocatoria de Argentina para el Mundial de pádel 2026"
  seo_descripcion: "Convocatoria de Argentina para el Mundial de pádel 2026 en Doha: Tapia, Chingotto y Augsburger lideran a los chicos; Brea, Jensen y Osoro, a las chicas."
  palabra_clave: "Argentina Mundial de pádel 2026"
  cuerpo: |
    Once días.

    Del 2 al 7 de noviembre, Doha vuelve a ser la sede del Mundial. La misma ciudad donde Argentina fue campeona hace dos años.

    La Asociación Pádel Argentino ya tiene a los suyos. Ocho y ocho.

    ## Ellos: a por el tercero seguido

    Los dirigen Gaby Reca y Rodri Ovide. Este es el equipo, con su puesto en el ranking FIP de esta semana:

    | Jugador | Puesto |
    |---|---|
    | Agustín Tapia | 1 |
    | Federico Chingotto | 3 |
    | Leandro Augsburger | 6 |
    | Franco Stupaczuk | 7 |
    | Martín Di Nenno | 12 |
    | Gonzalo Alfonso | 21 |
    | Maximiliano Arce | 25 |
    | Valentino Libaak | 30 |

    Tapia comparte el número 1 con Arturo Coello. Su compañero. En Doha estarán cada uno a un lado de la red.

    Seis repiten del equipo campeón de 2024.

    Hay dos caras nuevas. Maxi Arce, salteño, zurdo, juega en el drive. Entra por Sanyo Gutiérrez. Gonzalo Alfonso, de General Cabrera, juega en el revés. Entra por Álex Chozas. Para los dos es su primer Mundial con la selección absoluta.

    Y luego está Libaak.

    Es el que menos puntos tiene de los ocho. Pero el último Mundial se decidió en su partido. Él y Augsburger ganaron el punto final ante Yanguas y Paquito Navarro. 2-1 a España.

    Esta semana [han estrenado marca propia juntos](/actualidad/augsburger-libaak-nuevo-logo-siux/).

    Argentina suma doce títulos mundiales masculinos. Los dos últimos, seguidos: Dubái 2022 y Doha 2024.

    <figure><img src="/img/noticias/mundial-2026-convocatoria-argentina-femenina.jpg" alt="Las ocho jugadoras convocadas por Argentina para el Mundial de Qatar 2026" width="1201" height="1630" loading="lazy"><figcaption>Imagen: Asociación Pádel Argentino</figcaption></figure>

    ## Ellas: a por la revancha

    Esta es su lista, también con el ranking FIP de esta semana:

    | Jugadora | Puesto |
    |---|---|
    | Delfina Brea | 1 |
    | Claudia Jensen | 11 |
    | Aranzazu Osoro | 17 |
    | Martina Fassio | 23 |
    | Virginia Riera | 39 |
    | Julieta Bidahorria | 42 |
    | María Laura Ferreyra | 88 |
    | Victoria Vílchez | 357 |

    Delfi Brea es la número 1 del mundo. Lo comparte con Gemma Triay, su compañera. Igual que Tapia y Coello: en Doha, cada una con su bandera.

    La novedad es Victoria Vílchez. Tiene 16 años y es de Río Cuarto, en Córdoba.

    Hace unas semanas ganó el oro en los Juegos Suramericanos de Santa Fe, con María Belén Mosca. Era la primera vez que el pádel repartía medallas en esos Juegos. Ahora entra en la selección y sale Daiara Valenzuela.

    Aquí la historia es otra.

    España ha ganado los seis últimos Mundiales femeninos. Los dos últimos, en la final contra Argentina.

    Dos finales. Dos derrotas. Esa espina sigue ahí.

    ## Once días

    Los 16 de España [ya los conoces](/actualidad/convocatoria-espana-mundial-padel-2026/).

    Ahora ya están todos.

    Ellos defienden. Ellas quieren la revancha.

en:
  slug: argentina-squad-padel-world-cup-2026
  titulo: "These are Argentina's 16 for the World Cup in Qatar"
  entradilla: "Eight men and eight women. The men are defending the title and going for a third in a row. The women want revenge after two finals lost to Spain."
  seo_titulo: "Argentina's squad for the 2026 Padel World Cup"
  seo_descripcion: "Argentina's squad for the 2026 Padel World Cup in Doha: Tapia, Chingotto and Augsburger lead the men's team; Brea, Jensen and Osoro lead the women's."
  palabra_clave: "Argentina 2026 Padel World Cup"
  cuerpo: |
    Eleven days.

    From 2 to 7 November, Doha hosts the World Cup again. The same city where Argentina were crowned champions two years ago.

    The Argentine Padel Association already has its players. Eight and eight.

    ## The men: going for a third in a row

    Gaby Reca and Rodri Ovide are in charge. This is the team, with their position in this week's FIP ranking:

    | Player | Rank |
    |---|---|
    | Agustín Tapia | 1 |
    | Federico Chingotto | 3 |
    | Leandro Augsburger | 6 |
    | Franco Stupaczuk | 7 |
    | Martín Di Nenno | 12 |
    | Gonzalo Alfonso | 21 |
    | Maximiliano Arce | 25 |
    | Valentino Libaak | 30 |

    Tapia shares number 1 with Arturo Coello. His partner. In Doha they'll be on opposite sides of the net.

    Six of them were part of the 2024 champion team.

    There are two new faces. Maxi Arce, from Salta, left-handed, plays on the forehand side. He replaces Sanyo Gutiérrez. Gonzalo Alfonso, from General Cabrera, plays on the backhand side. He replaces Álex Chozas. For both, it's their first World Cup with the senior team.

    And then there's Libaak.

    He has the fewest points of the eight. But the last World Cup was decided in his match. He and Augsburger won the deciding point against Yanguas and Paquito Navarro. 2-1 over Spain.

    This week they [launched their own brand together](/en/news/augsburger-libaak-new-logo-siux/).

    Argentina have twelve men's world titles. The last two in a row: Dubai 2022 and Doha 2024.

    <figure><img src="/img/noticias/mundial-2026-convocatoria-argentina-femenina.jpg" alt="The eight women selected by Argentina for the 2026 World Cup in Qatar" width="1201" height="1630" loading="lazy"><figcaption>Image: Argentine Padel Association</figcaption></figure>

    ## The women: out for revenge

    This is their list, also with this week's FIP ranking:

    | Player | Rank |
    |---|---|
    | Delfina Brea | 1 |
    | Claudia Jensen | 11 |
    | Aranzazu Osoro | 17 |
    | Martina Fassio | 23 |
    | Virginia Riera | 39 |
    | Julieta Bidahorria | 42 |
    | María Laura Ferreyra | 88 |
    | Victoria Vílchez | 357 |

    Delfi Brea is world number 1. She shares it with Gemma Triay, her partner. Just like Tapia and Coello: in Doha, each with her own flag.

    The new name is Victoria Vílchez. She's 16 and from Río Cuarto, in Córdoba.

    A few weeks ago she won gold at the South American Games in Santa Fe, with María Belén Mosca. It was the first time padel awarded medals at those Games. Now she joins the national team and Daiara Valenzuela misses out.

    Here the story is different.

    Spain have won the last six women's World Cups. The last two in a final against Argentina.

    Two finals. Two defeats. That thorn is still there.

    ## Eleven days

    You [already know Spain's 16](/en/news/spain-squad-padel-world-cup-2026/).

    Now they're all set.

    The men are defending. The women want revenge.

