es:
  slug: lebron-augsburger-cuartos-dubai-p1-arce-tello
  titulo: "Lebrón y Augsburger ganan a Víctor Ruiz y Rodrigo y jugarán contra Arce y Tello"
  entradilla: "Sin Coello y Tapia ni Galán y Chingotto, son la pareja con más ranking del Dubái P1. El viernes, en cuartos, los finalistas de Kuwait."
  seo_titulo: "Lebrón y Augsburger, a cuartos en Dubái contra Arce y Tello"
  seo_descripcion: "Lebrón y Augsburger ganan 6-2 y 6-4 a Víctor Ruiz y Rodrigo y jugarán los cuartos del Dubái P1 contra Arce y Tello, a los que han ganado tres veces este año."
  palabra_clave: "Lebrón y Augsburger Dubái P1"
  cuerpo: |
    Lebrón y Augsburger ya están en cuartos del Dubái P1.

    Hoy han ganado 6-2 y 6-4 a Víctor Ruiz y Facundo Rodrigo. En una hora y nueve minutos.

    El miércoles les costó más. Perdieron el primer set con Castaño y Pol Hernández y remontaron: 4-6, 6-3 y 6-3.

    ## Los que más ranking tienen

    En Dubái no están Coello y Tapia, [por la lesión de Tapia](/actualidad/coello-tapia-baja-dubai-p1-lesion-tapia/). Tampoco Galán y Chingotto.

    Sin los dos primeros, Lebrón y Augsburger son la pareja con más ranking del cuadro. Cabezas de serie número 2.

    Este año han jugado cuatro finales de Premier. Las cuatro, contra Coello y Tapia. Ganaron una: Bruselas, en abril.

    En Dubái, Coello y Tapia no estarán al otro lado.

    ## Del Mundial a Dubái

    El sábado, en [la final del Mundial](/actualidad/mundial-padel-2026-final-espana-campeona-argentina/), estaban en lados distintos de la red. Lebrón y Goñi ganaron a Augsburger y Di Nenno: 5-7, 7-5 y 6-2.

    Cada uno con su camiseta.

    Cinco días después, otra vez juntos. Y ganando.

    ## Arce y Tello, otra vez

    El viernes, en cuartos, Maxi Arce y Juan Tello (8). Finalistas en Kuwait hace dos semanas.

    Hoy han remontado a Goñi y Edu Alonso (9): 3-6, 6-3 y 6-2. Ya les ganaron en las semifinales de Kuwait.

    Lebrón y Augsburger contra Arce y Tello se ha jugado tres veces este año: Londres, Róterdam y Düsseldorf.

    Las tres ganaron Lebrón y Augsburger.

    ## El resto del día

    Stupaczuk y Sanz (3) ganaron 6-3 y 6-4 a Sanyo y Maxi Sánchez (15).

    En cuartos tendrán a Juani De Pascual y Javi Garrido (14), que ganaron a Yanguas y Nieto (5) con dos tie-breaks: 7-6, 3-6 y 7-6. Dos horas y 34 minutos, el partido más largo del día.

    Bautista y Bergamini (11) remontaron a Guerrero y Leal (6): 1-6, 7-5 y 6-3.

    Jugarán contra Libaak y Alfonso (10), que ganaron 6-2 y 6-3 a la pareja lucky loser, Marcos González y Diego García. Son sus quintos cuartos seguidos en Premier: Róterdam, Düsseldorf, Milán, Kuwait y Dubái.

    Momo y Campagnolo (7) ganaron 6-3 y 6-3 a Jofre y Esbrí (12), en menos de una hora. Su rival: Flavio Abbate y Franco Dal Bianco, que ganaron 7-6 y 6-3 a Roglan y Aragón.

    Así se acaba el viaje de Roglan y Aragón, que [ayer remontaron a Paquito y Di Nenno](/actualidad/roglan-aragon-remontan-navarro-di-nenno-dubai-p1/). Cinco partidos en cinco días, desde la previa.

    Un apunte: España ganó el Mundial con ocho jugadores. En los cuartos de Dubái siguen dos: Lebrón y Sanz.

    ## Ellas

    Las cuatro primeras parejas, a cuartos.

    - **Triay y Brea (1):** 6-3 y 6-1 a Talaván y Saiz.
    - **Josemaría y Bea González (2):** 6-3 y 6-1 a Fassio y Virseda.
    - **Ari y Andrea (3):** 6-0 y 6-4 a Manquillo y Lucía Sainz, en una hora.
    - **Calvo y Claudia Fernández (4):** 7-6 y 6-4 a Castelló y Rodríguez.

    La sorpresa la dieron Jimena Velasco y Raquel Eugenio. Remontaron a Araújo y Ortega (5): 4-6, 6-4 y 6-3, en dos horas y ocho minutos. Eugenio tiene 18 años. El viernes, Ari y Andrea.

    ## Así quedan los cuartos

    Ellos:

    - Libaak / Alfonso (10) – Bautista / Bergamini (11)
    - De Pascual / Garrido (14) – Stupaczuk / Sanz (3)
    - Abbate / Dal Bianco – Momo / Campagnolo (7)
    - Arce / Tello (8) – Lebrón / Augsburger (2)

    Ellas:

    - Triay / Brea (1) – Jensen / Icardo (6)
    - Rufo / Iglesias – Calvo / Fernández (4)
    - Ari / Andrea (3) – Velasco / Eugenio
    - Guinart / Alonso (7) – Josemaría / Bea González (2)

    El sábado, Lebrón y Augsburger se jugaban un Mundial uno contra otro.

    El viernes, juntos, se juegan un sitio en las semifinales de Dubái.

en:
  slug: lebron-augsburger-quarter-finals-dubai-p1-arce-tello
  titulo: "Lebrón and Augsburger beat Víctor Ruiz and Rodrigo and will face Arce and Tello"
  entradilla: "With Coello and Tapia and Galán and Chingotto missing, they're the highest-ranked pair at the Dubai P1. On Friday, in the quarter-finals, the Kuwait finalists."
  seo_titulo: "Lebrón and Augsburger to face Arce and Tello in Dubai"
  seo_descripcion: "Lebrón and Augsburger beat Víctor Ruiz and Rodrigo 6-2, 6-4 and face Arce and Tello in the Dubai P1 quarter-finals. They've beaten them three times this year."
  palabra_clave: "Lebrón Augsburger Dubai P1"
  cuerpo: |
    Lebrón and Augsburger are into the Dubai P1 quarter-finals.

    Today they beat Víctor Ruiz and Facundo Rodrigo 6-2, 6-4. In an hour and nine minutes.

    Wednesday was harder. They lost the first set to Castaño and Pol Hernández and came back: 4-6, 6-3, 6-3.

    ## The highest-ranked pair

    Coello and Tapia aren't in Dubai, [because of Tapia's injury](/en/news/coello-tapia-out-dubai-p1-tapia-injury/). Neither are Galán and Chingotto.

    Without the top two, Lebrón and Augsburger are the highest-ranked pair in the draw. Second seeds.

    This year they've played four Premier finals. All four against Coello and Tapia. They won one: Brussels, in April.

    In Dubai, Coello and Tapia won't be on the other side of the net.

    ## From the World Cup to Dubai

    On Saturday, in [the World Cup final](/en/news/padel-world-cup-2026-final-spain-champions-argentina/), they were on opposite sides of the net. Lebrón and Goñi beat Augsburger and Di Nenno: 5-7, 7-5, 6-2.

    Each in his own shirt.

    Five days later, together again. And winning.

    ## Arce and Tello, again

    On Friday, in the quarter-finals: Maxi Arce and Juan Tello (8). Finalists in Kuwait two weeks ago.

    Today they came back against Goñi and Edu Alonso (9): 3-6, 6-3, 6-2. They had already beaten them in the Kuwait semi-finals.

    Lebrón and Augsburger against Arce and Tello has been played three times this year: London, Rotterdam and Düsseldorf.

    Lebrón and Augsburger won all three.

    ## The rest of the day

    Stupaczuk and Sanz (3) beat Sanyo and Maxi Sánchez (15) 6-3, 6-4.

    In the quarter-finals they'll face Juani De Pascual and Javi Garrido (14), who beat Yanguas and Nieto (5) through two tie-breaks: 7-6, 3-6, 7-6. Two hours and 34 minutes, the longest match of the day.

    Bautista and Bergamini (11) came back against Guerrero and Leal (6): 1-6, 7-5, 6-3.

    They'll play Libaak and Alfonso (10), who beat the lucky loser pair, Marcos González and Diego García, 6-2, 6-3. It's their fifth Premier quarter-final in a row: Rotterdam, Düsseldorf, Milan, Kuwait and Dubai.

    Momo and Campagnolo (7) beat Jofre and Esbrí (12) 6-3, 6-3 in under an hour. Their opponents: Flavio Abbate and Franco Dal Bianco, who beat Roglan and Aragón 7-6, 6-3.

    That ends the run of Roglan and Aragón, who [came back against Paquito and Di Nenno yesterday](/en/news/roglan-aragon-comeback-navarro-di-nenno-dubai-p1/). Five matches in five days, starting in qualifying.

    One more thing: Spain won the World Cup with eight players. Two of them are still in the Dubai quarter-finals: Lebrón and Sanz.

    ## Women

    The top four pairs are through to the quarter-finals.

    - **Triay and Brea (1):** 6-3, 6-1 against Talaván and Saiz.
    - **Josemaría and Bea González (2):** 6-3, 6-1 against Fassio and Virseda.
    - **Ari and Andrea (3):** 6-0, 6-4 against Manquillo and Lucía Sainz, in an hour.
    - **Calvo and Claudia Fernández (4):** 7-6, 6-4 against Castelló and Rodríguez.

    The surprise came from Jimena Velasco and Raquel Eugenio. They came back against Araújo and Ortega (5): 4-6, 6-4, 6-3, in two hours and eight minutes. Eugenio is 18. On Friday, Ari and Andrea.

    ## The quarter-finals

    Men:

    - Libaak / Alfonso (10) – Bautista / Bergamini (11)
    - De Pascual / Garrido (14) – Stupaczuk / Sanz (3)
    - Abbate / Dal Bianco – Momo / Campagnolo (7)
    - Arce / Tello (8) – Lebrón / Augsburger (2)

    Women:

    - Triay / Brea (1) – Jensen / Icardo (6)
    - Rufo / Iglesias – Calvo / Fernández (4)
    - Ari / Andrea (3) – Velasco / Eugenio
    - Guinart / Alonso (7) – Josemaría / Bea González (2)

    On Saturday, Lebrón and Augsburger were playing for a World Cup against each other.

    On Friday, together, they play for a place in the Dubai semi-finals.

