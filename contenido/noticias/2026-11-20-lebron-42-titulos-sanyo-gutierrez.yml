  titulo: "Lebrón suma 42 títulos y alcanza a Sanyo Gutiérrez"
  entradilla: "Con el Dubái P1, Juan Lebrón llega a 42 títulos y se pone a la altura de Sanyo Gutiérrez entre los jugadores en activo con más trofeos. Por delante, solo Tapia, Galán y Coello."
  seo_titulo: "Lebrón iguala a Sanyo con 42 títulos de pádel"
  seo_descripcion: "Juan Lebrón llega a 42 títulos tras ganar el Dubái P1 e iguala a Sanyo Gutiérrez. Así queda la lista de jugadores con más títulos que siguen en activo."
  palabra_clave: "jugadores con más títulos"
  cuerpo: |
    42.

    El domingo, Juan Lebrón [ganó el Dubái P1 con Leo Augsburger](/actualidad/lebron-augsburger-campeones-dubai-p1-libaak-alfonso/).

    Ese título traía algo más. Con él, Lebrón llega a 42 y alcanza a Sanyo Gutiérrez entre los jugadores en activo con más títulos.

    Es el recuento de Padel Addict, que suma Premier Padel, World Padel Tour y Padel Pro Tour.

    ## Solo tres por delante

    Así queda la lista de los jugadores en activo:

    - **Agustín Tapia:** 66
    - **Ale Galán:** 60
    - **Arturo Coello:** 59
    - **Juan Lebrón y Sanyo Gutiérrez:** 42
    - **Paquito Navarro:** 26
    - **Fede Chingotto y Maxi Sánchez:** 22
    - **Franco Stupaczuk:** 19
    - **Martín Di Nenno:** 15

    Tapia, con 27 años, ya está a la altura de Pablo Lima en la lista de todos los tiempos. Solo Fernando Belasteguín (162) y Juan Martín Díaz (116) tienen más.

    Coello, con 24, está a uno de Galán.

    Ninguno de los tres jugó en Dubái.

    ## La mayoría, con Galán

    La mayoría de esos 42 títulos llegaron al lado de Ale Galán. El último que ganaron juntos fue el de Riad, en marzo de 2024.

    Desde entonces, Lebrón ha sumado cuatro más, con tres compañeros distintos:

    - Martín Di Nenno: Finlandia, 2024.
    - Franco Stupaczuk: Cancún, 2025.
    - Leo Augsburger: Bruselas y Dubái, 2026.

    ## Dos torneos para quedarse solo

    A 2026 le quedan dos torneos: el Major de México, del 23 al 29 de noviembre, y [las Finals de Barcelona](/actualidad/premier-padel-finals-2026-barcelona-presentacion-record-publico/), del 10 al 13 de diciembre.

    Dos oportunidades para quedarse solo en el cuarto puesto.

    ## Ellas: Triay sigue arriba

    En la lista femenina manda [Gemma Triay, con 59](/actualidad/gemma-triay-59-titulos-record-historia/). Detrás, Alejandra Salazar y Ari Sánchez, con 58, y Paula Josemaría, con 52.

    La que más se ha movido esta semana es Claudia Fernández. Con el título de Dubái junto a Martina Calvo llega a 15, a uno de Marta Ortega. Tiene 20 años.

    Sanyo: 42 títulos y 42 años.

    Lebrón: los mismos títulos. Y once años menos.

