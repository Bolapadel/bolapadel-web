es:
  slug: grupos-mundial-padel-2026-qatar
  titulo: "Así quedan los grupos del Mundial de Qatar"
  entradilla: "Argentina, la campeona, con Francia, Australia y Países Bajos. España, con Emiratos, Suecia y Paraguay. Las españolas, con Brasil, Alemania y Gran Bretaña. Empieza mañana en Doha."
  seo_titulo: "Grupos del Mundial de pádel 2026 en Qatar"
  seo_descripcion: "Grupos del Mundial de pádel 2026: España, con Emiratos, Suecia y Paraguay; Argentina, con Francia, Australia y Países Bajos. Horarios y formato."
  palabra_clave: "grupos Mundial de pádel 2026"
  cuerpo: |
    El sábado, Coello y Tapia ganaron juntos el Major de Kuwait. Gemma Triay y Delfi Brea, también.

    Desde mañana, cada uno con su bandera.

    Hoy se han sorteado los grupos del Mundial de Qatar. 32 selecciones: 16 en el cuadro masculino y 16 en el femenino. Del 2 al 7 de noviembre, en el Khalifa International Tennis and Squash Complex de Doha.

    ## Ellos

    - **Grupo A:** Argentina, Francia, Australia y Países Bajos.
    - **Grupo B:** España, Emiratos Árabes Unidos, Suecia y Paraguay.
    - **Grupo C:** Portugal, Chile, Qatar y Alemania.
    - **Grupo D:** Italia, Brasil, Estados Unidos y México.

    Argentina defiende el título. Ganó los dos últimos Mundiales, Dubái 2022 y Doha 2024. Va a por el tercero seguido.

    En su grupo está Australia, que vuelve a un Mundial ocho años después. Se ganó la plaza esta semana en Kuwait, remontando a Egipto en la final de la fase de clasificación de Asia y África.

    España cae con Emiratos, Suecia y Paraguay.

    Hace dos años perdió la final aquí mismo, en Doha. Contra Argentina, 2-1. Vuelve sin Ale Galán, [baja por lesión](/actualidad/ale-galan-baja-mundial-qatar-lesion/). Su sitio es para [Javi Leal](/actualidad/javi-leal-sustituye-galan-mundial-qatar/).

    Portugal, que se llevó el bronce en 2024, su primera medalla, comparte grupo con la anfitriona, Qatar. Italia tiene a Brasil, Estados Unidos y México.

    Argentina y España, en grupos distintos. En la primera fase, [Coello y Tapia](/actualidad/coello-tapia-campeones-major-kuwait-numero-uno-2026/) no se cruzan.

    ## Ellas

    - **Grupo A:** España, Brasil, Alemania y Gran Bretaña.
    - **Grupo B:** Argentina, Francia, Chile y Bélgica.
    - **Grupo C:** Italia, Suecia, Egipto e Indonesia.
    - **Grupo D:** Portugal, Países Bajos, Estados Unidos y Paraguay.

    España ha ganado los seis últimos Mundiales femeninos. Va a por el séptimo seguido. Y llega con [Gemma Triay recién convertida en la jugadora con más títulos de la historia](/actualidad/gemma-triay-59-titulos-record-historia/).

    Argentina, finalista en las dos últimas ediciones, tiene a Francia, Chile y Bélgica.

    Egipto e Indonesia son las últimas en llegar. Se ganaron la plaza esta semana, también en Kuwait.

    ## Cómo se juega

    Cada selección se enfrenta a las otras tres de su grupo. Cada eliminatoria, al mejor de tres partidos.

    Los dos primeros de cada grupo pasan a cuartos. El resto sigue jugando toda la semana por los puestos del 9 al 16.

    - **Lunes 2 a miércoles 4:** fase de grupos.
    - **Jueves 5:** cuartos de final.
    - **Viernes 6:** semifinales.
    - **Sábado 7:** por la mañana, los partidos por el bronce. Después, las finales, en la pista central.

    Hay 1,2 millones de euros en premios, a partes iguales entre hombres y mujeres. Ningún Mundial había repartido tanto.

    ## A qué hora

    Ellas empiezan a las 12:00 en España. Ellos, a las 16:00. En Doha son las 14:00 y las 18:00. En Argentina, las 8:00 y las 12:00.

    Los 16 de [España](/actualidad/convocatoria-espana-mundial-padel-2026/) y los de [Argentina](/actualidad/convocatoria-argentina-mundial-padel-2026/) ya los conoces.

    Hasta el sábado, nada de parejas.

    Solo banderas.

en:
  slug: padel-world-cup-2026-groups-qatar
  titulo: "These are the groups for the World Cup in Qatar"
  entradilla: "Argentina, the champions, with France, Australia and the Netherlands. Spain, with the UAE, Sweden and Paraguay. The Spanish women, with Brazil, Germany and Great Britain. It starts tomorrow in Doha."
  seo_titulo: "2026 Padel World Cup groups in Qatar"
  seo_descripcion: "2026 Padel World Cup groups: Spain face the UAE, Sweden and Paraguay; Argentina face France, Australia and the Netherlands. Schedule and format."
  palabra_clave: "2026 Padel World Cup groups"
  cuerpo: |
    On Saturday, Coello and Tapia won the Kuwait Major together. So did Gemma Triay and Delfi Brea.

    From tomorrow, each of them under their own flag.

    Today the groups for the World Cup in Qatar were drawn. 32 national teams: 16 in the men's draw and 16 in the women's. From 2 to 7 November, at the Khalifa International Tennis and Squash Complex in Doha.

    ## The men

    - **Group A:** Argentina, France, Australia and the Netherlands.
    - **Group B:** Spain, United Arab Emirates, Sweden and Paraguay.
    - **Group C:** Portugal, Chile, Qatar and Germany.
    - **Group D:** Italy, Brazil, United States and Mexico.

    Argentina are defending the title. They won the last two World Cups, Dubai 2022 and Doha 2024. They're going for a third in a row.

    In their group is Australia, back at a World Cup eight years later. They earned their place this week in Kuwait, coming from behind against Egypt in the final of the Asia-Africa qualifiers.

    Spain get the UAE, Sweden and Paraguay.

    Two years ago they lost the final right here, in Doha. Against Argentina, 2-1. They return without Ale Galán, [out injured](/en/news/ale-galan-out-padel-world-cup-qatar-injury/). His place goes to [Javi Leal](/en/news/javi-leal-replaces-galan-padel-world-cup-qatar/).

    Portugal, who took bronze in 2024, their first ever medal, share a group with the hosts, Qatar. Italy have Brazil, the United States and Mexico.

    Argentina and Spain are in different groups. In the first stage, [Coello and Tapia](/en/news/coello-tapia-win-kuwait-major-year-end-number-one-2026/) won't meet.

    ## The women

    - **Group A:** Spain, Brazil, Germany and Great Britain.
    - **Group B:** Argentina, France, Chile and Belgium.
    - **Group C:** Italy, Sweden, Egypt and Indonesia.
    - **Group D:** Portugal, Netherlands, United States and Paraguay.

    Spain have won the last six women's World Cups. They're going for a seventh in a row. And they arrive with [Gemma Triay just crowned the player with the most titles in history](/en/news/gemma-triay-59-titles-most-titles-padel-history/).

    Argentina, runners-up in the last two editions, have France, Chile and Belgium.

    Egypt and Indonesia are the last to arrive. They earned their places this week, also in Kuwait.

    ## How it works

    Each team faces the other three in its group. Each tie, best of three matches.

    The top two in each group go through to the quarter-finals. The rest keep playing all week for places 9 to 16.

    - **Monday 2 to Wednesday 4:** group stage.
    - **Thursday 5:** quarter-finals.
    - **Friday 6:** semi-finals.
    - **Saturday 7:** in the morning, the bronze-medal matches. Then the finals, on the centre court.

    There's €1.2 million in prize money, split equally between men and women. No World Cup had ever paid out this much.

    ## What time

    The women start at 12:00 in Spain (CET). The men, at 16:00. In Doha it's 14:00 and 18:00. In Argentina, 8:00 and 12:00.

    You already know [Spain's 16](/en/news/spain-squad-padel-world-cup-2026/) and [Argentina's](/en/news/argentina-squad-padel-world-cup-2026/).

    Until Saturday, no partners.

    Only flags.

