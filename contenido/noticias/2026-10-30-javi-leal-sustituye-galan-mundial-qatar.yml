es:
  slug: javi-leal-sustituye-galan-mundial-qatar
  titulo: "Javi Leal sustituye a Galán en el Mundial de Qatar"
  entradilla: "Lo ha anunciado la Federación Española de Pádel este viernes, horas después de la baja de Ale Galán. Javi Leal, 23 años y número 16 del mundo, jugará su primer Mundial."
  seo_titulo: "Javi Leal sustituye a Galán en el Mundial de pádel"
  seo_descripcion: "Javi Leal sustituye a Ale Galán en la selección española para el Mundial de pádel de Qatar. El gaditano, número 16 del mundo, jugará su primer Mundial."
  palabra_clave: "Javi Leal Mundial"
  cuerpo: |
    Por la mañana, la baja. Al mediodía, el relevo.

    Javi Leal jugará el Mundial de Qatar.

    Lo ha anunciado la Federación Española de Pádel este viernes. Ocupa la plaza de [Ale Galán, que se pierde el Mundial por baja médica](/actualidad/ale-galan-baja-mundial-qatar-lesion/).

    Tiene 23 años. Será su primer Mundial.

    ## Del revés, como Galán

    Leal juega en el revés. Es diestro y es el número 16 del ranking.

    Su compañero en el circuito es Fran Guerrero.

    Estaba entre los doce preseleccionados. Pero cuando se cerró la lista, en septiembre, se quedó fuera: [la última plaza](/actualidad/convocatoria-espana-mundial-padel-2026/) fue para Aimar Goñi.

    Ahora entra él.

    ## Lo que pasó en Pretoria

    Hay un torneo que resume su año. El P1 de Pretoria, este verano.

    En cuartos, Leal y Guerrero ganaron a Lebrón y Augsburger. En tres sets.

    En semifinales, a Coello y Tapia: 7-5 y 7-5.

    En la final esperaban Galán y Chingotto. Se fue al tie-break del tercer set. Lo ganaron ellos.

    Tres meses después, Leal ocupa el sitio de Galán en la selección.

    Y jugará en el mismo equipo que Coello y Lebrón. Los dos a los que ganó aquella semana.

    ## De El Puerto

    Javi Leal nació en El Puerto de Santa María (Cádiz).

    Empezó a jugar con siete años, viendo a su padre. Su familia se fue a Madrid para que pudiera dedicarse al pádel.

    En El Puerto nació también Juan Lebrón.

    En Doha estarán en el mismo equipo.

    ## Su temporada

    Con Guerrero ha ganado este año los FIP Platinum de Marsella y Lyon. En Premier Padel, además de la final de Pretoria, ha llegado a cuartos en el Paris Major y en Milán.

    En Kuwait cayó el miércoles, en octavos. Contra Goñi y Edu Alonso: 6-4 y 6-4.

    En Doha, Goñi será su compañero de equipo.

    ## El lunes, Doha

    El Mundial se juega del 2 al 7 de noviembre. España no gana el título masculino desde 2021.

    Así queda la lista de Juanjo Gutiérrez: Arturo Coello, Juan Lebrón, Paquito Navarro, Jon Sanz, Mike Yanguas, Coki Nieto, Aimar Goñi y Javi Leal.

    Hace cinco semanas se quedó fuera.

    El lunes empieza su primer Mundial.

en:
  slug: javi-leal-replaces-galan-padel-world-cup-qatar
  titulo: "Javi Leal replaces Galán at the World Cup in Qatar"
  entradilla: "The Spanish Padel Federation announced it on Friday, hours after Ale Galán pulled out. Javi Leal, 23 and world number 16, will play his first World Cup."
  seo_titulo: "Javi Leal replaces Galán at the Padel World Cup"
  seo_descripcion: "Javi Leal replaces Ale Galán in Spain's squad for the Padel World Cup in Qatar. The world number 16 from Cádiz will play his first World Cup."
  palabra_clave: "Javi Leal World Cup"
  cuerpo: |
    In the morning, the withdrawal. By midday, the replacement.

    Javi Leal will play the World Cup in Qatar.

    The Spanish Padel Federation announced it on Friday. He takes the place of [Ale Galán, who misses the World Cup on medical grounds](/en/news/ale-galan-out-padel-world-cup-qatar-injury/).

    He's 23. It will be his first World Cup.

    ## On the backhand side, like Galán

    Leal plays on the backhand side. He's right-handed and ranked number 16.

    His partner on tour is Fran Guerrero.

    He was among the twelve players on the shortlist. But when the squad was finalised in September, he missed out: [the last spot](/en/news/spain-squad-padel-world-cup-2026/) went to Aimar Goñi.

    Now he's in.

    ## What happened in Pretoria

    One tournament sums up his year. The Pretoria P1, this summer.

    In the quarter-finals, Leal and Guerrero beat Lebrón and Augsburger. In three sets.

    In the semi-finals, Coello and Tapia: 7-5, 7-5.

    Galán and Chingotto were waiting in the final. It went to a third-set tie-break. They won it.

    Three months later, Leal takes Galán's place in the national team.

    And he'll be on the same team as Coello and Lebrón. The two he beat that week.

    ## From El Puerto

    Javi Leal was born in El Puerto de Santa María (Cádiz).

    He started playing at seven, watching his father. His family moved to Madrid so he could pursue padel.

    Juan Lebrón was born in El Puerto too.

    In Doha they'll be on the same team.

    ## His season

    With Guerrero he has won the FIP Platinum events in Marseille and Lyon this year. On the Premier Padel tour, besides the Pretoria final, he has reached the quarter-finals at the Paris Major and in Milan.

    In Kuwait he went out on Wednesday, in the round of 16. Against Goñi and Edu Alonso: 6-4, 6-4.

    In Doha, Goñi will be his teammate.

    ## Monday, Doha

    The World Cup runs from 2 to 7 November. Spain haven't won the men's title since 2021.

    This is Juanjo Gutiérrez's squad now: Arturo Coello, Juan Lebrón, Paquito Navarro, Jon Sanz, Mike Yanguas, Coki Nieto, Aimar Goñi and Javi Leal.

    Five weeks ago he missed out.

    On Monday, his first World Cup begins.

