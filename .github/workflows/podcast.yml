# Actualiza los episodios del podcast dos veces al día (Spotify for Creators + YouTube)
# y vuelve a construir la web si hay algo nuevo.
name: Actualizar podcast

on:
  schedule:
    - cron: "15 6,20 * * *"   # 8:15 y 22:15 hora de España (verano)
  workflow_dispatch: {}        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 markdown pyyaml pillow
      - run: python podcast.py
      - run: python construir.py
      - name: Guardar y publicar si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin episodios nuevos."
          else
            git commit -m "Podcast: episodios actualizados"
            git push
          fi
